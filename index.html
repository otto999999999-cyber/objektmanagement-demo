  function match(row,f){ for(var i=0;i<f.length;i++){ if(row[f[i][0]]!==f[i][1]) return false; } return true; }

    var a=DATA[this.t]||(DATA[this.t]=[]); var self=this; var out;
    if(this.op==="insert"||this.op==="upsert"){
      var key=(this.t==="app_users")?"email":(this.t==="reinigungsplan")?"house_id":"id";
      var arr=Array.isArray(this.row)?this.row:[this.row];
      arr.forEach(function(r){ var i=a.findIndex(function(x){return x[key]===r[key];}); if(i>=0) a[i]=Object.assign({},a[i],r); else a.push(Object.assign({},r)); });
      out={data:arr,error:null};
    } else if(this.op==="delete"){
      DATA[self.t]=a.filter(function(x){ return !match(x,self.f); });
      out={data:null,error:null};
    } else if(this.op==="update"){
      a.filter(function(x){return match(x,self.f);}).forEach(function(x){ Object.assign(x,self.row); });
      out={data:null,error:null};
    } else {
      var r=a.filter(function(x){ return match(x,self.f); });
      out=self._s ? {data:r[0]||null,error:null} : {data:r,error:null};
    }
    return Promise.resolve(out).then(res);

<style>
  :root{
    --bg:#EDF0F6; --bg2:#E0E5EF;

    --ink:#0A0E1A; --muted:#525C6E; --faint:#8A93A6;
    --line:#E2E7F0; --line2:#C9D1DF;
    --navy:#4F46E5; --navy-d:#3F37D6; --navy-soft:#EBEAFE;

    --mid:#D97706; --mid-bg:#FBEFDB;
    --bad:#E11D48; --bad-bg:#FCE4EA;
    --na:#6B7689; --na-bg:#EDF0F6;
    --grad:linear-gradient(120deg,#4F46E5 0%,#7C3AED 100%);
    --shadow:0 1px 2px rgba(10,14,26,.05), 0 12px 26px -16px rgba(10,14,26,.22);
    --shadow-lg:0 36px 80px -30px rgba(10,14,26,.5);

  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,sans-serif;

    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  h1,h2,h3{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-weight:800;letter-spacing:-.025em;margin:0;color:var(--ink)}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  ::-webkit-scrollbar{height:10px;width:10px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid var(--bg)}

  /* ---------- App shell ---------- */
  .app{max-width:1080px;margin:0 auto;padding:0 18px 90px;min-height:100vh}
  header.top{
    position:sticky;top:0;z-index:40;
    margin:0 -18px 26px;padding:16px 18px;
    background:#0E1220;
    background-image:linear-gradient(180deg,#161B2B 0%,#0C0F1A 100%);

    border-bottom:2px solid transparent;

  .brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}

    display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);backdrop-filter:blur(6px)}
  .logo svg{width:22px;height:22px}
  .brand h1{font-size:20px;color:#FFFFFF;line-height:1;font-weight:800}
  .brand .sub{font-size:11px;color:rgba(255,255,255,.78);letter-spacing:.08em;text-transform:uppercase;margin-top:4px;font-family:'Inter';font-weight:600}
  .save-ind{font-size:12px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:6px;opacity:0;transition:.3s;white-space:nowrap}

  .save-ind .dot{width:7px;height:7px;border-radius:50%;background:#7FFFC2}

  .menu-btn:hover{background:rgba(255,255,255,.26)}
  .menu-btn svg{width:20px;height:20px}

  .search-box{width:100%;max-width:560px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:up .18s}
  .search-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}

  .search-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:11px;background:none}
  .search-item:hover{background:var(--bg2)}

  .si-txt{min-width:0}
  .si-t{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .si-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .df-user{font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
  .crumb a{color:var(--navy);cursor:pointer;text-decoration:none;font-weight:600}
  .crumb a:hover{text-decoration:underline}
  .crumb .sep{color:var(--faint)}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;
    font-size:13.5px;font-weight:600;background:var(--surface2);color:var(--ink);
    border:1px solid var(--line2);transition:transform .12s, box-shadow .15s, border-color .15s, background .15s;white-space:nowrap}
  .btn:hover{border-color:var(--navy);background:#fff;transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(91,88,230,.5)}

  .btn.sm svg{width:14px;height:14px}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .page-head h2{font-size:30px;font-weight:800}

  .toolbar{display:flex;gap:9px;flex-wrap:wrap}
  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}

  .pick-n{font-size:14px;font-weight:600;color:var(--ink)}

  .sb-k{flex:0 0 42%;font-size:12.5px;color:var(--muted)}

  .house{padding:16px 16px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:transform .14s, box-shadow .16s, border-color .16s;position:relative;overflow:hidden}

  .empty h3{font-size:21px;color:var(--ink);margin-bottom:6px}

  /* ---------- Inspection timeline (Tagebuch) ---------- */
  .timeline{position:relative;padding-left:30px;margin-top:6px}
  .timeline::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--line2)}
  .tl-item{position:relative;margin-bottom:14px}
  .tl-item::before{content:"";position:absolute;left:-25px;top:20px;width:13px;height:13px;border-radius:50%;

  .tl-actions{display:flex;gap:7px;flex-wrap:wrap}

  .chip.bad{color:#C32B45}
  .chip.bad::before{background:var(--bad)}
  .chip.na{color:var(--na)}
  .chip.na::before{background:var(--na)}
  .chip .n{font-variant-numeric:tabular-nums}

  /* ---------- Editor ---------- */
  .insp-meta{padding:18px;display:grid;gap:14px;margin-bottom:16px}
  @media(min-width:640px){.insp-meta{grid-template-columns:1fr 1fr 1fr}}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .field input,.field select,.field textarea{
    padding:9px 11px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface2);width:100%}
  .field input:focus,.field select:focus,.field textarea:focus,.cell input:focus,.cell textarea:focus,.cell select:focus{
    outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}

  /* condition segmented control */

  .cmp-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
  .cmp{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;background:var(--surface)}

  .cmp .ar{font-family:'Plus Jakarta Sans';font-weight:600;font-size:14px;background:var(--bg2);min-width:150px}
  .cmp td .note{color:var(--muted);font-size:12.5px;margin-top:5px}
  .cmp td.changed{background:var(--mid-bg)}
  .cmp img.t{width:46px;height:46px;border-radius:6px;object-fit:cover;border:1px solid var(--line2);cursor:pointer;margin-top:6px;margin-right:4px}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .15s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);max-width:440px;width:100%;padding:24px;animation:pop .18s}
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal h3{font-size:21px;margin-bottom:4px}
  .modal p.m{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  .modal .field{margin-bottom:14px}
  .modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:8px}

  .lightbox{position:fixed;inset:0;background:rgba(15,13,10,.92);z-index:120;display:grid;place-items:center;padding:24px;animation:fade .15s}
  .lightbox img{max-width:100%;max-height:90vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .lightbox .lb-close{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}

  .col-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:300px;overflow-y:auto}

  .col-row input.cn{flex:1;border:none;background:transparent;font-weight:600;font-size:13.5px}
  .col-row input.cn:focus{outline:none}
  .col-row select{padding:5px 8px;border:1px solid var(--line2);border-radius:7px;font-size:12px}
  .col-row .lock{font-size:11px;color:var(--faint);padding:0 6px}

  .hint{font-size:12.5px;color:var(--muted);background:var(--navy-soft);border-radius:9px;padding:11px 13px;display:flex;gap:8px;align-items:flex-start;margin-bottom:16px}
  .hint svg{width:16px;height:16px;color:var(--navy);flex-shrink:0;margin-top:1px}

  .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;flex:1;min-width:140px;box-shadow:var(--shadow)}
  .stat .num{font-family:'Plus Jakarta Sans';font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}

  .stat.bad .num{color:var(--bad)}
  .def-group{margin-bottom:22px}
  .def-group h3{font-size:19px;display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .def-group .gsub{font-size:12.5px;color:var(--muted);margin-bottom:11px}
  .def-group .gcount{background:var(--bad-bg);color:var(--bad);font-family:'Inter';font-size:13px;font-weight:700;padding:2px 10px;border-radius:20px}
  .def{padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;border-left:4px solid var(--bad)}
  .def.mid{border-left-color:var(--mid)}
  .filterbar{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px;margin-bottom:18px}
  .filterbar .ff{display:flex;flex-direction:column;gap:5px;flex:1;min-width:160px}
  .filterbar .ff label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .filterbar .ff select{padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--surface2);font-size:13.5px;font-weight:500}
  .filterbar .ff select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
  .def .body{flex:1;min-width:0}
  .def .area{font-family:'Plus Jakarta Sans';font-size:16px;font-weight:700;margin-bottom:3px;letter-spacing:-.01em}
  .def .kv{font-size:13px;color:var(--ink);margin-top:3px}
  .def .kv b{color:var(--muted);font-weight:600}
  .def .thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;border:1px solid var(--line2);cursor:pointer;flex-shrink:0}
  .thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;border:1px solid var(--line2);background:var(--bg2)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap}
  .thumb-wrap{position:relative;width:64px;height:64px}
  .thumb-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.3);border:2px solid var(--surface)}
  .thumb-x svg{width:11px;height:11px}
  .lb-bg{position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:150;display:grid;place-items:center;padding:24px;cursor:zoom-out}
  .lb-bg img{max-width:96vw;max-height:92vh;border-radius:10px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
  .def .prio{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-top:6px;text-transform:uppercase;letter-spacing:.03em}
  .prio-hoch{background:var(--bad-bg);color:var(--bad)} .prio-mittel{background:var(--mid-bg);color:var(--mid)}
  .prio-niedrig{background:var(--na-bg);color:var(--na)} .prio-keine{background:var(--na-bg);color:var(--na)}

  .pdf-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:130;display:grid;place-items:center}
  .pdf-box{background:var(--surface);border-radius:var(--r);padding:26px 34px;text-align:center;box-shadow:var(--shadow-lg)}
  .pdf-box .spin{width:34px;height:34px;border:3px solid var(--line2);border-top-color:var(--navy);border-radius:50%;margin:0 auto 14px;animation:rot 1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#F4F2EC;
    padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);z-index:140;animation:up .25s}
  @keyframes up{from{transform:translateX(-50%) translateY(14px);opacity:0}to{transform:translateX(-50%);opacity:1}}
</style>
</head>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9h0M9 12h0M9 15h0M9 18h0"/></svg>

<script>
"use strict";

/* =====================================================================
   SUPABASE-KONFIGURATION  —  HIER DIE BEIDEN WERTE EINTRAGEN
   (aus dem Supabase-Dashboard: Connect bzw. Project Settings → API Keys)
   ===================================================================== */
const SUPABASE_URL      = "https://avqjtpnydehiwhrhxcci.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KJ6XRNGM9rI_I2ckTux5uw_JxKCKH4m";
const BUCKET = "fotos";
/* ===================================================================== */

let sb = null;
function cfgPlaceholder(){ return SUPABASE_URL.includes("DEIN-") || SUPABASE_ANON_KEY.includes("DEIN-"); }
function libReady(){ return typeof window!=="undefined" && window.supabase && typeof window.supabase.createClient==="function"; }

/* ---- Datenbank-Ebene (Tabellen houses + inspections) ---- */
function normInsp(d){
  if(!d) return null;
  return { id:d.id, houseId:d.house_id, date:d.date||"", inspector:d.inspector||"", firm:d.firm||"",
    weather:d.weather||"", columns:d.columns||defaultColumns(), rows:d.rows||[],
    finalizedAt: d.finalized_at? Date.parse(d.finalized_at) : null,
    updatedAt: d.updated_at? Date.parse(d.updated_at) : Date.now() };
}
const DB = {
  async listHouses(){
    const { data, error } = await sb.from('houses').select('id,name,unit,address,lat,lng,created_at').order('name',{ascending:true});
    if(error){ console.error(error); toast("Objekte konnten nicht geladen werden."); return []; }
    return (data||[]).map(h=>({id:h.id,name:h.name,unit:h.unit||"",address:h.address||"",lat:h.lat==null?null:Number(h.lat),lng:h.lng==null?null:Number(h.lng)}));
  },
  async addHouse(h){
    const row={ id:uid(), name:h.name, unit:h.unit||null, address:h.address||null };
    const { error } = await sb.from('houses').insert(row);
    if(error){ console.error(error); throw error; }
    return {id:row.id,name:row.name,unit:row.unit||"",address:row.address||"",lat:null,lng:null};
  },
  async saveHouseLocation(id,lat,lng){
    const { error } = await sb.from('houses').update({lat,lng}).eq('id',id);
    if(error){ console.error(error); throw error; }
  },
  async getHouseStammdaten(id){
    const { data, error } = await sb.from('houses').select('stammdaten').eq('id',id).maybeSingle();
    if(error){ console.error(error); return {}; }
    return (data&&data.stammdaten)||{};
  },
  async saveHouseStammdaten(id,obj){
    const { error } = await sb.from('houses').update({stammdaten:obj}).eq('id',id);
    if(error){ console.error(error); throw error; }
  },
  async listDocuments(houseId){
    const { data, error } = await sb.from('documents').select('*').eq('house_id',houseId).order('created_at',{ascending:false});
    if(error){ console.error(error); return []; }
    return (data||[]).map(d=>({id:d.id,houseId:d.house_id,unit:d.unit||"",category:d.category||"Sonstiges",name:d.name||"",path:d.path||"",mime:d.mime||"",size:d.size||0,note:d.note||"",createdBy:d.created_by||"",createdAt:d.created_at||""}));
  },
  async saveDocument(d){
    const row={ id:d.id, house_id:d.houseId, unit:d.unit||null, category:d.category||null, name:d.name||null, path:d.path||null, mime:d.mime||null, size:d.size||null, note:d.note||null, created_by:d.createdBy||null };
    const { error } = await sb.from('documents').upsert(row); if(error){ console.error(error); throw error; }
  },
  async deleteDocument(id){ const { error }=await sb.from('documents').delete().eq('id',id); if(error) console.error(error); },
  async listKontakte(){
    const { data, error } = await sb.from('kontakte').select('*').order('name',{ascending:true});
    if(error){ console.error(error); return []; }
    return (data||[]).map(normKontakt);
  },
  async saveKontakt(k){
    const row={ id:k.id, name:k.name||null, gewerk:k.gewerk||null, person:k.person||null, phone:k.phone||null, email:k.email||null, address:k.address||null, note:k.note||null };
    const { error } = await sb.from('kontakte').upsert(row); if(error){ console.error(error); throw error; }
  },
  async deleteKontakt(id){ const { error }=await sb.from('kontakte').delete().eq('id',id); if(error) console.error(error); },
  async allInspMeta(){
    const { data, error } = await sb.from('inspections').select('id,house_id,date').order('date',{ascending:false});
    if(error){ console.error(error); return []; }
    return data||[];
  },
  async listInspections(houseId){
    const { data, error } = await sb.from('inspections').select('*').eq('house_id',houseId).order('date',{ascending:false});
    if(error){ console.error(error); return []; }
    return (data||[]).map(normInsp);
  },
  async getInspection(id){
    const { data, error } = await sb.from('inspections').select('*').eq('id',id).maybeSingle();
    if(error){ console.error(error); return null; }
    return normInsp(data);
  },
  async saveInspection(insp){
    const row={ id:insp.id, house_id:insp.houseId, date:insp.date||null, inspector:insp.inspector||null,
      firm:insp.firm||null, weather:insp.weather||null, columns:insp.columns, rows:insp.rows,
      finalized_at: insp.finalizedAt? new Date(insp.finalizedAt).toISOString() : null,
      updated_at: new Date().toISOString() };
    const { error } = await sb.from('inspections').upsert(row);
    if(error){ console.error(error); throw error; }
  },
  async deleteInspection(id){
    const { error } = await sb.from('inspections').delete().eq('id',id);
    if(error) console.error(error);
  },
  async allInspectionsFull(){
    const { data, error } = await sb.from('inspections').select('id,house_id,date,inspector,finalized_at,columns,rows').order('date',{ascending:false});
    if(error){ console.error(error); return []; }
    return (data||[]).map(normInsp);
  },
  /* ---- Technik & Wartung ---- */
  async listAnlagen(houseId){
    const { data, error } = await sb.from('anlagen').select('*').eq('house_id',houseId).order('name',{ascending:true});
    if(error){ console.error(error); return []; }
    return (data||[]).map(normAnlage);
  },
  async allAnlagen(){
    const { data, error } = await sb.from('anlagen').select('*');
    if(error){ console.error(error); return []; }
    return (data||[]).map(normAnlage);
  },
  async saveAnlage(a){
    const row={ id:a.id, house_id:a.houseId, name:a.name||null, interval_months:a.interval||null,
      last_date:a.lastDate||null, firm:a.firm||null, note:a.note||null, art:a.art||null, updated_at:new Date().toISOString() };
    const { error } = await sb.from('anlagen').upsert(row);
    if(error){ console.error(error); throw error; }
  },
  async deleteAnlage(id){
    const { error } = await sb.from('anlagen').delete().eq('id',id);
    if(error) console.error(error);
  },
  /* ---- Wartungs-Historie ---- */
  async listWartungLog(anlageId){
    const { data, error } = await sb.from('wartung_log').select('*').eq('anlage_id',anlageId).order('date',{ascending:false});
    if(error){ console.error(error); return []; }
    return (data||[]).map(w=>({id:w.id,anlageId:w.anlage_id,houseId:w.house_id||"",date:w.date||"",firm:w.firm||"",note:w.note||"",createdBy:w.created_by||""}));
  },
  async saveWartungLog(w){
    const row={ id:w.id, anlage_id:w.anlageId, house_id:w.houseId||null, date:w.date||null, firm:w.firm||null, note:w.note||null, created_by:w.createdBy||null };
    const { error } = await sb.from('wartung_log').upsert(row);
    if(error){ console.error(error); throw error; }
  },
  async deleteWartungLog(id){ const { error }=await sb.from('wartung_log').delete().eq('id',id); if(error) console.error(error); },

function getPosition(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){ reject(new Error("Standort wird von diesem Gerät/Browser nicht unterstützt.")); return; }
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy}),
      e=>{ const m={1:"Standortfreigabe wurde abgelehnt. Bitte im Browser erlauben.",2:"Standort nicht verfügbar.",3:"Zeitüberschreitung bei der Standortbestimmung."}; reject(new Error(m[e.code]||"Standort konnte nicht ermittelt werden.")); },
      {enableHighAccuracy:true, timeout:15000, maximumAge:0}
    );
  });
}
function haversine(aLat,aLng,bLat,bLng){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(bLat-aLat), dLng=toR(bLng-aLng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toR(aLat))*Math.cos(toR(bLat))*Math.sin(dLng/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(s)));
}

function addMonthsISO(iso, months){ if(!iso||!months) return ""; const d=new Date(iso+"T00:00:00"); d.setMonth(d.getMonth()+Number(months)); return d.toISOString().slice(0,10); }

const DUE_SOON_DAYS = 30;
function wartStatus(a){
  // -> {next, days, level: 'overdue'|'soon'|'ok'|'none', label}
  if(!a.interval || !a.lastDate) return {next:"", days:null, level:"none", label:"kein Intervall"};
  const next=addMonthsISO(a.lastDate, a.interval);
  const d=daysUntil(next);
  let level="ok", label="planmäßig";
  if(d<0){ level="overdue"; label="überfällig"; }
  else if(d<=DUE_SOON_DAYS){ level="soon"; label="bald fällig"; }
  return {next, days:d, level, label};
}

/* ===================== Bildkompression ===================== */
function compressFile(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",quality));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
function recompressDataURL(dataURL, maxDim, quality){
  return new Promise((resolve)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/jpeg",quality));
    };
    img.onerror=()=>resolve(dataURL); img.src=dataURL;
  });
}

  S.hidx=insps.map(it=>({id:it.id,date:it.date,inspector:it.inspector,updatedAt:it.updatedAt,finalized:!!it.finalizedAt,counts:countCond(it)}));
  S.anlagen=await DB.listAnlagen(id);
  render();
}
async function newInspection(){
  const house=S.houses.find(h=>h.id===S.houseId);
  let columns, rows, firm="";
  if(S.hidx.length){
    const last=await DB.getInspection(S.hidx[0].id);
    if(last){
      columns=JSON.parse(JSON.stringify(last.columns));
      rows=last.rows.map(r=>{ const nc={}; columns.forEach(c=> nc[c.id]= c.type==="area"? (r.cells[c.id]||"") : ""); return {id:uid(),cells:nc,images:[]}; });
      firm=last.firm||"";
    }
  }
  if(!columns){ columns=defaultColumns(); rows=defaultRows(); }
  S.insp={ id:uid(), houseId:S.houseId, date:todayISO(), inspector:"", firm, weather:"", columns, rows, createdAt:Date.now(), updatedAt:Date.now() };
  await buildPrevMap();
  S.readonly=false; S.view="editor"; render();
  await persistInsp();
}
async function editInspection(id, readonly){
  const insp=await DB.getInspection(id);
  if(!insp){ toast("Begehung nicht gefunden."); return; }
  S.insp=insp; S.readonly=!!readonly; S.view=readonly?"viewer":"editor";
  await buildPrevMap();
  render();
}
async function buildPrevMap(){
  S.prevMap={};
  if(!S.insp) return;
  const prior=S.hidx.filter(x=>x.id!==S.insp.id)
                 .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.updatedAt||0)-(a.updatedAt||0))
                 .filter(x=>(x.date||"")<=(S.insp.date||"9999"));
  if(!prior.length) return;
  const prev=await DB.getInspection(prior[0].id);
  if(!prev) return;
  const condCol=prev.columns.find(c=>c.type==="condition");
  const noteCol=prev.columns.find(c=>c.type==="longtext")||prev.columns.find(c=>c.type==="text");
  prev.rows.forEach(r=>{
    const key=normArea(r.cells.area);
    if(!key) return;
    S.prevMap[key]={ date:prev.date, cond:condCol? r.cells[condCol.id] : "", note:noteCol? r.cells[noteCol.id] : "", img:(r.images&&r.images[0])||null };
  });
  S._prevDate=prev.date;
}
const normArea = s => (s||"").trim().toLowerCase().replace(/\s+/g," ");

function renderObjList(){
  const box=document.getElementById("objList"); if(!box) return;
  let list=(S.houses||[]).slice();
  const q=(S.homeFilter||"").trim();
  if(q) list=list.filter(o=>objMatch(o,q));
  const sort=S.homeSort||"name";
  if(sort==="name") list.sort((a,b)=>(a.name||"").localeCompare(b.name||"","de"));
  else if(sort==="recent") list.sort((a,b)=>(b.last||"").localeCompare(a.last||"")|| (a.name||"").localeCompare(b.name||"","de"));
  else if(sort==="attention") list.sort((a,b)=>houseAttn(b)-houseAttn(a) || (a.name||"").localeCompare(b.name||"","de"));
  const total=(S.houses||[]).length, shown=list.length;
  const limit=S.homeLimit||40;
  const page=list.slice(0,limit);
  let inner;
  if(!page.length){
    inner=`<div class="empty card" style="border-style:dashed">${I.search}<h3>Keine Treffer</h3><p>Für „${esc(q)}" wurde kein Objekt gefunden.</p></div>`;
  } else if((S.homeView||"cards")==="cards"){
    inner=`<div class="grid cols2">`+page.map(houseCard).join("")+`</div>`;
  } else {
    inner=`<div class="objlist">`+page.map(houseRow).join("")+`</div>`;
  }
  const more = list.length>limit ? `<div style="text-align:center;margin-top:14px"><button class="btn" onclick="objMore()">${I.chevDown||""} ${list.length-limit} weitere anzeigen</button></div>` : "";
  const count = `<div class="objcount">${shown===total?`${total} Objekte`:`${shown} von ${total} Objekten`}${list.length>limit?` · zeige ${limit}`:""}</div>`;
  box.innerHTML=count+inner+more;
}

async function fillDashboard(){
  const el=document.getElementById("dashCards"); if(!el) return;
  el.innerHTML=`<div class="dash-load">Übersicht wird geladen…</div>`;
  const d={};
  try{
    if(canArea("tickets")){ const t=S.tickets&&S.tickets.length!==undefined?S.tickets:(S.tickets=await DB.listTickets()); d.tkOpen=t.filter(x=>x.status!=="erledigt").length; d.tkOver=t.filter(tkOverdue).length; }
    if(canArea("objekte")){
      const an=await DB.allAnlagen();
      d.wOver=an.filter(x=>wartStatus(x).level==="overdue").length;
      d.wSoon=an.filter(x=>wartStatus(x).level==="soon").length;
      const defs=await collectDefects();
      d.mCount=defs.reduce((s,g)=>s+g.defs.filter(x=>x.cond==="mangelhaft").length,0);
      d.mHouses=defs.filter(g=>g.defs.some(x=>x.cond==="mangelhaft")).length;
      const attn={};
      defs.forEach(g=>{ const c=g.defs.filter(x=>x.cond==="mangelhaft").length; if(c){ (attn[g.house.id]=attn[g.house.id]||{defects:0,wartOver:0}).defects+=c; } });
      an.forEach(a=>{ if(wartStatus(a).level==="overdue"){ const id=a.houseId; (attn[id]=attn[id]||{defects:0,wartOver:0}).wartOver++; } });
      S.houseAttn=attn;
      if(S.view==="home") renderObjList();
    }
    if(canArea("aufzuege")){
      const az=await DB.listAufzuege();
      d.azOver=az.filter(x=>liftWart(x).level==="overdue"||liftTuev(x).level==="overdue").length;
      const meta=await DB.allMeldungenMeta();
      d.azMeld=meta.filter(m=>m.status!=="behoben").length;
    }
    if(canArea("reinigung")){ const rs=await DB.reinigungStats(); d.rToday=rs.today; d.rLaufend=rs.laufend; }
    if(canArea("sanierung")){ const sa=await DB.listSanierungen(); d.sLauf=sa.filter(x=>x.status==="laufend").length; }
    if(canArea("objekte")||canArea("aufzuege")){ const l=await DB.listMeldungenLog(); d.mlOver=l.filter(logOverdue).length; d.mlOpen=l.filter(x=>x.status!=="erledigt").length; }
  }catch(e){ console.error(e); }
  S.dash=d;
  // Menü-Badge konsistent aus denselben Zahlen

async function refreshHouseStats(){
  const meta=await DB.allInspMeta();   // [{id,house_id,date}] absteigend nach Datum
  const byHouse={};
  meta.forEach(m=>{ const h=byHouse[m.house_id]||(byHouse[m.house_id]={count:0,last:null}); h.count++; if(!h.last||(m.date||"")>h.last) h.last=m.date; });
  let changed=false;
  for(const o of S.houses){
    const s=byHouse[o.id]||{count:0,last:null};
    if(o.count!==s.count||o.last!==s.last){ o.count=s.count; o.last=s.last; changed=true; }
  }
  if(changed && S.view==="home") renderObjList();
}

function houseBegehungenHTML(items){
  let tl;
  if(!items.length){
    tl=`<div class="empty card" style="border-style:dashed">${I.book}<h3>Noch keine Begehung</h3><p>Starte die erste Begehung für dieses Objekt.</p>
        <div style="margin-top:18px"><button class="btn primary" onclick="newInspection()">${I.plus} Begehung starten</button></div></div>`;
  } else {
    tl=`<div class="timeline">`+items.map(it=>{
      const c=it.counts||{gut:0,mittel:0,mangelhaft:0};
      const chips=[];
      if(c.gut) chips.push(`<span class="chip good">${c.gut} gut</span>`);
      if(c.mittel) chips.push(`<span class="chip mid">${c.mittel} mittel</span>`);
      if(c.mangelhaft) chips.push(`<span class="chip bad">${c.mangelhaft} Mangel</span>`);
      if(!chips.length) chips.push(`<span class="chip na">ohne Bewertung</span>`);
      return `<div class="tl-item"><div class="tl-card card">
        <div class="tl-date">${esc(fmtShort(it.date))}<small>${esc(it.inspector||"ohne Begeher")}${it.finalized?" · ✓ abgeschlossen":""}</small></div>
        <div class="tl-stats">${chips.join("")}</div>
        <div class="tl-actions">
          <button class="btn sm" onclick="editInspection('${it.id}',true)">${I.eye} Ansehen</button>
          <button class="btn sm" onclick="editInspection('${it.id}',false)">${I.edit} Bearbeiten</button>
          <button class="btn sm" onclick="exportPDF('${it.id}')">${I.pdf} PDF</button>
          <button class="btn sm danger" onclick="delInspection('${it.id}')">${I.trash}</button>
        </div>
      </div></div>`;
    }).join("")+`</div>`;
  }
  return `${items.length?`<div class="hint">${I.info}<div>Die <b>neue Begehung</b> übernimmt automatisch die Bereiche &amp; Spalten der letzten Begehung als Vorlage. Beim Bearbeiten siehst du pro Bereich den <b>Vorbefund</b> der letzten Begehung zum direkten Abgleich.</div></div>`:""}${tl}`;

function houseWartungHTML(){
  const list=(S.anlagen||[]).slice().sort((a,b)=>{
    const da=wartStatus(a).days, db=wartStatus(b).days;
    return (da==null?1e9:da)-(db==null?1e9:db);
  });
  if(!list.length){
    return `<div class="empty card" style="border-style:dashed">${I.wrench}<h3>Noch keine Anlagen erfasst</h3>
      <p>Trage technische Anlagen mit ihrem Wartungsintervall ein – die nächste Fälligkeit wird automatisch berechnet.</p>
      <div style="margin-top:18px"><button class="btn primary" onclick="addAnlage()">${I.plus} Anlage hinzufügen</button></div></div>`;
  }
  const rows=list.map(a=>{
    const s=wartStatus(a);
    const due = s.level==="none"?`<span class="chip na">kein Intervall</span>`
      : `<span class="chip ${wartClass(s.level)}">${s.label}${s.days!=null?` · ${s.days<0?Math.abs(s.days)+' T überfällig':'in '+s.days+' T'}`:""}</span>`;
    const iv = a.interval?`alle ${a.interval} Mon.`:"–";
    return `<div class="def card ${s.level==="soon"?"mid":""}" style="border-left-color:var(--${s.level==="overdue"?"bad":s.level==="soon"?"mid":s.level==="ok"?"good":"na"})">
      <div class="body">
        <div class="area">${esc(a.name||"(ohne Bezeichnung)")} ${a.art?`<span class="chip na" style="font-weight:600">${esc(a.art)}</span>`:""} ${due}</div>
        <div class="kv"><b>Intervall:</b> ${iv}${a.firm?` &nbsp;·&nbsp; <b>Fachfirma:</b> ${esc(a.firm)}`:""}</div>
        <div class="kv"><b>Letzte Wartung:</b> ${a.lastDate?esc(fmtShort(a.lastDate)):"–"} &nbsp;·&nbsp; <b>Nächste:</b> ${s.next?esc(fmtShort(s.next)):"–"}</div>
        ${a.note?`<div class="kv" style="color:var(--muted)">${esc(a.note)}</div>`:""}
        <div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">
          <button class="btn sm" onclick="wartungDone('${a.id}')">${I.done} Wartung heute erledigt</button>
          <button class="btn sm" onclick="openWartHist('${a.id}')">${I.book} Historie</button>
          <button class="btn sm" onclick="addAnlage('${a.id}')">${I.edit} Bearbeiten</button>
          <button class="btn sm danger" onclick="delAnlage('${a.id}')">${I.trash}</button>
        </div>
      </div></div>`;
  }).join("");
  return rows;
}

function exportStammblattPDF(){
  if(!window.jspdf){ toast("PDF-Bibliothek lädt noch – bitte erneut versuchen."); return; }
  const o=S.houses.find(x=>x.id===S.houseId); if(!o) return; const d=S.stamm||{};
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
  const PW=210,PH=297,M=15; let y=M;
  const navy=[79,76,220],muted=[110,106,96],ink=[20,23,38];
  const footer=()=>{ doc.setFontSize(8);doc.setFont("helvetica","normal");doc.setTextColor(...muted);doc.text("Stammblatt · "+o.name+" · Stand "+fmtShort(todayISO()),M,PH-8);doc.text("Seite "+doc.internal.getNumberOfPages(),PW-M,PH-8,{align:"right"}); };
  const ensure=h=>{ if(y+h>PH-14){ footer(); doc.addPage(); y=M; } };
  doc.setFillColor(...navy);doc.rect(0,0,PW,26,"F");
  doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(17);doc.text("Objekt-Stammblatt",M,13);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text(o.name||"",M,20.5);
  doc.setFontSize(8.5);doc.text("Stand "+fmtShort(todayISO()),PW-M,20.5,{align:"right"});
  y=34;
  doc.setFontSize(9);doc.setTextColor(...muted);
  const base=[o.unit?("WE "+o.unit.replace(/^WE\s*/i,"")):"",o.address||""].filter(Boolean).join("   ·   ");
  if(base){ doc.text(base,M,y); y+=8; }
  let any=false;

function inspDefCols(ins){
  const condCol=(ins.columns||[]).find(c=>c.type==="condition");
  const textCols=(ins.columns||[]).filter(c=>c.type!=="area"&&c.type!=="condition");
  const prioCol=(ins.columns||[]).find(c=>c.type==="select"&&/prio/i.test(c.label));
  return {condCol,textCols,prioCol};
}
function extractDefects(ins){
  if(!ins) return [];
  const {condCol,textCols,prioCol}=inspDefCols(ins); if(!condCol) return [];
  const out=[];
  (ins.rows||[]).forEach(r=>{ const cond=r.cells[condCol.id]; if(cond!=="mangelhaft"&&cond!=="mittel") return;
    const fields=textCols.filter(c=>c!==prioCol).map(c=>({label:c.label,val:r.cells[c.id]})).filter(f=>f.val);
    out.push({area:r.cells.area||"(ohne Bezeichnung)",fields,cond,prio:prioCol?(r.cells[prioCol.id]||""):""}); });
  return out;
}
function defectCount(ins){
  const {condCol}=inspDefCols(ins); if(!condCol) return {bad:0,mid:0};
  let bad=0,mid=0; (ins.rows||[]).forEach(r=>{ const c=r.cells[condCol.id]; if(c==="mangelhaft")bad++; else if(c==="mittel")mid++; });
  return {bad,mid};
}

/* ---- Objekt-Standort festlegen ---- */
function setObjLocation(){
  if(!canArea("objekte")) return;
  const o=S.houses.find(x=>x.id===S.cleanHouseId);
  modal(`<h3>Objekt-Standort festlegen</h3>
    <p class="m">Der Standort dient zum Abgleich „am Objekt?" beim Ein-/Ausstempeln. Entweder direkt am Objekt per GPS erfassen oder Koordinaten manuell eintragen (z. B. aus Google Maps).</p>
    <button class="btn primary" style="width:100%;justify-content:center;margin-bottom:12px" onclick="saveObjLocGps()">${I.mapPin} Aktuellen Standort verwenden (ich bin am Objekt)</button>
    <div class="field" style="margin-bottom:8px"><label>oder Breitengrad (lat)</label><input id="olLat" type="number" step="0.0000001" value="${o&&o.lat!=null?o.lat:""}"></div>
    <div class="field" style="margin-bottom:8px"><label>Längengrad (lng)</label><input id="olLng" type="number" step="0.0000001" value="${o&&o.lng!=null?o.lng:""}"></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Abbrechen</button>
    <button class="btn primary" onclick="saveObjLocManual()">Speichern</button></div>`);
}
async function saveObjLocGps(){
  const ov=geoOverlay("Standort wird ermittelt…");
  try{
    const p=await getPosition(); ov.remove();
    await applyObjLoc(p.lat,p.lng);
  }catch(e){ ov.remove(); showError("Standort konnte nicht ermittelt werden", e.message||e); }
}
async function saveObjLocManual(){
  const lat=parseFloat(document.getElementById("olLat").value), lng=parseFloat(document.getElementById("olLng").value);
  if(isNaN(lat)||isNaN(lng)){ toast("Bitte gültige Koordinaten eingeben."); return; }
  await applyObjLoc(lat,lng);
}
async function applyObjLoc(lat,lng){
  try{ await DB.saveHouseLocation(S.cleanHouseId, lat, lng); }catch(e){ showError("Standort konnte nicht gespeichert werden", e); return; }
  const o=S.houses.find(x=>x.id===S.cleanHouseId); if(o){ o.lat=lat; o.lng=lng; }
  closeModal(); renderReinigungObjekt(); toast("Objekt-Standort gespeichert.");
}

/* ---- Ein-/Ausstempeln ---- */
async function clockIn(){
  if((S.nachweise||[]).some(n=>n.status==="laufend")){ toast("Es läuft bereits eine Erfassung."); return; }
  const o=S.houses.find(x=>x.id===S.cleanHouseId);
  const ov=geoOverlay("Einstempeln – Standort wird ermittelt…");
  try{
    const p=await getPosition(); ov.remove();
    const dist = (o&&o.lat!=null)? haversine(o.lat,o.lng,p.lat,p.lng) : null;
    const n={ id:uid(), houseId:S.cleanHouseId, date:todayISO(), status:"laufend", done:[], dl:"", person:"", note:"", createdBy:S.userEmail||"",
      startAt:new Date().toISOString(), startLat:p.lat, startLng:p.lng, startAcc:Math.round(p.acc), distStart:dist };
    await DB.saveNachweis(n);
    (S.nachweise=S.nachweise||[]).unshift(n);
    renderReinigungObjekt();
    toast(dist!=null && dist>GEO_WARN_M ? `Eingestempelt – Achtung: ${dist} m vom Objekt entfernt.` : "Eingestempelt.");
  }catch(e){ ov.remove(); showError("Einstempeln nicht möglich", e.message||e); }
}
async function clockOut(id){
  const o=S.houses.find(x=>x.id===S.cleanHouseId);
  const ov=geoOverlay("Ausstempeln – Standort wird ermittelt…");
  try{
    const p=await getPosition(); ov.remove();
    const dist = (o&&o.lat!=null)? haversine(o.lat,o.lng,p.lat,p.lng) : null;
    S._clockEnd={ id, endAt:new Date().toISOString(), endLat:p.lat, endLng:p.lng, endAcc:Math.round(p.acc), distEnd:dist };
    abzeichnen();
  }catch(e){ ov.remove(); showError("Ausstempeln nicht möglich", e.message||e); }
}

/* ---- Abzeichnung / Tätigkeitsnachweis ---- */
function abzeichnen(){
  const completing = S._clockEnd ? (S.nachweise||[]).find(n=>n.id===S._clockEnd.id) : null;
  const tasks=(S.plan&&S.plan.tasks)||[];
  const checks = tasks.length? tasks.map(t=>`<label style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)">
      <input type="checkbox" class="abzChk" data-name="${esc(t.name)}" checked style="width:18px;height:18px">
      <span style="flex:1">${esc(t.name)} <span style="color:var(--muted);font-size:12px">(${esc(t.turnus||"")})</span></span></label>`).join("")
    : `<p class="m">Es sind noch keine Aufgaben im Reinigungsplan. Du kannst trotzdem einen Nachweis mit Bemerkung erfassen.</p>`;
  const head = completing
    ? `<h3>Ausstempeln &amp; abzeichnen</h3><div class="hint" style="background:var(--good-bg)">${I.mapPin}<div>Vor Ort: <b>${fmtClock(completing.startAt)}–${fmtClock(S._clockEnd.endAt)} Uhr</b>${durTxt(completing.startAt,S._clockEnd.endAt)?` · Dauer ${durTxt(completing.startAt,S._clockEnd.endAt)}`:""}<br>Start ${geoBadge(completing.distStart)} · Ende ${geoBadge(S._clockEnd.distEnd)}</div></div>`
    : `<h3>Turnus abzeichnen</h3><p class="m">Bestätige die erledigten Reinigungsleistungen für diesen Termin.</p>`;
  const dateField = completing ? "" : `<div class="field" style="margin-bottom:10px"><label>Datum</label><input id="abzDate" type="date" value="${todayISO()}"></div>`;
  modal(`${head}
    ${dateField}
    <div class="field" style="margin-bottom:10px"><label>Dienstleister</label><select id="abzDl">${dlOptions("")}</select></div>
    <div class="field" style="margin-bottom:10px"><label>Erledigte Leistungen</label><div style="max-height:200px;overflow:auto">${checks}</div></div>
    <div class="field" style="margin-bottom:10px"><label>Abgezeichnet von</label><input id="abzPerson" placeholder="Name"></div>
    <div class="field" style="margin-bottom:6px"><label>Bemerkung (optional)</label><input id="abzNote" placeholder="z. B. Besonderheiten"></div>
    <div class="modal-actions"><button class="btn ghost" onclick="cancelAbz()">Abbrechen</button>
    <button class="btn primary" onclick="saveAbzeichnung()">${I.done} ${completing?"Ausstempeln":"Abzeichnen"}</button></div>`);
}
function cancelAbz(){ S._clockEnd=null; closeModal(); }
async function saveAbzeichnung(){
  const done=[...document.querySelectorAll(".abzChk")].filter(c=>c.checked).map(c=>c.dataset.name);
  const dl=document.getElementById("abzDl").value, person=document.getElementById("abzPerson").value.trim(), note=document.getElementById("abzNote").value.trim();
  if(S._clockEnd){
    const n=(S.nachweise||[]).find(x=>x.id===S._clockEnd.id);
    if(!n){ S._clockEnd=null; closeModal(); return; }
    Object.assign(n, { status:"fertig", done, dl, person, note,
      endAt:S._clockEnd.endAt, endLat:S._clockEnd.endLat, endLng:S._clockEnd.endLng, endAcc:S._clockEnd.endAcc, distEnd:S._clockEnd.distEnd });
    try{ await DB.saveNachweis(n); }catch(e){ showError("Nachweis konnte nicht gespeichert werden", e); return; }
    S._clockEnd=null; closeModal(); renderReinigungObjekt(); toast("Ausgestempelt – Nachweis gespeichert.");
    return;
  }
  const n={ id:uid(), houseId:S.cleanHouseId, date:document.getElementById("abzDate").value||todayISO(),
    status:"fertig", dl, done, note, person, createdBy:S.userEmail||"" };
  try{ await DB.saveNachweis(n); }catch(e){ showError("Nachweis konnte nicht gespeichert werden", e); return; }
  (S.nachweise=S.nachweise||[]).unshift(n);
  closeModal(); renderReinigungObjekt();
  toast("Nachweis gespeichert.");
}
function delNachweis(id){
  confirmModal("Nachweis löschen?","Dieser Tätigkeitsnachweis wird dauerhaft entfernt.",async()=>{
    await DB.deleteNachweis(id); S.nachweise=(S.nachweise||[]).filter(x=>x.id!==id); renderReinigungObjekt();
  });
}

async function exportReinigungPDF(){
  if(!window.jspdf){ toast("PDF-Bibliothek lädt noch."); return; }
  const o=S.houses.find(x=>x.id===S.cleanHouseId);
  const overlay=document.createElement("div"); overlay.className="pdf-overlay";
  overlay.innerHTML=`<div class="pdf-box"><div class="spin"></div><div style="font-weight:600">Nachweis wird erstellt…</div></div>`;
  document.body.appendChild(overlay);
  try{
    const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
    const PW=210,PH=297,M=15; let y=M;
    const navy=[32,42,68],muted=[110,106,96],line=[210,205,190];
    const footer=()=>{ const pg=doc.internal.getNumberOfPages(); doc.setFontSize(8); doc.setFont("helvetica","normal"); doc.setTextColor(...muted);
      doc.text((o.name||"Objekt")+" – Tätigkeitsnachweis Hausreinigung",M,PH-8); doc.text("Seite "+pg,PW-M,PH-8,{align:"right"}); };
    const ensure=h=>{ if(y+h>PH-15){ footer(); doc.addPage(); y=M; } };
    doc.setFillColor(...navy); doc.rect(0,0,PW,26,"F");
    doc.setTextColor(244,242,236); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("Tätigkeitsnachweis Hausreinigung",M,12);
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    doc.text(o.name+(o.unit?" · WE "+o.unit.replace(/^WE\s*/i,""):"")+(o.address?" · "+o.address:""),M,20);
    y=34;
    // Reinigungsplan
    const tasks=(S.plan&&S.plan.tasks)||[];
    doc.setTextColor(...navy); doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text("Reinigungsplan",M,y); y+=6;
    doc.setFontSize(9.5); doc.setTextColor(40,38,33);
    if(tasks.length){ tasks.forEach(t=>{ ensure(6); doc.setFont("helvetica","bold"); doc.text("• "+t.name,M,y);
      doc.setFont("helvetica","normal"); doc.setTextColor(...muted); doc.text(`Turnus: ${t.turnus||"–"}${t.dl?"  ·  "+t.dl:""}`,M+80,y); doc.setTextColor(40,38,33); y+=5.2; }); }
    else { doc.setTextColor(...muted); doc.text("kein Plan hinterlegt",M,y); doc.setTextColor(40,38,33); y+=5.2; }
    y+=3; doc.setDrawColor(...line); doc.line(M,y,PW-M,y); y+=7;
    // Nachweise
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(...navy); doc.text("Abzeichnungen",M,y); y+=6;
    (S.nachweise||[]).filter(n=>n.status!=="laufend").forEach(n=>{
      ensure(16);
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(40,38,33);
      doc.text(`${fmtShort(n.date)}`,M,y);
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...muted);
      doc.text(`${n.dl||"ohne Dienstleister"}${n.person?"  ·  abgez.: "+n.person:""}`,M+30,y); y+=5;
      if(n.startAt){
        doc.setFontSize(8.7);
        const warn=(n.distStart!=null&&n.distStart>GEO_WARN_M)||(n.distEnd!=null&&n.distEnd>GEO_WARN_M);
        doc.setTextColor(...(warn?[181,70,47]:[62,124,90]));
        const ds=n.distStart!=null?`${n.distStart} m`:"o. Standort", de=n.distEnd!=null?`${n.distEnd} m`:"o. Standort";
        doc.text(`Vor Ort: ${fmtClock(n.startAt)}–${fmtClock(n.endAt)} Uhr${durTxt(n.startAt,n.endAt)?" ("+durTxt(n.startAt,n.endAt)+")":""}  ·  Start ${ds} / Ende ${de} vom Objekt${warn?"  ·  ABGLEICH PRÜFEN":""}`,M,y);
        doc.setTextColor(40,38,33); y+=4.6;
      }
      doc.setFontSize(9); doc.setTextColor(40,38,33);
      const done=(n.done||[]).length? (n.done||[]).join(", ") : "—";
      const lines=doc.splitTextToSize("Erledigt: "+done,PW-2*M); doc.text(lines,M,y); y+=lines.length*4.4;
      if(n.note){ const nl=doc.splitTextToSize("Bemerkung: "+n.note,PW-2*M); doc.setTextColor(...muted); doc.text(nl,M,y); doc.setTextColor(40,38,33); y+=nl.length*4.4; }
      y+=2; doc.setDrawColor(...line); doc.line(M,y,PW-M,y); y+=5;
    });
    footer();
    doc.save(`Reinigungsnachweis_${(o.name||"Objekt").replace(/[^\w\säöüÄÖÜß-]/g,"").replace(/\s+/g,"_")}_${todayISO()}.pdf`);
    overlay.remove(); toast("Nachweis-PDF erstellt.");
  }catch(e){ console.error(e); overlay.remove(); showError("PDF-Export fehlgeschlagen", e); }
}

/* ===================== Aufzüge ===================== */
const MELD_STATUS=["offen","in Bearbeitung","behoben"];
function meldClass(s){ return s==="behoben"?"good":s==="in Bearbeitung"?"mid":"bad"; }
const liftWart = a => wartStatus({interval:a.interval, lastDate:a.lastDate});
const liftTuev = a => wartStatus({interval:a.tuevInterval, lastDate:a.tuevLast});

async function openAufzuege(){
  if(!canArea("aufzuege")) return goHome();
  S.view="aufzuege";
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Aufzüge</div>
    <div class="page-head"><div><h2>Aufzüge</h2><div class="lead">Lade Daten…</div></div></div>`;
  S.aufzuege=await DB.listAufzuege();
  const meta=await DB.allMeldungenMeta();
  const counts={}; meta.forEach(m=>{ const c=counts[m.aufzug_id]||(counts[m.aufzug_id]={total:0,open:0}); c.total++; if(m.status!=="behoben") c.open++; });
  S._meldCounts=counts;
  const byHouse={}; S.houses.forEach(h=>byHouse[h.id]=h);
  const wartOver=S.aufzuege.filter(a=>liftWart(a).level==="overdue").length;
  const tuevOver=S.aufzuege.filter(a=>liftTuev(a).level==="overdue").length;
  const openMeld=Object.values(counts).reduce((s,c)=>s+c.open,0);

  let body;
  if(!S.aufzuege.length){
    body=`<div class="empty card" style="border-style:dashed">${I.lift}<h3>Noch keine Aufzüge erfasst</h3>
      <p>Lege Aufzüge mit Wartungs- und Prüfintervall an und protokolliere Störungs- und Mängelmeldungen.</p>
      <div style="margin-top:18px"><button class="btn primary" onclick="addAufzug()">${I.plus} Aufzug hinzufügen</button></div></div>`;
  } else {
    const cards=S.aufzuege.slice().sort((a,b)=>{
      const da=Math.min(liftWart(a).days??1e9, liftTuev(a).days??1e9), db=Math.min(liftWart(b).days??1e9, liftTuev(b).days??1e9);
      return da-db;
    }).map(a=>{
      const w=liftWart(a), t=liftTuev(a), c=counts[a.id]||{total:0,open:0}; const h=byHouse[a.houseId];
      const chip=(lbl,s)=> s.level==="none"?`<span class="chip na">${lbl}: –</span>`:`<span class="chip ${wartClass(s.level)}">${lbl}: ${s.label}</span>`;
      return `<div class="def card" style="border-left-color:var(--${w.level==="overdue"||t.level==="overdue"?"bad":(w.level==="soon"||t.level==="soon")?"mid":"good"})" onclick="openAufzug('${a.id}')">
        <div class="body" style="cursor:pointer">
          <div class="area">${esc(a.name||"(ohne Bezeichnung)")} ${c.open?`<span class="chip bad">${c.open} offen</span>`:`<span class="chip good">keine offenen</span>`}</div>

          <div class="kv">${chip("Wartung",w)} &nbsp; ${chip("TÜV",t)} &nbsp; <span style="color:var(--muted);font-size:12.5px">${c.total} Meldungen gesamt</span></div>
        </div></div>`;
    }).join("");
    body=`<div class="stat-row">
        <div class="stat bad"><div class="num">${openMeld}</div><div class="lbl">offene Meldungen</div></div>
        <div class="stat"><div class="num" style="color:${wartOver+tuevOver?'var(--bad)':'inherit'}">${wartOver+tuevOver}</div><div class="lbl">überfällig (Wartung/TÜV)</div></div>
        <div class="stat"><div class="num">${S.aufzuege.length}</div><div class="lbl">Aufzüge gesamt</div></div>
      </div>${cards}`;
  }
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Aufzüge</div>
    <div class="page-head">
      <div><h2>Aufzüge</h2><div class="lead">Wartung &amp; TÜV-Prüfung sowie protokollierte Störungs-/Mängelmeldungen je Aufzug.</div></div>
      <div class="toolbar">
        ${S.aufzuege.length?`<button class="btn" onclick="exportAuswertungPDF()">${I.pdf} Auswertung</button>`:""}
        <button class="btn primary" onclick="addAufzug()">${I.plus} Aufzug hinzufügen</button>
      </div>
    </div>
    ${body}`;
}

async function openAufzug(id){
  if(!canArea("aufzuege")) return goHome();
  S.aufzugId=id; S.view="aufzug";
  if(!S.aufzuege) S.aufzuege=await DB.listAufzuege();
  S.aufzug=S.aufzuege.find(x=>x.id===id);
  S.meldungen=await DB.listMeldungen(id);
  renderAufzug();
}
function renderAufzug(){
  const a=S.aufzug; if(!a) return openAufzuege();
  const h=S.houses.find(x=>x.id===a.houseId);
  const w=liftWart(a), t=liftTuev(a);
  const dueLine=(lbl,s,iv,last)=>{
    const chip = s.level==="none"?`<span class="chip na">kein Intervall</span>`
      : `<span class="chip ${wartClass(s.level)}">${s.label}${s.days!=null?` · ${s.days<0?Math.abs(s.days)+' T überfällig':'in '+s.days+' T'}`:""}</span>`;
    return `<div class="kv"><b>${lbl}:</b> ${chip} &nbsp; Intervall: ${iv?`alle ${iv} Mon.`:"–"} &nbsp;·&nbsp; letzte: ${last?esc(fmtShort(last)):"–"} &nbsp;·&nbsp; nächste: ${s.next?esc(fmtShort(s.next)):"–"}</div>`;
  };
  const meld=S.meldungen||[];
  const open=meld.filter(m=>m.status!=="behoben").length;
  const meldHTML = meld.length? meld.map(m=>`
    <div class="def card ${m.status==="in Bearbeitung"?"mid":""}" style="border-left-color:var(--${meldClass(m.status)})">
      <div class="body">
        <div class="area" style="font-size:15px">${esc(m.title||"(ohne Titel)")} <span class="chip ${meldClass(m.status)}">${esc(m.status)}</span>${m.prio?`<span class="chip ${m.prio==='hoch'?'bad':m.prio==='mittel'?'mid':'na'}">${esc(m.prio)}</span>`:""}</div>
        <div class="kv"><b>Gemeldet:</b> ${esc(fmtShort(m.date))}${m.reporter?` von ${esc(m.reporter)}`:""}${m.status==="behoben"&&m.resolvedDate?` &nbsp;·&nbsp; <b>behoben:</b> ${esc(fmtShort(m.resolvedDate))}`:""}</div>
        ${m.note?`<div class="kv" style="color:var(--muted)">${esc(m.note)}</div>`:""}
        <div class="seg" style="margin-top:9px">${MELD_STATUS.map(s=>`<button data-v="${s}" class="${m.status===s?'on':''}" onclick="setMeldStatus('${m.id}','${s}')">${s}</button>`).join("")}
          <button class="btn sm danger" style="margin-left:auto" onclick="delMeldung('${m.id}')">${I.trash}</button></div>
      </div></div>`).join("")
    : `<div class="empty card" style="border-style:dashed;padding:30px">${I.alert}<h3 style="font-size:17px">Keine Meldungen</h3><p>Erfasse Störungen oder Mängel – sie werden hier protokolliert und ausgewertet.</p></div>`;

  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span><a onclick="openAufzuege()">Aufzüge</a><span class="sep">/</span>${esc(a.name)}</div>
    <div class="page-head">
      <div><h2>${esc(a.name)}</h2><div class="lead">${h?esc(h.name):""}${a.fabriknr?` · Fabrik-Nr. ${esc(a.fabriknr)}`:""}${a.hersteller?` · ${esc(a.hersteller)}`:""}</div></div>
      <div class="toolbar">
        <button class="btn" onclick="exportAufzugPDF()">${I.pdf} PDF</button>
        <button class="btn" onclick="addAufzug('${a.id}')">${I.edit} Bearbeiten</button>
        <button class="btn" onclick="mailAufzug()">${I.mail} An Firma senden</button>
        <button class="btn primary" onclick="addMeldung()">${I.plus} Meldung erfassen</button>
      </div>
    </div>
    <div class="card" style="padding:15px 17px;margin-bottom:18px">
      ${dueLine("Wartung", w, a.interval, a.lastDate)}
      ${dueLine("TÜV-Prüfung", t, a.tuevInterval, a.tuevLast)}
      ${a.firm?`<div class="kv"><b>Wartungsfirma:</b> ${esc(a.firm)}</div>`:""}
      ${a.note?`<div class="kv" style="color:var(--muted)">${esc(a.note)}</div>`:""}
      <div style="display:flex;gap:7px;margin-top:11px;flex-wrap:wrap">
        <button class="btn sm" onclick="wartungDoneAufzug('${a.id}')">${I.done} Wartung heute</button>
        <button class="btn sm" onclick="tuevDoneAufzug('${a.id}')">${I.done} TÜV heute</button>
        <button class="btn sm danger" onclick="delAufzug('${a.id}')">${I.trash} Aufzug löschen</button>
      </div>
    </div>
    <h3 style="font-size:18px;margin:4px 0 12px">Störungs- &amp; Mängelmeldungen <span style="font-size:13px;color:var(--muted);font-family:'Inter'">(${open} offen / ${meld.length} gesamt)</span></h3>
    ${meldHTML}`;
}

async function saveAufzugForm(id){
  const name=document.getElementById("azName").value.trim();
  if(!name){ toast("Bitte eine Bezeichnung eingeben."); return; }
  const a={ id:id||uid(), houseId:document.getElementById("azHouse").value||"",
    name, fabriknr:document.getElementById("azNr").value.trim(), hersteller:document.getElementById("azHer").value.trim(),
    firm:document.getElementById("azFirm").value.trim(), firmEmail:document.getElementById("azMail").value.trim(),
    interval:parseInt(document.getElementById("azIv").value,10)||0, lastDate:document.getElementById("azLast").value||"",
    tuevInterval:parseInt(document.getElementById("azTiv").value,10)||0, tuevLast:document.getElementById("azTlast").value||"",
    note:document.getElementById("azNote").value.trim() };
  try{ await DB.saveAufzug(a); }catch(e){ showError("Aufzug konnte nicht gespeichert werden", e); return; }

}
function delAufzug(id){

    await DB.deleteAufzug(id);
    S.aufzuege=(S.aufzuege||[]).filter(x=>x.id!==id);
    openAufzuege();
  });
}
async function wartungDoneAufzug(id){ const a=(S.aufzuege||[]).find(x=>x.id===id); if(!a) return; a.lastDate=todayISO(); try{await DB.saveAufzug(a);}catch(e){return showError("Fehler",e);} toast("Wartung auf heute gesetzt."); renderAufzug(); }
async function tuevDoneAufzug(id){ const a=(S.aufzuege||[]).find(x=>x.id===id); if(!a) return; a.tuevLast=todayISO(); try{await DB.saveAufzug(a);}catch(e){return showError("Fehler",e);} toast("TÜV-Prüfung auf heute gesetzt."); renderAufzug(); }

}

/* ---- PDF: einzelner Aufzug ---- */
async function exportAufzugPDF(){
  if(!window.jspdf){ toast("PDF-Bibliothek lädt noch."); return; }
  const a=S.aufzug, h=S.houses.find(x=>x.id===a.houseId);
  const overlay=document.createElement("div"); overlay.className="pdf-overlay";
  overlay.innerHTML=`<div class="pdf-box"><div class="spin"></div><div style="font-weight:600">PDF wird erstellt…</div></div>`; document.body.appendChild(overlay);
  try{
    const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
    const PW=210,PH=297,M=15; let y=M; const navy=[32,42,68],muted=[110,106,96],line=[210,205,190];
    const cc=l=>l==="overdue"?[181,70,47]:l==="soon"?[150,120,30]:l==="ok"?[62,124,90]:[140,136,125];
    const sc=s=>s==="behoben"?[62,124,90]:s==="in Bearbeitung"?[150,120,30]:[181,70,47];
    const footer=()=>{ const pg=doc.internal.getNumberOfPages(); doc.setFontSize(8); doc.setFont("helvetica","normal"); doc.setTextColor(...muted); doc.text((a.name||"Aufzug")+" – Aufzugprotokoll",M,PH-8); doc.text("Seite "+pg,PW-M,PH-8,{align:"right"}); };
    const ensure=hh=>{ if(y+hh>PH-15){ footer(); doc.addPage(); y=M; } };
    doc.setFillColor(...navy); doc.rect(0,0,PW,26,"F"); doc.setTextColor(244,242,236); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("Aufzug – Wartung & Meldungen",M,12);
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text(`${a.name}${h?" · "+h.name:""}`,M,20); y=34;
    doc.setTextColor(40,38,33); doc.setFontSize(10);
    const w=liftWart(a), t=liftTuev(a);
    const meta=[["Fabrik-/Anlagennr.",a.fabriknr||"–"],["Hersteller",a.hersteller||"–"],["Wartungsfirma",a.firm||"–"],
      ["Wartung",`${a.interval?"alle "+a.interval+" Mon.":"–"} · letzte ${a.lastDate?fmtShort(a.lastDate):"–"} · nächste ${w.next?fmtShort(w.next):"–"} (${w.label})`],
      ["TÜV-Prüfung",`${a.tuevInterval?"alle "+a.tuevInterval+" Mon.":"–"} · letzte ${a.tuevLast?fmtShort(a.tuevLast):"–"} · nächste ${t.next?fmtShort(t.next):"–"} (${t.label})`]];
    meta.forEach(r=>{ ensure(6); doc.setFont("helvetica","bold"); doc.text(r[0]+":",M,y); doc.setFont("helvetica","normal"); const l=doc.splitTextToSize(String(r[1]),PW-M-50); doc.text(l,M+45,y); y+=l.length*5+1; });
    y+=2; doc.setDrawColor(...line); doc.line(M,y,PW-M,y); y+=7;
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(...navy);
    const meld=S.meldungen||[], open=meld.filter(m=>m.status!=="behoben").length;
    doc.text(`Störungs- & Mängelmeldungen  (${open} offen / ${meld.length} gesamt)`,M,y); y+=6;
    doc.setTextColor(40,38,33);
    if(!meld.length){ doc.setFontSize(9.5); doc.setTextColor(...muted); doc.text("keine Meldungen erfasst",M,y); }
    meld.forEach(m=>{
      ensure(12); doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(40,38,33);
      doc.text(`${fmtShort(m.date)} – ${m.title||""}`,M,y);
      const c=sc(m.status); doc.setFontSize(8.5); doc.setTextColor(c[0],c[1],c[2]); doc.text(m.status+(m.prio?" · "+m.prio:""),PW-M,y,{align:"right"}); y+=5;
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...muted);
      const info=[m.reporter?"gemeldet von "+m.reporter:null, (m.status==="behoben"&&m.resolvedDate)?"behoben "+fmtShort(m.resolvedDate):null, m.note||null].filter(Boolean).join("  ·  ");
      if(info){ const l=doc.splitTextToSize(info,PW-2*M); doc.text(l,M,y); y+=l.length*4.4; }
      doc.setTextColor(40,38,33); y+=2; doc.setDrawColor(...line); doc.line(M,y,PW-M,y); y+=4;
    });
    footer(); doc.save(`Aufzug_${(a.name||"Aufzug").replace(/[^\w\säöüÄÖÜß-]/g,"").replace(/\s+/g,"_")}_${todayISO()}.pdf`);
    overlay.remove(); toast("Aufzug-PDF erstellt.");
  }catch(e){ console.error(e); overlay.remove(); showError("PDF-Export fehlgeschlagen", e); }
}

/* ---- PDF: Auswertung aller Aufzüge ---- */
async function exportAuswertungPDF(){
  if(!window.jspdf){ toast("PDF-Bibliothek lädt noch."); return; }
  const overlay=document.createElement("div"); overlay.className="pdf-overlay";
  overlay.innerHTML=`<div class="pdf-box"><div class="spin"></div><div style="font-weight:600">Auswertung wird erstellt…</div></div>`; document.body.appendChild(overlay);
  try{
    const all=await DB.listAufzuege();
    const meld=(await DB.allMeldungenMeta());
    const counts={}; meld.forEach(m=>{ const c=counts[m.aufzug_id]||(counts[m.aufzug_id]={total:0,open:0}); c.total++; if(m.status!=="behoben") c.open++; });
    const byHouse={}; S.houses.forEach(h=>byHouse[h.id]=h);
    const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
    const PW=210,PH=297,M=15; let y=M; const navy=[32,42,68],muted=[110,106,96],line=[210,205,190];
    const footer=()=>{ const pg=doc.internal.getNumberOfPages(); doc.setFontSize(8); doc.setFont("helvetica","normal"); doc.setTextColor(...muted); doc.text("Aufzug-Auswertung · Stand "+fmtShort(todayISO()),M,PH-8); doc.text("Seite "+pg,PW-M,PH-8,{align:"right"}); };
    const ensure=hh=>{ if(y+hh>PH-15){ footer(); doc.addPage(); y=M; } };
    const totOpen=Object.values(counts).reduce((s,c)=>s+c.open,0), tot=Object.values(counts).reduce((s,c)=>s+c.total,0);
    const wOver=all.filter(a=>liftWart(a).level==="overdue").length, tOver=all.filter(a=>liftTuev(a).level==="overdue").length;
    doc.setFillColor(...navy); doc.rect(0,0,PW,26,"F"); doc.setTextColor(244,242,236); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("Aufzug-Auswertung",M,12);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.text(`${all.length} Aufzüge · ${totOpen} offene Meldungen (von ${tot}) · ${wOver} Wartung überfällig · ${tOver} TÜV überfällig · Stand ${fmtShort(todayISO())}`,M,20); y=36;
    all.slice().sort((a,b)=>((counts[b.id]||{open:0}).open-(counts[a.id]||{open:0}).open)).forEach(a=>{
      ensure(16); const c=counts[a.id]||{total:0,open:0}; const h=byHouse[a.houseId]; const w=liftWart(a), t=liftTuev(a);
      doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...navy); doc.text(a.name||"(ohne Bezeichnung)",M,y);
      doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(c.open?181:62, c.open?70:124, c.open?47:90); doc.text(`${c.open} offen / ${c.total} gesamt`,PW-M,y,{align:"right"}); y+=4.6;
      doc.setFontSize(8.5); doc.setTextColor(...muted);
      doc.text(`Objekt: ${h?h.name:"–"}   ·   Wartung: ${w.label}${w.next?" (nächste "+fmtShort(w.next)+")":""}   ·   TÜV: ${t.label}${t.next?" (nächste "+fmtShort(t.next)+")":""}`,M,y);
      y+=4; doc.setDrawColor(...line); doc.line(M,y,PW-M,y); y+=6;
    });
    footer(); doc.save(`Aufzug_Auswertung_${todayISO()}.pdf`);
    overlay.remove(); toast("Auswertung als PDF gespeichert.");
  }catch(e){ console.error(e); overlay.remove(); showError("PDF-Export fehlgeschlagen", e); }
}

function drawSanierung(){
  const all=S.sanierungen||[], f=S.sanFilter;
  const byId={}; S.houses.forEach(h=>byId[h.id]=h);
  let list=all.slice();
  if(f.status!=="alle") list=list.filter(s=>s.status===f.status);
  if(f.house!=="alle") list=list.filter(s=>s.houseId===f.house);
  const rank={laufend:0,geplant:1,abgeschlossen:2};
  list.sort((a,b)=>(rank[a.status]??3)-(rank[b.status]??3) || (b.start||"").localeCompare(a.start||""));
  const nLauf=all.filter(s=>s.status==="laufend").length, nPlan=all.filter(s=>s.status==="geplant").length, nDone=all.filter(s=>s.status==="abgeschlossen").length;
  const sumCost=all.filter(s=>s.status!=="abgeschlossen").reduce((sum,s)=>sum+(Number(s.budget)||0),0);
  const houseIds=new Set(all.map(s=>s.houseId).filter(Boolean));

  const filterBar=`<div class="filterbar card">
    <div class="ff"><label>Status</label><select onchange="setSanFilter('status',this.value)">
      <option value="alle" ${f.status==="alle"?"selected":""}>Alle</option>
      ${SAN_STATUS.map(s=>`<option value="${s}" ${f.status===s?"selected":""}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join("")}
    </select></div>
    <div class="ff"><label>Objekt</label><select onchange="setSanFilter('house',this.value)">
      <option value="alle" ${f.house==="alle"?"selected":""}>Alle Objekte</option>
      ${S.houses.filter(h=>houseIds.has(h.id)).map(h=>`<option value="${h.id}" ${f.house===h.id?"selected":""}>${esc(h.name)}</option>`).join("")}
    </select></div>
  </div>`;

  let body;
  if(!all.length){
    body=`<div class="empty card" style="border-style:dashed">${I.hammer}<h3>Noch keine Sanierungen erfasst</h3>
      <p>Lege Sanierungsprojekte je Wohnung an – mit Status, Zeitraum, Budget und Fachfirma.</p>
      <div style="margin-top:18px"><button class="btn primary" onclick="addSanierung()">${I.plus} Sanierung anlegen</button></div></div>`;
  } else if(!list.length){
    body=filterBar+`<div class="empty card" style="border-style:dashed">${I.info}<h3>Keine Treffer</h3><p>Für die gewählten Filter gibt es keine Einträge.</p></div>`;
  } else {
    const cards=list.map(s=>{
      const h=byId[s.houseId];
      const zeit = s.status==="abgeschlossen"
        ? `${s.start?esc(fmtShort(s.start)):"–"} – ${s.end?esc(fmtShort(s.end)):"–"}`
        : `${s.start?esc(fmtShort(s.start)):"–"} – geplant ${s.endPlanned?esc(fmtShort(s.endPlanned)):"–"}`;
      const over = s.status==="laufend" && s.endPlanned && daysUntil(s.endPlanned)<0;
      const kosten = s.status==="abgeschlossen"
        ? `<b>Kosten:</b> ${euro(s.cost)}${s.budget!==""?` (Budget ${euro(s.budget)})`:""}`
        : `<b>Budget:</b> ${euro(s.budget)}`;
      return `<div class="def card ${s.status==="laufend"?"mid":""}" style="border-left-color:var(--${s.status==="abgeschlossen"?"good":s.status==="laufend"?(over?"bad":"mid"):"na"})">
        <div class="body">
          <div class="area">${esc(s.wohnung||"(ohne Wohnung)")}${s.title?` – ${esc(s.title)}`:""} <span class="chip ${sanClass(s.status)}">${esc(s.status)}</span>${over?`<span class="chip bad">Termin überschritten</span>`:""}</div>
          <div class="kv"><b>Objekt:</b> ${h?esc(h.name):"–"}${s.firm?` &nbsp;·&nbsp; <b>Firma:</b> ${esc(s.firm)}`:""}</div>
          <div class="kv"><b>Zeitraum:</b> ${zeit} &nbsp;·&nbsp; ${kosten}</div>
          ${s.note?`<div class="kv" style="color:var(--muted)">${esc(s.note)}</div>`:""}
          <div class="seg" style="margin-top:9px">${SAN_STATUS.map(x=>`<button data-v="${x}" class="${s.status===x?'on':''}" onclick="setSanStatus('${s.id}','${x}')">${x}</button>`).join("")}
            <button class="btn sm" style="margin-left:auto" onclick="addSanierung('${s.id}')">${I.edit}</button>
            <button class="btn sm danger" onclick="delSanierung('${s.id}')">${I.trash}</button></div>
        </div></div>`;
    }).join("");
    body=filterBar+`<div class="stat-row">
        <div class="stat" style="border-left:4px solid var(--mid)"><div class="num" style="color:var(--mid)">${nLauf}</div><div class="lbl">laufend</div></div>
        <div class="stat"><div class="num">${nPlan}</div><div class="lbl">geplant</div></div>
        <div class="stat"><div class="num" style="color:var(--good)">${nDone}</div><div class="lbl">abgeschlossen</div></div>
        <div class="stat"><div class="num" style="font-size:22px;padding-top:6px">${euro(sumCost)}</div><div class="lbl">Budget offen (geplant+laufend)</div></div>
      </div>${cards}`;
  }
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Wohnungssanierungen</div>
    <div class="page-head">
      <div><h2>Wohnungssanierungen</h2><div class="lead">Sanierungsprojekte je Wohnung mit Status, Zeitraum, Budget und Fachfirma.</div></div>
      <div class="toolbar">
        ${all.length?`<button class="btn" onclick="exportSanierungPDF()">${I.pdf} Als PDF</button>`:""}
        <button class="btn primary" onclick="addSanierung()">${I.plus} Sanierung anlegen</button>
      </div>
    </div>
    ${body}`;
}

async function saveSanierungForm(id){
  const wohnung=document.getElementById("snWhg").value.trim();
  if(!wohnung){ toast("Bitte Wohnung/Einheit angeben."); return; }
  const s={ id:id||uid(), houseId:document.getElementById("snHouse").value||"", wohnung,
    title:document.getElementById("snTitle").value.trim(), status:document.getElementById("snStatus").value,
    start:document.getElementById("snStart").value||"", endPlanned:document.getElementById("snEndP").value||"",
    end:document.getElementById("snEnd").value||"", budget:document.getElementById("snBudget").value,
    cost:document.getElementById("snCost").value, firm:document.getElementById("snFirm").value.trim(),
    note:document.getElementById("snNote").value.trim() };
  try{ await DB.saveSanierung(s); }catch(e){ showError("Sanierung konnte nicht gespeichert werden", e); return; }
  S.sanierungen=S.sanierungen||[]; const pos=S.sanierungen.findIndex(x=>x.id===s.id);
  if(pos>=0) S.sanierungen[pos]=s; else S.sanierungen.unshift(s);

async function setSanStatus(id,status){
  const s=(S.sanierungen||[]).find(x=>x.id===id); if(!s) return;
  s.status=status; if(status==="abgeschlossen"&&!s.end) s.end=todayISO();
  try{ await DB.saveSanierung(s); }catch(e){ return showError("Fehler", e); }
  drawSanierung();
}
function delSanierung(id){

async function exportSanierungPDF(){
  if(!window.jspdf){ toast("PDF-Bibliothek lädt noch."); return; }
  const overlay=document.createElement("div"); overlay.className="pdf-overlay";
  overlay.innerHTML=`<div class="pdf-box"><div class="spin"></div><div style="font-weight:600">Übersicht wird erstellt…</div></div>`; document.body.appendChild(overlay);
  try{
    const byId={}; S.houses.forEach(h=>byId[h.id]=h);
    const f=S.sanFilter||{status:"alle",house:"alle"};
    let list=(S.sanierungen||[]).slice();
    if(f.status!=="alle") list=list.filter(s=>s.status===f.status);
    if(f.house!=="alle") list=list.filter(s=>s.houseId===f.house);
    const rank={laufend:0,geplant:1,abgeschlossen:2};
    list.sort((a,b)=>(rank[a.status]??3)-(rank[b.status]??3) || (b.start||"").localeCompare(a.start||""));
    const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
    const PW=210,PH=297,M=15; let y=M; const navy=[32,42,68],muted=[110,106,96],line=[210,205,190];
    const sc=s=>s==="abgeschlossen"?[62,124,90]:s==="laufend"?[150,120,30]:[140,136,125];
    const footer=()=>{ const pg=doc.internal.getNumberOfPages(); doc.setFontSize(8); doc.setFont("helvetica","normal"); doc.setTextColor(...muted); doc.text("Wohnungssanierungen · Stand "+fmtShort(todayISO()),M,PH-8); doc.text("Seite "+pg,PW-M,PH-8,{align:"right"}); };
    const ensure=hh=>{ if(y+hh>PH-15){ footer(); doc.addPage(); y=M; } };
    const scope=[f.status==="alle"?null:"Status: "+f.status, f.house==="alle"?null:(byId[f.house]||{}).name].filter(Boolean).join(" · ");
    doc.setFillColor(...navy); doc.rect(0,0,PW,26,"F"); doc.setTextColor(244,242,236); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("Wohnungssanierungen",M,12);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.text(`${list.length} Projekte${scope?" · "+scope:""} · Stand ${fmtShort(todayISO())}`,M,20); y=36;
    list.forEach(s=>{
      ensure(18); const h=byId[s.houseId]; const c=sc(s.status);
      doc.setFillColor(c[0],c[1],c[2]); doc.rect(M,y-3.5,1.6,13,"F");
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(40,38,33);
      doc.text(`${s.wohnung||"(ohne Wohnung)"}${s.title?" – "+s.title:""}`,M+4,y);
      doc.setFontSize(8.5); doc.setTextColor(c[0],c[1],c[2]); doc.text(s.status,PW-M,y,{align:"right"}); y+=4.6;
      doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...muted);
      const zeit = s.status==="abgeschlossen"? `${s.start?fmtShort(s.start):"–"} – ${s.end?fmtShort(s.end):"–"}` : `${s.start?fmtShort(s.start):"–"} – geplant ${s.endPlanned?fmtShort(s.endPlanned):"–"}`;
      const geld = s.status==="abgeschlossen"? `Kosten ${euro(s.cost)}${s.budget!==""?" (Budget "+euro(s.budget)+")":""}` : `Budget ${euro(s.budget)}`;
      doc.text(`Objekt: ${h?h.name:"–"}   ·   ${zeit}   ·   ${geld}${s.firm?"   ·   "+s.firm:""}`,M+4,y); y+=4;
      if(s.note){ const l=doc.splitTextToSize(s.note,PW-2*M-4); doc.text(l,M+4,y); y+=l.length*3.8; }
      y+=2; doc.setDrawColor(...line); doc.line(M,y,PW-M,y); y+=6;
    });
    footer(); doc.save(`Wohnungssanierungen_${todayISO()}.pdf`);
    overlay.remove(); toast("Übersicht als PDF gespeichert.");
  }catch(e){ console.error(e); overlay.remove(); showError("PDF-Export fehlgeschlagen", e); }
}

function composeMail(opts){
  S._mailTrack = opts.track ? {kind:opts.kind, houseId:opts.houseId||"", aufzugId:opts.aufzugId||""} : null;
  S._mailAfter = opts.after || null;
  const frist = opts.track ? `<div class="field" style="margin-bottom:10px"><label>Frist / Wiedervorlage (manuell, optional)</label><input id="cmDue" type="date" value="${opts.defaultDue||""}"></div>` : "";
  modal(`<h3>Meldung per E-Mail senden</h3>
    <p class="m">Die Meldung wird in deinem E-Mail-Programm geöffnet – dort nur noch prüfen und absenden.${opts.track?" Beim Öffnen wird der Vorgang zur Überwachung protokolliert.":""}${opts.hint?'<br>'+esc(opts.hint):""}</p>
    <div class="field" style="margin-bottom:10px"><label>Empfänger</label><input id="cmTo" type="email" placeholder="firma@beispiel.de" value="${esc(opts.to||"")}"></div>
    <div class="field" style="margin-bottom:10px"><label>Betreff</label><input id="cmSub" value="${esc(opts.subject||"")}"></div>
    <div class="field" style="margin-bottom:10px"><label>Nachricht</label><textarea id="cmBody" style="min-height:190px;font-size:13px">${esc(opts.body||"")}</textarea></div>
    ${frist}
    <div class="modal-actions">
      <button class="btn" onclick="copyMailBody()">In Zwischenablage</button>
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="openMailto()">${I.mail} Im E-Mail-Programm öffnen</button>
    </div>`);
  document.getElementById("modalBg").querySelector(".modal").style.maxWidth="620px";
}
function openMailto(){
  const to=(document.getElementById("cmTo").value||"").trim();
  const sub=document.getElementById("cmSub").value||"";
  const body=document.getElementById("cmBody").value||"";
  if(!to||!to.includes("@")){ toast("Bitte eine Empfänger-E-Mail eingeben."); return; }
  if(S._mailTrack){
    const due=(document.getElementById("cmDue")||{}).value||"";
    const entry={ id:uid(), kind:S._mailTrack.kind, houseId:S._mailTrack.houseId, aufzugId:S._mailTrack.aufzugId,
      subject:sub, recipient:to, sentDate:todayISO(), dueDate:due, status:"offen", note:"" };
    DB.logMeldung(entry).then(()=>toast("Vorgang wird überwacht.")).catch(()=>{});
    S._mailTrack=null;
  }
  if(S._mailAfter){ try{ S._mailAfter(to); }catch(e){} S._mailAfter=null; }
  const href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;
  closeModal();
  window.location.href=href;
}
async function copyMailBody(){
  const t=`An: ${document.getElementById("cmTo").value}\nBetreff: ${document.getElementById("cmSub").value}\n\n${document.getElementById("cmBody").value}`;
  try{ await navigator.clipboard.writeText(t); toast("In die Zwischenablage kopiert."); }
  catch(e){ toast("Kopieren nicht möglich – bitte Text markieren und kopieren."); }
}
