      {email:"admin@demo.de",       objekte:true,  reinigung:true,  aufzuege:true,  sanierung:true,  tickets:true,  admin:true},
      {email:"hausmeister@demo.de", objekte:true,  reinigung:false, aufzuege:true,  sanierung:false, tickets:true,  admin:false},
      {email:"reinigung@demo.de",   objekte:false, reinigung:true,  aufzuege:false, sanierung:false, tickets:false, admin:false}
    ]
  };

  function match(row,f){ for(var i=0;i<f.length;i++){ if(row[f[i][0]]!==f[i][1]) return false; } return true; }
  function QB(t){ this.t=t; this.f=[]; this._s=false; this.op="select"; this.row=null; }
  QB.prototype.select=function(){ return this; };
  QB.prototype.insert=function(r){ this.op="insert"; this.row=r; return this; };
  QB.prototype.upsert=function(r){ this.op="upsert"; this.row=r; return this; };
  QB.prototype.update=function(r){ this.op="update"; this.row=r; return this; };
  QB.prototype.delete=function(){ this.op="delete"; return this; };
  QB.prototype.eq=function(c,v){ this.f.push([c,v]); return this; };
  QB.prototype.order=function(){ return this; };
  QB.prototype.limit=function(){ return this; };
  QB.prototype.maybeSingle=function(){ this._s=true; return this; };
  QB.prototype.then=function(res){
    var a=DATA[this.t]||(DATA[this.t]=[]); var self=this; var out;
    if(this.op==="insert"||this.op==="upsert"){
      var key=(this.t==="app_users")?"email":(this.t==="reinigungsplan")?"house_id":"id";
      var arr=Array.isArray(this.row)?this.row:[this.row];
      arr.forEach(function(r){ var i=a.findIndex(function(x){return x[key]===r[key];}); if(i>=0) a[i]=Object.assign({},a[i],r); else a.push(Object.assign({},r)); });
      out={data:arr,error:null};
    } else if(this.op==="delete"){
      DATA[self.t]=a.filter(function(x){ return !match(x,self.f); });
      out={data:null,error:null};
    } else if(this.op==="update"){
      a.filter(function(x){return match(x,self.f);}).forEach(function(x){ Object.assign(x,self.row); });
      out={data:null,error:null};
    } else {
      var r=a.filter(function(x){ return match(x,self.f); });
      out=self._s ? {data:r[0]||null,error:null} : {data:r,error:null};
    }
    return Promise.resolve(out).then(res);
  };
  function makeClient(){
    return {
      auth:{
        getSession:function(){ return Promise.resolve({data:{session:{user:{email:"admin@demo.de"}}}}); },
        onAuthStateChange:function(){ return {data:{subscription:{unsubscribe:function(){}}}}; },
        signInWithPassword:function(o){ return Promise.resolve({data:{session:{user:{email:(o&&o.email)||"admin@demo.de"}}},error:null}); },
        signOut:function(){ return Promise.resolve({error:null}); },
        updateUser:function(){ return Promise.resolve({data:{},error:null}); },
        resetPasswordForEmail:function(){ return Promise.resolve({data:{},error:null}); }
      },
      from:function(t){ return new QB(t); },
      storage:{ from:function(){ return {
        createSignedUrl:function(){ return Promise.resolve({data:{signedUrl:"https://example.com/demo-dokument.pdf"},error:null}); },
        download:function(){ return Promise.resolve({data:null,error:"demo"}); },
        upload:function(){ return Promise.resolve({data:{},error:null}); },
        remove:function(){ return Promise.resolve({data:{},error:null}); }
      }; } }
    };
  }
  window.supabase = { createClient:function(){ return makeClient(); } };

  /* dezente Kennzeichnung als Testumgebung */
  window.addEventListener("DOMContentLoaded", function(){
    var b=document.createElement("div");
    b.className="no-print";
    b.textContent="TESTUMGEBUNG · Demodaten";
    b.style.cssText="position:fixed;left:10px;bottom:10px;z-index:9998;background:#0E1220;color:#fff;"
      +"font:600 11px Inter,Arial,sans-serif;padding:6px 11px;border-radius:999px;opacity:.8;"
      +"box-shadow:0 8px 20px -8px rgba(0,0,0,.6);pointer-events:none;letter-spacing:.02em";
    document.body.appendChild(b);
  });
})();

<style>

  .house .meta{display:flex;gap:14px;margin-top:11px;flex-wrap:wrap}
  .house .meta span{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:5px}
  .house .meta b{color:var(--ink);font-weight:600}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty svg{width:54px;height:54px;color:var(--line2);margin-bottom:14px}
  .empty h3{font-size:21px;color:var(--ink);margin-bottom:6px}

  /* ---------- Inspection timeline (Tagebuch) ---------- */
  .timeline{position:relative;padding-left:30px;margin-top:6px}
  .timeline::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--line2)}
  .tl-item{position:relative;margin-bottom:14px}
  .tl-item::before{content:"";position:absolute;left:-25px;top:20px;width:13px;height:13px;border-radius:50%;
    background:var(--surface);border:3px solid var(--navy);z-index:2}
  .tl-card{padding:15px 17px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .tl-date{font-family:'Plus Jakarta Sans';font-size:17px;font-weight:600;min-width:120px}
  .tl-date small{display:block;font-family:'Inter';font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
  .tl-stats{display:flex;gap:7px;flex:1;flex-wrap:wrap}
  .tl-actions{display:flex;gap:7px;flex-wrap:wrap}

  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 9px;border-radius:7px;font-size:12px;font-weight:600;background:var(--bg2);color:var(--muted)}
  .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .chip.good{color:#0B7A55}
  .chip.good::before{background:var(--good)}
  .chip.mid{color:#A86400}
  .chip.mid::before{background:var(--mid)}
  .chip.bad{color:#C32B45}
  .chip.bad::before{background:var(--bad)}
  .chip.na{color:var(--na)}
  .chip.na::before{background:var(--na)}
  .chip .n{font-variant-numeric:tabular-nums}

  /* ---------- Editor ---------- */
  .insp-meta{padding:18px;display:grid;gap:14px;margin-bottom:16px}
  @media(min-width:640px){.insp-meta{grid-template-columns:1fr 1fr 1fr}}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .field input,.field select,.field textarea{
    padding:9px 11px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface2);width:100%}
  .field input:focus,.field select:focus,.field textarea:focus,.cell input:focus,.cell textarea:focus,.cell select:focus{
    outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}

  .area-card{padding:0;margin-bottom:14px;overflow:hidden}
  .area-head{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--bg2);border-bottom:1px solid var(--line)}
  .area-num{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;
    font-size:12.5px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}
  .area-title{flex:1;border:none;background:transparent;font-family:'Plus Jakarta Sans';font-size:18px;font-weight:600;padding:4px 6px;border-radius:7px;min-width:0}
  .area-title:focus{outline:none;background:var(--surface2);box-shadow:0 0 0 2px var(--navy-soft)}
  .area-move{display:flex;flex-direction:column;gap:1px}
  .icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:.15s}
  .icon-btn:hover{background:rgba(15,23,42,.07);color:var(--ink)}
  .icon-btn.tiny{width:22px;height:18px}
  .icon-btn.tiny svg{width:14px;height:14px}
  .icon-btn svg{width:17px;height:17px}
  .icon-btn:disabled{opacity:.3;cursor:default}

  .cell-grid{display:grid;gap:13px;padding:15px}
  @media(min-width:560px){.cell-grid{grid-template-columns:1fr 1fr}}
  .cell.full{grid-column:1/-1}
  .cell label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .cell label .colmenu{margin-left:auto;opacity:0;transition:.15s}
  .cell:hover label .colmenu{opacity:1}
  .cell input,.cell textarea,.cell select{padding:9px 11px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface2);width:100%}
  .cell textarea{resize:vertical;min-height:62px}

  /* condition segmented control */
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid var(--line2);background:var(--surface2);color:var(--muted)}
  .seg button[data-v="gut"].on{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .seg button[data-v="mittel"].on{background:var(--mid-bg);border-color:var(--mid);color:var(--mid)}
  .seg button[data-v="mangelhaft"].on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .seg button[data-v="nicht relevant"].on{background:var(--na-bg);border-color:var(--na);color:var(--na)}

  /* previous finding (Tagebuch / Vorbefund) */
  .prev{margin:0 15px 14px;padding:10px 13px;border-radius:var(--r-sm);background:var(--navy-soft);
    border:1px dashed var(--line2);font-size:13px;display:flex;align-items:flex-start;gap:9px}
  .prev svg{width:16px;height:16px;color:var(--navy);flex-shrink:0;margin-top:2px}
  .prev .pl{color:var(--navy);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .prev .pt{color:var(--ink)}
  .prev .pthumb{width:42px;height:42px;border-radius:7px;object-fit:cover;margin-left:auto;cursor:pointer;border:1px solid var(--line2)}

  /* photos */
  .photos{padding:0 15px 15px}
  .photos-lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .photo-strip{display:flex;gap:9px;flex-wrap:wrap}
  .photo{position:relative;width:84px;height:84px;border-radius:9px;overflow:hidden;border:1px solid var(--line2);background:var(--bg2)}
  .photo img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block}
  .photo .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(15,23,42,.78);color:#fff;display:grid;place-items:center}
  .photo .rm svg{width:12px;height:12px}
  .add-photo{width:84px;height:84px;border-radius:9px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;color:var(--muted);background:var(--surface2);font-size:11px;font-weight:600}
  .add-photo:hover{border-color:var(--navy);color:var(--navy)}
  .add-photo svg{width:20px;height:20px}
  .ph-spin{width:84px;height:84px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;background:var(--bg2)}

  /* add area / column row */
  .addbar{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}

  /* read-only / compare table */
  .ro-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border-radius:var(--r);overflow:hidden}
  .ro-table th,.ro-table td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
  .ro-table th{background:var(--bg2);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .ro-table tr:last-child td{border-bottom:none}
  .ro-area{font-family:'Plus Jakarta Sans';font-weight:600;font-size:15px}
  .ro-thumbs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .ro-thumbs img{width:50px;height:50px;border-radius:6px;object-fit:cover;border:1px solid var(--line2);cursor:pointer}

  .cmp-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
  .cmp{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;background:var(--surface)}
  .cmp th,.cmp td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
  .cmp thead th{background:var(--navy);color:#F4F2EC;font-family:'Plus Jakarta Sans';font-size:14px;position:sticky;top:0}
  .cmp .ar{font-family:'Plus Jakarta Sans';font-weight:600;font-size:14px;background:var(--bg2);min-width:150px}
  .cmp td .note{color:var(--muted);font-size:12.5px;margin-top:5px}
  .cmp td.changed{background:var(--mid-bg)}
  .cmp img.t{width:46px;height:46px;border-radius:6px;object-fit:cover;border:1px solid var(--line2);cursor:pointer;margin-top:6px;margin-right:4px}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .15s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);max-width:440px;width:100%;padding:24px;animation:pop .18s}
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal h3{font-size:21px;margin-bottom:4px}
  .modal p.m{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  .modal .field{margin-bottom:14px}
  .modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:8px}

  .lightbox{position:fixed;inset:0;background:rgba(15,13,10,.92);z-index:120;display:grid;place-items:center;padding:24px;animation:fade .15s}
  .lightbox img{max-width:100%;max-height:90vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .lightbox .lb-close{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
  .lightbox .lb-close svg{width:22px;height:22px}

  .col-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:300px;overflow-y:auto}
  .col-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--line2);border-radius:9px}
  .col-row input.cn{flex:1;border:none;background:transparent;font-weight:600;font-size:13.5px}
  .col-row input.cn:focus{outline:none}
  .col-row select{padding:5px 8px;border:1px solid var(--line2);border-radius:7px;font-size:12px}
  .col-row .lock{font-size:11px;color:var(--faint);padding:0 6px}

  .hint{font-size:12.5px;color:var(--muted);background:var(--navy-soft);border-radius:9px;padding:11px 13px;display:flex;gap:8px;align-items:flex-start;margin-bottom:16px}
  .hint svg{width:16px;height:16px;color:var(--navy);flex-shrink:0;margin-top:1px}

  .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;flex:1;min-width:140px;box-shadow:var(--shadow)}
  .stat .num{font-family:'Plus Jakarta Sans';font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}
  .stat.bad .num{color:var(--bad)}
  .def-group{margin-bottom:22px}
  .def-group h3{font-size:19px;display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .def-group .gsub{font-size:12.5px;color:var(--muted);margin-bottom:11px}
  .def-group .gcount{background:var(--bad-bg);color:var(--bad);font-family:'Inter';font-size:13px;font-weight:700;padding:2px 10px;border-radius:20px}
  .def{padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;border-left:4px solid var(--bad)}
  .def.mid{border-left-color:var(--mid)}
  .filterbar{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px;margin-bottom:18px}
  .filterbar .ff{display:flex;flex-direction:column;gap:5px;flex:1;min-width:160px}
  .filterbar .ff label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .filterbar .ff select{padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--surface2);font-size:13.5px;font-weight:500}
  .filterbar .ff select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
  .def .body{flex:1;min-width:0}
  .def .area{font-family:'Plus Jakarta Sans';font-size:16px;font-weight:700;margin-bottom:3px;letter-spacing:-.01em}
  .def .kv{font-size:13px;color:var(--ink);margin-top:3px}
  .def .kv b{color:var(--muted);font-weight:600}
  .def .thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;border:1px solid var(--line2);cursor:pointer;flex-shrink:0}
  .thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;border:1px solid var(--line2);background:var(--bg2)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap}
  .thumb-wrap{position:relative;width:64px;height:64px}
  .thumb-x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.3);border:2px solid var(--surface)}
  .thumb-x svg{width:11px;height:11px}
  .lb-bg{position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:150;display:grid;place-items:center;padding:24px;cursor:zoom-out}
  .lb-bg img{max-width:96vw;max-height:92vh;border-radius:10px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
  .def .prio{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-top:6px;text-transform:uppercase;letter-spacing:.03em}
  .prio-hoch{background:var(--bad-bg);color:var(--bad)} .prio-mittel{background:var(--mid-bg);color:var(--mid)}
  .prio-niedrig{background:var(--na-bg);color:var(--na)} .prio-keine{background:var(--na-bg);color:var(--na)}

  .pdf-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:130;display:grid;place-items:center}
  .pdf-box{background:var(--surface);border-radius:var(--r);padding:26px 34px;text-align:center;box-shadow:var(--shadow-lg)}
  .pdf-box .spin{width:34px;height:34px;border:3px solid var(--line2);border-top-color:var(--navy);border-radius:50%;margin:0 auto 14px;animation:rot 1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#F4F2EC;
    padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);z-index:140;animation:up .25s}
  @keyframes up{from{transform:translateX(-50%) translateY(14px);opacity:0}to{transform:translateX(-50%);opacity:1}}

  /* ---- Verbindungsanzeige & Offline-Warteschlange ---- */
  .net-ind{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.10);
    color:#F4F2EC;font:600 11.5px Inter,Arial,sans-serif;padding:5px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .net-ind .d{width:7px;height:7px;border-radius:50%;background:#2FBF71;flex:0 0 7px}
  .net-ind.off{background:rgba(224,160,48,.22);border-color:rgba(224,160,48,.6)}
  .net-ind.off .d{background:#E0A030}
  .net-ind.warte{background:rgba(224,160,48,.22);border-color:rgba(224,160,48,.6)}
  .chip.warte{background:#FDF3E3;color:#8A5A10}
  .chip.warte::before{background:#E0A030}

  /* ---- Objekt-Tagebuch: Zeitstrahl über alle Module ---- */
  .tb-filter{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px}
  .tb-chip{border:1px solid var(--line2);background:var(--surface);color:var(--muted);border-radius:999px;
    padding:5px 12px;font:600 12px Inter,Arial,sans-serif;cursor:pointer;white-space:nowrap}
  .tb-chip.on{background:var(--navy);border-color:var(--navy);color:#F4F2EC}
  .tb-jahr{display:flex;align-items:center;gap:10px;margin:22px 0 8px;font:700 13px Inter,Arial,sans-serif;color:var(--muted)}
  .tb-jahr::after{content:"";flex:1;height:1px;background:var(--line2)}
  .tb-liste{display:flex;flex-direction:column}
  .tb-e{display:grid;grid-template-columns:5.6rem 1.9rem 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
  .tb-e:first-child{border-top:none}
  .tb-d{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);padding-top:2px;white-space:nowrap}
  .tb-i{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
  .tb-i svg{width:15px;height:15px}
  .tb-t{min-width:0}
  .tb-t .h{font-weight:600;font-size:13.5px;line-height:1.35;word-break:break-word}
  .tb-t .s{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px;word-break:break-word}
  .tb-t .a{margin-top:7px}

  /* ---- Erfassungsbogen für die Ersterfassung vor Ort ---- */
  .erf-kopf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:14px 0 10px}
  .erf-kopf div{border:1px solid #9AA3B4;border-radius:6px;padding:6px 9px;font-size:11px;color:#4A5266;min-height:40px}
  .erf-kopf div b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;margin-bottom:3px}
  .erf-tab{width:100%;border-collapse:collapse;font-size:10.5px;table-layout:fixed}
  .erf-tab th,.erf-tab td{border:1px solid #9AA3B4;padding:4px 5px;vertical-align:top;word-break:break-word}
  .erf-tab th{background:#EEF1F7;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;text-align:left;color:#3A4254}
  .erf-tab td.leer{height:26px}
  .erf-tab .stand{background:#FCFCFD;min-width:64px}
  .erf-tab .klein{font-size:9.5px;color:#4A5266}
  .erf-neu td{height:30px;background:#FBFCFE}
  .erf-fuss{margin-top:10px;font-size:10.5px;color:#4A5266;line-height:1.5}
  @media print{ .erf-tab{font-size:9.5px} .erf-tab tr{page-break-inside:avoid} }

  /* ---- QR-Etiketten für Zählerplätze ---- */
  .etiketten{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
  .etikett{border:1px dashed #9AA3B4;border-radius:8px;padding:10px 11px;background:#fff;display:flex;gap:11px;align-items:flex-start;break-inside:avoid}
  .etikett .qr{flex:0 0 78px;width:78px}
  .etikett .qr svg{width:78px;height:78px;display:block}
  .etikett .txt{min-width:0;flex:1;font-size:10.5px;line-height:1.35;color:#0E1220}
  .etikett .txt .t1{font-weight:800;font-size:12px;margin-bottom:2px;word-break:break-word}
  .etikett .txt .t2{font-weight:600}
  .etikett .txt .t3{color:#4A5266}
  .etikett .txt .id{margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.02em;color:#0E1220;
    background:#EEF1F7;border-radius:4px;padding:1px 5px;display:inline-block}
  @media print{
    @page{margin:10mm}
    html,body{background:#fff !important}
    .app{box-shadow:none !important}
    header.top,.crumb,.no-print,#aiFab,#aiPanel,.drawer-bg,.modal-bg,.toast,.lightbox{display:none !important}
    main#view{padding:0 !important;max-width:none !important}
    .etiketten{grid-template-columns:repeat(3,1fr);gap:6px}
    .etikett{border-color:#BFC6D4;page-break-inside:avoid}
    .print-head{margin-bottom:6mm}
    a[href]:after{content:"" !important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9h0M9 12h0M9 15h0M9 18h0"/></svg>
        </div>
        <div style="min-width:0">
          <h1>Objektmanagement</h1>
          <div class="sub">Immobilien zentral verwalten</div>
        </div>
      </div>
      <div class="save-ind" id="saveInd"><span class="dot"></span><span id="saveTxt">Gespeichert</span></div>
      <button class="net-ind" id="netInd" onclick="offPanel()" title="Verbindungsstatus" style="display:none"></button>

function getPosition(){

    navigator.geolocation.getCurrentPosition(

      {enableHighAccuracy:true, timeout:15000, maximumAge:0}

function haversine(aLat,aLng,bLat,bLng){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(bLat-aLat), dLng=toR(bLng-aLng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toR(aLat))*Math.cos(toR(bLat))*Math.sin(dLng/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(s)));
}

function addMonthsISO(iso, months){ if(!iso||!months) return ""; const d=new Date(iso+"T00:00:00"); d.setMonth(d.getMonth()+Number(months)); return d.toISOString().slice(0,10); }

const DUE_SOON_DAYS = 30;
function wartStatus(a){
  // -> {next, days, level: 'overdue'|'soon'|'ok'|'none', label}
  if(!a.interval || !a.lastDate) return {next:"", days:null, level:"none", label:"kein Intervall"};
  const next=addMonthsISO(a.lastDate, a.interval);
  const d=daysUntil(next);
  let level="ok", label="planmäßig";
  if(d<0){ level="overdue"; label="überfällig"; }
  else if(d<=DUE_SOON_DAYS){ level="soon"; label="bald fällig"; }
  return {next, days:d, level, label};
}

/* ===================== Bildkompression ===================== */
function compressFile(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",quality));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
function recompressDataURL(dataURL, maxDim, quality){
  return new Promise((resolve)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/jpeg",quality));
    };
    img.onerror=()=>resolve(dataURL); img.src=dataURL;
  });
}

  const p=S.perm||{};
  const anyArea = canArea("objekte")||canArea("reinigung")||canArea("aufzuege")||canArea("sanierung")||canArea("tickets");
  const primaryBtn = canArea("objekte")?`<button class="btn primary" onclick="addHouse()">${I.plus} Neues Objekt</button>`:"";

  let body;

    body=`<div class="empty card" style="border-style:dashed">${I.building}<h3>Noch keine Bereiche freigeschaltet</h3>
      <p>Für dein Konto ist noch kein Bereich freigegeben. Bitte wende dich an die Verwaltung, damit dir die passenden Bereiche zugewiesen werden.</p></div>`;
  } else if(canArea("objekte")){
    const h=S.houses;
    if(!h.length){
      body=`<div class="empty card" style="border-style:dashed">${I.building}<h3>Noch keine Objekte angelegt</h3>
        <p>Lege dein erstes Objekt an, um Begehungen zu dokumentieren und über die Jahre zu vergleichen.</p>
        <div style="margin-top:18px"><button class="btn primary" onclick="addHouse()">${I.plus} Erstes Objekt anlegen</button></div></div>`;

      <div class="objbar" id="objbar">
        <div class="objsearch">${I.search}<input id="objSearch" placeholder="Objekt suchen (Name, WE, Adresse)…" value="${esc(S.homeFilter||"")}" oninput="onObjFilter(this.value)"></div>
        <select class="objsort" onchange="setObjSort(this.value)">
          <option value="name" ${sort==="name"?"selected":""}>Name A–Z</option>
          <option value="recent" ${sort==="recent"?"selected":""}>Zuletzt begangen</option>
          <option value="attention" ${sort==="attention"?"selected":""}>Handlungsbedarf zuerst</option>
        </select>
        <div class="objtoggle">
          <button id="objViewList" class="${S.homeView==="list"?"on":""}" onclick="setObjView('list')" title="Liste">${I.list}</button>
          <button id="objViewCards" class="${S.homeView==="cards"?"on":""}" onclick="setObjView('cards')" title="Kacheln">${I.grid}</button>
        </div>
      </div>
      <div id="objList"></div>`;
    }
  } else {

    if(canArea("aufzuege")) entries.push(`<div class="house card" onclick="openAufzuege()"><div class="hn">${I.lift} Aufzüge</div><div class="ha">Wartung, TÜV &amp; Störungsmeldungen</div></div>`);
    if(canArea("sanierung")) entries.push(`<div class="house card" onclick="openSanierung()"><div class="hn">${I.hammer} Wohnungssanierungen</div><div class="ha">Sanierungsprojekte mit Status &amp; Kosten</div></div>`);
    if(canArea("tickets")) entries.push(`<div class="house card" onclick="openTickets()"><div class="hn">${I.ticket} Tickets</div><div class="ha">Mängel-Tickets für Objekt, Mieteinheit &amp; Aufzug</div></div>`);

function objMatch(o,q){ q=q.toLowerCase(); return (o.name||"").toLowerCase().includes(q)||(o.unit||"").toLowerCase().includes(q)||(o.address||"").toLowerCase().includes(q); }
function houseAttn(o){ const a=(S.houseAttn&&S.houseAttn[o.id]); return a?((a.defects||0)+(a.wartOver||0)):0; }
function houseCard(o){
  const attn=houseAttn(o);
  return `<div class="house card" onclick="openHouse('${o.id}')">
    ${attn?`<span class="house-attn">${attn}</span>`:""}
    <div class="hn">${esc(o.name)}</div>
    <div class="ha">${o.unit?'WE '+esc(o.unit.replace(/^WE\s*/i,''))+(o.address?' · ':''):''}${esc(o.address||"")}</div>
    <div class="meta">
      <span>${I.book}<b>${o.count||0}</b>&nbsp;Begehungen</span>
      ${o.last?`<span>${I.clock}Zuletzt&nbsp;<b>${esc(fmtShort(o.last))}</b></span>`:`<span>Noch keine Begehung</span>`}
    </div></div>`;
}
function houseRow(o){
  const attn=houseAttn(o);
  return `<button class="objrow" onclick="openHouse('${o.id}')">
    <div class="or-main"><div class="or-name">${esc(o.name)}</div>
      <div class="or-sub">${o.unit?'WE '+esc(o.unit.replace(/^WE\s*/i,''))+(o.address?' · ':''):''}${esc(o.address||"")}</div></div>
    <div class="or-right">
      ${attn?`<span class="chip bad" title="offene Mängel / überfällige Wartung">${attn}</span>`:""}
      <span class="or-date">${o.last?esc(fmtShort(o.last)):"—"}<small>${o.count||0} Beg.</small></span>
      <span class="or-chev">${I.chev}</span>
    </div></button>`;
}
function renderObjList(){
  const box=document.getElementById("objList"); if(!box) return;
  let list=(S.houses||[]).slice();
  const q=(S.homeFilter||"").trim();
  if(q) list=list.filter(o=>objMatch(o,q));
  const sort=S.homeSort||"name";
  if(sort==="name") list.sort((a,b)=>(a.name||"").localeCompare(b.name||"","de"));
  else if(sort==="recent") list.sort((a,b)=>(b.last||"").localeCompare(a.last||"")|| (a.name||"").localeCompare(b.name||"","de"));
  else if(sort==="attention") list.sort((a,b)=>houseAttn(b)-houseAttn(a) || (a.name||"").localeCompare(b.name||"","de"));
  const total=(S.houses||[]).length, shown=list.length;
  const limit=S.homeLimit||40;
  const page=list.slice(0,limit);
  let inner;
  if(!page.length){
    inner=`<div class="empty card" style="border-style:dashed">${I.search}<h3>Keine Treffer</h3><p>Für „${esc(q)}" wurde kein Objekt gefunden.</p></div>`;
  } else if((S.homeView||"cards")==="cards"){
    inner=`<div class="grid cols2">`+page.map(houseCard).join("")+`</div>`;
  } else {
    inner=`<div class="objlist">`+page.map(houseRow).join("")+`</div>`;
  }
  const more = list.length>limit ? `<div style="text-align:center;margin-top:14px"><button class="btn" onclick="objMore()">${I.chevDown||""} ${list.length-limit} weitere anzeigen</button></div>` : "";
  const count = `<div class="objcount">${shown===total?`${total} Objekte`:`${shown} von ${total} Objekten`}${list.length>limit?` · zeige ${limit}`:""}</div>`;
  box.innerHTML=count+inner+more;
}
function onObjFilter(v){ S.homeFilter=v; S.homeLimit=40; renderObjList(); }
function setObjSort(v){ S.homeSort=v; renderObjList(); }
function setObjView(v){
  S.homeView=v; renderObjList();
  const l=document.getElementById("objViewList"), c=document.getElementById("objViewCards");
  if(l&&c){ l.classList.toggle("on",v==="list"); c.classList.toggle("on",v==="cards"); }
}
function objMore(){ S.homeLimit=(S.homeLimit||40)+40; renderObjList(); }
function dashCard(ic,label,main,sub,accent,fn){
  return `<button class="dash-card${accent?(" "+accent):""}" onclick="${fn}">
    <div class="dc-top">${ic}<span>${esc(label)}</span></div>
    <div class="dc-main">${main}</div>
    ${sub?`<div class="dc-sub">${sub}</div>`:""}
  </button>`;
}
function renderDashCards(d){
  const cards=[];
  if(canArea("tickets")) cards.push(dashCard(I.ticket,"Tickets offen",d.tkOpen??0, d.tkOver?`<span class="dc-bad">${d.tkOver} überfällig</span>`:"keine überfällig", d.tkOver?"accent-bad":"", "openTickets()"));
  if(canArea("objekte")) cards.push(dashCard(I.alert,"Offene Mängel",d.mCount??0, d.mHouses?`in ${d.mHouses} Objekt${d.mHouses===1?"":"en"}`:"keine offen", d.mCount?"accent-bad":"", "openDefects()"));
  if(canArea("objekte")) cards.push(dashCard(I.wrench,"Wartungen fällig",(d.wOver??0)+(d.wSoon??0), `<span class="${d.wOver?"dc-bad":""}">${d.wOver||0} überfällig</span> · ${d.wSoon||0} bald`, d.wOver?"accent-bad":(d.wSoon?"accent-mid":""), "openWartung()"));
  if(canArea("aufzuege")) cards.push(dashCard(I.lift,"Aufzüge",d.azMeld??0, `${d.azMeld||0} Meldungen · <span class="${d.azOver?"dc-bad":""}">${d.azOver||0} überfällig</span>`, d.azOver?"accent-bad":"", "openAufzuege()"));
  if(canArea("reinigung")) cards.push(dashCard(I.broom,"Reinigung heute",d.rToday??0, d.rLaufend?`${d.rLaufend} laufend`:"keine laufend", d.rLaufend?"accent-mid":"", "openReinigung()"));
  if(canArea("sanierung")) cards.push(dashCard(I.hammer,"Sanierungen laufend",d.sLauf??0, d.sLauf?"in Bearbeitung":"keine laufend", "", "openSanierung()"));
  if(canArea("objekte")||canArea("aufzuege")) cards.push(dashCard(I.bell,"Meldungen überfällig",d.mlOver??0, `${d.mlOpen||0} offen gesamt`, d.mlOver?"accent-bad":"", "openMeldungen()"));
  if(canArea("objekte")) cards.push(dashCard(I.grid,"Zähler abzulesen",d.zOffen??0, `${d.zGesamt||0} Zähler · <span class="${d.zProblem?"dc-bad":""}">${d.zProblem||0} Problemfälle</span>`, d.zProblem?"accent-bad":(d.zOffen?"accent-mid":""), "openAblesung()"));
  return cards.join("");
}
async function fillDashboard(){
  const el=document.getElementById("dashCards"); if(!el) return;
  el.innerHTML=`<div class="dash-load">Übersicht wird geladen…</div>`;
  const d={};
  try{
    if(canArea("tickets")){ const t=S.tickets&&S.tickets.length!==undefined?S.tickets:(S.tickets=await DB.listTickets()); d.tkOpen=t.filter(x=>x.status!=="erledigt").length; d.tkOver=t.filter(tkOverdue).length; }
    if(canArea("objekte")){
      const an=await DB.allAnlagen();
      d.wOver=an.filter(x=>wartStatus(x).level==="overdue").length;
      d.wSoon=an.filter(x=>wartStatus(x).level==="soon").length;
      const defs=await collectDefects();
      d.mCount=defs.reduce((s,g)=>s+g.defs.filter(x=>x.cond==="mangelhaft").length,0);
      d.mHouses=defs.filter(g=>g.defs.some(x=>x.cond==="mangelhaft")).length;
      const attn={};
      defs.forEach(g=>{ const c=g.defs.filter(x=>x.cond==="mangelhaft").length; if(c){ (attn[g.house.id]=attn[g.house.id]||{defects:0,wartOver:0}).defects+=c; } });
      an.forEach(a=>{ if(wartStatus(a).level==="overdue"){ const id=a.houseId; (attn[id]=attn[id]||{defects:0,wartOver:0}).wartOver++; } });
      S.houseAttn=attn;
      if(S.view==="home") renderObjList();
      const zz=await DB.allZaehler(), aa=(await DB.allAblesungen()).concat(offAll()), per=abPeriode();
      const cur=z=>aa.filter(x=>x.zaehlerId===z.id&&(x.datum||"").slice(0,4)===per)
        .sort((x,y)=>(y.datum||"").localeCompare(x.datum||""))[0]||null;
      d.zGesamt=zz.length;
      d.zOffen=zz.filter(z=>!cur(z)).length;
      d.zProblem=zz.filter(z=>{ const c=cur(z); return c && c.status!=="abgelesen"; }).length;
    }
    if(canArea("aufzuege")){
      const az=await DB.listAufzuege();
      d.azOver=az.filter(x=>liftWart(x).level==="overdue"||liftTuev(x).level==="overdue").length;
      const meta=await DB.allMeldungenMeta();
      d.azMeld=meta.filter(m=>m.status!=="behoben").length;
    }
    if(canArea("reinigung")){ const rs=await DB.reinigungStats(); d.rToday=rs.today; d.rLaufend=rs.laufend; }
    if(canArea("sanierung")){ const sa=await DB.listSanierungen(); d.sLauf=sa.filter(x=>x.status==="laufend").length; }
    if(canArea("objekte")||canArea("aufzuege")){ const l=await DB.listMeldungenLog(); d.mlOver=l.filter(logOverdue).length; d.mlOpen=l.filter(x=>x.status!=="erledigt").length; }
  }catch(e){ console.error(e); }
  S.dash=d;
  // Menü-Badge konsistent aus denselben Zahlen
  S.alerts={ tickets:d.tkOver||0, meldungen:d.mlOver||0, wartung:d.wOver||0, aufzug:d.azOver||0, total:(d.tkOver||0)+(d.mlOver||0)+(d.wOver||0)+(d.azOver||0) };
  refreshMenuBadge();
  if(document.getElementById("dashCards")) document.getElementById("dashCards").innerHTML=renderDashCards(d);
}
async function refreshHouseStats(){
  const meta=await DB.allInspMeta();   // [{id,house_id,date}] absteigend nach Datum
  const byHouse={};
  meta.forEach(m=>{ const h=byHouse[m.house_id]||(byHouse[m.house_id]={count:0,last:null}); h.count++; if(!h.last||(m.date||"")>h.last) h.last=m.date; });
  let changed=false;
  for(const o of S.houses){
    const s=byHouse[o.id]||{count:0,last:null};
    if(o.count!==s.count||o.last!==s.last){ o.count=s.count; o.last=s.last; changed=true; }
  }
  if(changed && S.view==="home") renderObjList();
}

/* ---------- HOUSE: Tagebuch + Technik/Wartung ---------- */
function renderHouse(){
  const o=S.houses.find(x=>x.id===S.houseId);
  if(!o) return goHome();
  const tab=S.houseTab||"begehungen";
  const items=S.hidx;
  const overdue=(S.anlagen||[]).filter(a=>wartStatus(a).level==="overdue").length;
  const soon=(S.anlagen||[]).filter(a=>wartStatus(a).level==="soon").length;
  const wartBadge = overdue?`<span class="chip bad" style="margin-left:7px">${overdue} überfällig</span>`:(soon?`<span class="chip mid" style="margin-left:7px">${soon} bald</span>`:"");

  const zList=S.zaehler||[];
  const zOffen=zList.filter(z=>!zPeriodeEintrag(z.id,abPeriode())).length;
  const zBadge = zOffen?`<span class="chip mid" style="margin-left:7px">${zOffen} offen</span>`:"";

  const tabs=`<div class="tabs">
    <button class="tab ${tab==='begehungen'?'on':''}" onclick="setHouseTab('begehungen')">${I.book} Begehungen <span class="tabn">${items.length}</span></button>
    <button class="tab ${tab==='wartung'?'on':''}" onclick="setHouseTab('wartung')">${I.wrench} Technik &amp; Wartung <span class="tabn">${(S.anlagen||[]).length}</span>${wartBadge}</button>
    <button class="tab ${tab==='zaehler'?'on':''}" onclick="setHouseTab('zaehler')">${I.grid} Zähler &amp; Ablesung <span class="tabn">${zList.length}</span>${zBadge}</button>
    <button class="tab ${tab==='tagebuch'?'on':''}" onclick="setHouseTab('tagebuch')">${I.clock} Tagebuch${(S._tb&&S._tb.length)?` <span class="tabn">${S._tb.length}</span>`:""}</button>
  </div>`;

  let content, toolbar;
  if(tab==="tagebuch"){
    toolbar=`<button class="btn" onclick="openStammblatt()">${I.book} Stammblatt</button><button class="btn" onclick="exportObjektakte()">${I.pdf} Objektakte</button>`;
    content=houseTagebuchHTML();
  } else if(tab==="zaehler"){
    toolbar=`<button class="btn" onclick="openStammblatt()">${I.book} Stammblatt</button>${zList.length?`<button class="btn" onclick="mailAbleseauftrag('house')">${I.mail} Ableseauftrag</button><button class="btn" onclick="openEtiketten()">${I.grid} QR-Etiketten</button>`:""}<button class="btn" onclick="openErfassung()">${I.clip} Erfassungsbogen</button>${zList.length?`<button class="btn" onclick="exportZaehlerCSV('house')">${I.download} CSV</button>`:""}<button class="btn primary" onclick="addZaehler()">${I.plus} Zähler anlegen</button>`;
    content=houseZaehlerHTML();
  } else if(tab==="wartung"){
    toolbar=`<button class="btn" onclick="openStammblatt()">${I.book} Stammblatt</button><button class="btn" onclick="openDokumente()">${I.file} Dokumente</button><button class="btn" onclick="exportObjektakte()">${I.pdf} Objektakte</button><button class="btn primary" onclick="addAnlage()">${I.plus} Anlage hinzufügen</button>`;
    content=houseWartungHTML();
  } else {
    const canCompare=items.length>=2;
    toolbar=`<button class="btn" onclick="openStammblatt()">${I.book} Stammblatt</button><button class="btn" onclick="openDokumente()">${I.file} Dokumente</button><button class="btn" onclick="exportObjektakte()">${I.pdf} Objektakte</button>${canCompare?`<button class="btn" onclick="startCompare()">${I.compare} Vergleichen</button>`:""}<button class="btn primary" onclick="newInspection()">${I.plus} Neue Begehung</button>`;
    content=houseBegehungenHTML(items);
  }
  view.innerHTML=`
    <div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>${esc(o.name)}</div>
    <div class="page-head">
      <div>
        <h2>${esc(o.name)}</h2>
        <div class="lead">${o.unit?'Wirtschaftseinheit '+esc(o.unit.replace(/^WE\s*/i,''))+(o.address?' · ':''):''}${esc(o.address||"")}</div>
      </div>
      <div class="toolbar">${toolbar}</div>

  if(tab==="wartung") loadThumbs();

function setHouseTab(t){
  S.houseTab=t;
  if(t==="tagebuch" && S._tbHouse!==S.houseId){ S._tbHouse=S.houseId; return openTagebuch(); }
  renderHouse();
}

function houseBegehungenHTML(items){
  let tl;
  if(!items.length){
    tl=`<div class="empty card" style="border-style:dashed">${I.book}<h3>Noch keine Begehung</h3><p>Starte die erste Begehung für dieses Objekt.</p>
        <div style="margin-top:18px"><button class="btn primary" onclick="newInspection()">${I.plus} Begehung starten</button></div></div>`;
  } else {
    tl=`<div class="timeline">`+items.map(it=>{
      const c=it.counts||{gut:0,mittel:0,mangelhaft:0};
      const chips=[];
      if(c.gut) chips.push(`<span class="chip good">${c.gut} gut</span>`);
      if(c.mittel) chips.push(`<span class="chip mid">${c.mittel} mittel</span>`);
      if(c.mangelhaft) chips.push(`<span class="chip bad">${c.mangelhaft} Mangel</span>`);
      if(!chips.length) chips.push(`<span class="chip na">ohne Bewertung</span>`);
      return `<div class="tl-item"><div class="tl-card card">
        <div class="tl-date">${esc(fmtShort(it.date))}<small>${esc(it.inspector||"ohne Begeher")}${it.finalized?" · ✓ abgeschlossen":""}</small></div>
        <div class="tl-stats">${chips.join("")}</div>
        <div class="tl-actions">
          <button class="btn sm" onclick="editInspection('${it.id}',true)">${I.eye} Ansehen</button>
          <button class="btn sm" onclick="editInspection('${it.id}',false)">${I.edit} Bearbeiten</button>
          <button class="btn sm" onclick="exportPDF('${it.id}')">${I.pdf} PDF</button>
          <button class="btn sm danger" onclick="delInspection('${it.id}')">${I.trash}</button>
        </div>
      </div></div>`;
    }).join("")+`</div>`;
  }
  return `${items.length?`<div class="hint">${I.info}<div>Die <b>neue Begehung</b> übernimmt automatisch die Bereiche &amp; Spalten der letzten Begehung als Vorlage. Beim Bearbeiten siehst du pro Bereich den <b>Vorbefund</b> der letzten Begehung zum direkten Abgleich.</div></div>`:""}${tl}`;
}

function houseWartungHTML(){
  const list=(S.anlagen||[]).slice().sort((a,b)=>{
    const da=wartStatus(a).days, db=wartStatus(b).days;
    return (da==null?1e9:da)-(db==null?1e9:db);
  });
  if(!list.length){
    return `<div class="empty card" style="border-style:dashed">${I.wrench}<h3>Noch keine Anlagen erfasst</h3>
      <p>Trage technische Anlagen mit ihrem Wartungsintervall ein – die nächste Fälligkeit wird automatisch berechnet.</p>
      <div style="margin-top:18px"><button class="btn primary" onclick="addAnlage()">${I.plus} Anlage hinzufügen</button></div></div>`;
  }
  const rows=list.map(a=>{
    const s=wartStatus(a);
    const due = s.level==="none"?`<span class="chip na">kein Intervall</span>`
      : `<span class="chip ${wartClass(s.level)}">${s.label}${s.days!=null?` · ${s.days<0?Math.abs(s.days)+' T überfällig':'in '+s.days+' T'}`:""}</span>`;
    const iv = a.interval?`alle ${a.interval} Mon.`:"–";
    return `<div class="def card ${s.level==="soon"?"mid":""}" style="border-left-color:var(--${s.level==="overdue"?"bad":s.level==="soon"?"mid":s.level==="ok"?"good":"na"})">
      <div class="body">
        <div class="area">${esc(a.name||"(ohne Bezeichnung)")} ${a.art?`<span class="chip na" style="font-weight:600">${esc(a.art)}</span>`:""} ${due}</div>
        <div class="kv"><b>Intervall:</b> ${iv}${a.firm?` &nbsp;·&nbsp; <b>Fachfirma:</b> ${esc(a.firm)}`:""}</div>
        <div class="kv"><b>Letzte Wartung:</b> ${a.lastDate?esc(fmtShort(a.lastDate)):"–"} &nbsp;·&nbsp; <b>Nächste:</b> ${s.next?esc(fmtShort(s.next)):"–"}</div>
        ${a.note?`<div class="kv" style="color:var(--muted)">${esc(a.note)}</div>`:""}
        <div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">
          <button class="btn sm" onclick="wartungDone('${a.id}')">${I.done} Wartung heute erledigt</button>
          <button class="btn sm" onclick="mailAnlage('${a.id}')">${I.mail} Firma anschreiben</button>
          <button class="btn sm" onclick="openWartHist('${a.id}')">${I.book} Historie</button>
          <button class="btn sm" onclick="addAnlage('${a.id}')">${I.edit} Bearbeiten</button>
          <button class="btn sm danger" onclick="delAnlage('${a.id}')">${I.trash}</button>
        </div>
      </div></div>`;
  }).join("");
  return rows;
}

/* ===================== Zähler & Ablesung ===================== */
const MEDIEN=["Strom","Wasser (kalt)","Wasser (warm)","Wärme","Gas"];
const ZAEHLER_ART=["Hauptzähler","Unterzähler"];
const ABLESE_STATUS=["abgelesen","nicht gefunden","kein Zugang","defekt","ausgebaut"];
const ABLESE_QUELLE=["vor Ort","Messstellenbetreiber","Portal / Rechnung","Schätzung"];
/* Eichgültigkeitsdauer als Orientierung: Strom elektronisch 8 J., Ferraris 16 J., Wasser/Wärme 6 J. */

function zMediumIcon(m){ return m&&m.indexOf("Wasser")===0 ? "💧" : m==="Wärme" ? "🔥" : m==="Gas" ? "🟠" : "⚡"; }
function zStandort(z){
  const p=[z.aufgang,z.etage,z.raum,z.platz].map(x=>(x||"").trim()).filter(Boolean);
  return p.length? p.join(" · ") : "";
}
function eichStatus(z){
  if(!z.eichBis) return {level:"none", label:"Eichfrist nicht erfasst", days:null};
  const d=daysUntil(z.eichBis);
  if(d<0)   return {level:"overdue", label:"Eichfrist abgelaufen", days:d};
  if(d<=180)return {level:"soon",    label:"Eichfrist läuft aus",  days:d};
  return {level:"ok", label:"geeicht", days:d};
}
function abPeriode(){ return S.zPeriode || String(new Date().getFullYear()); }
function zLetzte(zid, bisPeriode){
  const list=(S.ablesungen||[]).filter(a=>a.zaehlerId===zid && a.stand!=null)
    .sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));
  if(bisPeriode) return list.find(a=>(a.datum||"").slice(0,4)<bisPeriode)||null;
  return list[0]||null;
}
function zPeriodeEintrag(zid, per){
  return (S.ablesungen||[]).filter(a=>a.zaehlerId===zid && (a.datum||"").slice(0,4)===per)
    .sort((a,b)=>(b.datum||"").localeCompare(a.datum||""))[0]||null;
}
/* Plausibilitätsprüfung: fängt Zahlendreher, Rücklauf und Zählerüberlauf ab */
function zPlausi(z, neuStand, neuDatum){
  if(neuStand==null||neuStand==="") return null;
  const neu=Number(neuStand);
  if(!isFinite(neu)) return {level:"bad", msg:"Der Zählerstand ist keine gültige Zahl."};
  if(neu<0) return {level:"bad", msg:"Ein negativer Zählerstand ist nicht möglich."};
  if(z.stellen && String(Math.floor(neu)).length > z.stellen)
    return {level:"bad", msg:`Der Wert hat mehr Stellen (${String(Math.floor(neu)).length}) als das Zählwerk (${z.stellen}). Bitte Eingabe prüfen.`};
  const prev=zLetzte(z.id);
  if(!prev) return null;
  if(neu < prev.stand){
    return {level:"bad", msg:`Rücklauf: Der neue Stand (${zNum(neu)}) liegt unter dem letzten Stand vom ${fmtShort(prev.datum)} (${zNum(prev.stand)}). Zählerwechsel, Überlauf oder Zahlendreher?`};
  }
  const tage=Math.max(1, Math.round((new Date(neuDatum+"T00:00:00")-new Date(prev.datum+"T00:00:00"))/86400000));
  const proTag=(neu-prev.stand)/tage;
  const vor=zLetzte(z.id, (prev.datum||"").slice(0,4));
  if(vor && vor.stand!=null){
    const tageV=Math.max(1, Math.round((new Date(prev.datum+"T00:00:00")-new Date(vor.datum+"T00:00:00"))/86400000));
    const proTagV=(prev.stand-vor.stand)/tageV;
    if(proTagV>0 && proTag > proTagV*3)
      return {level:"warn", msg:`Auffällig hoher Verbrauch: ${zNum(Math.round(proTag*365))} pro Jahr gegenüber ${zNum(Math.round(proTagV*365))} in der Vorperiode. Bitte gegenprüfen.`};
    if(proTagV>0 && proTag < proTagV*0.25)
      return {level:"warn", msg:`Auffällig niedriger Verbrauch: ${zNum(Math.round(proTag*365))} pro Jahr gegenüber ${zNum(Math.round(proTagV*365))} in der Vorperiode. Bitte gegenprüfen.`};
  }
  return {level:"ok", msg:`Verbrauch seit ${fmtShort(prev.datum)}: ${zNum(Math.round((neu-prev.stand)*(z.faktor||1)))} ${zEinheit(z)} in ${tage} Tagen.`};
}
function zNum(n){ return (n==null||n==="")?"–":Number(n).toLocaleString("de-DE"); }
function zEinheit(z){ return z.medium==="Strom"?"kWh":(z.medium&&z.medium.indexOf("Wasser")===0)?"m³":z.medium==="Wärme"?"kWh":z.medium==="Gas"?"m³":""; }

/* ---------- Objekt-Tab „Zähler" ---------- */
function houseZaehlerHTML(){
  const per=abPeriode();
  const list=(S.zaehler||[]).slice().sort((a,b)=>
    (a.art===b.art?0:(a.art==="Hauptzähler"?-1:1)) || (a.bezeichnung||"").localeCompare(b.bezeichnung||""));
  if(!list.length){
    return `<div class="empty card" style="border-style:dashed">${I.grid}<h3>Noch keine Zähler erfasst</h3>
      <p>Lege je Liegenschaft die Allgemein- und Unterzähler an: Zählernummer, Standort im Gebäude und Eichfrist.
      Danach kann vor Ort abgelesen werden, ohne den Zähler zu suchen.</p>
      <div style="margin-top:18px"><button class="btn primary" onclick="addZaehler()">${I.plus} Zähler anlegen</button></div></div>`;
  }
  const offen=list.filter(z=>!zPeriodeEintrag(z.id,per)).length;
  const head=`<div class="hint">${I.info}<div>Ableseperiode <b>${esc(per)}</b> · <b>${list.length-offen}</b> von <b>${list.length}</b> Zählern erfasst${offen?` · <b>${offen}</b> offen`:" · vollständig"}.</div></div>`;
  const rows=list.map(z=>{
    const e=eichStatus(z);
    const cur=zPeriodeEintrag(z.id,per);
    const prev=zLetzte(z.id, per);
    const lvl = cur ? (cur.status==="abgelesen"?"ok":"overdue") : "soon";
    const statusChip = cur
      ? (cur.status==="abgelesen"
          ? `<span class="chip good">${esc(per)}: ${zNum(cur.stand)} ${esc(zEinheit(z))}</span>`
          : `<span class="chip bad">${esc(per)}: ${esc(cur.status)}</span>`)
      : `<span class="chip mid">${esc(per)}: noch offen</span>`;
    const eichChip = e.level==="none" ? `<span class="chip na">Eichfrist offen</span>`
      : `<span class="chip ${wartClass(e.level)}">${esc(e.label)}${e.days!=null&&e.level!=="ok"?` · ${e.days<0?Math.abs(e.days)+" T":"in "+e.days+" T"}`:""}</span>`;
    const ort=zStandort(z);
    return `<div class="def card" style="border-left-color:var(--${lvl==="overdue"?"bad":lvl==="soon"?"mid":"good"})">
      <div class="body">
        <div class="area">${zMediumIcon(z.medium)} ${esc(z.bezeichnung||z.nummer||"(ohne Bezeichnung)")}
          <span class="chip na" style="font-weight:600">${esc(z.art)}</span> ${statusChip} ${(cur&&cur.pending)?`<span class="chip warte">wartet auf Übertragung</span>`:""} ${eichChip}
          ${z.fernauslesbar?`<span class="chip good">fernauslesbar</span>`:""}
          ${(z.faktor&&z.faktor!==1)?`<span class="chip mid">Wandler ×${esc(String(z.faktor))}</span>`:""}</div>
        <div class="kv"><b>Zählernummer:</b> ${esc(z.nummer||"–")} &nbsp;·&nbsp; <b>Medium:</b> ${esc(z.medium)}${z.stellen?` &nbsp;·&nbsp; <b>Zählwerk:</b> ${esc(String(z.stellen))} Stellen`:""}</div>

        <div class="kv"><b>Vorperiode:</b> ${prev?`${esc(fmtShort(prev.datum))} · ${zNum(prev.stand)} ${esc(zEinheit(z))}`:"–"}${z.msb?` &nbsp;·&nbsp; <b>Messstellenbetreiber:</b> ${esc(z.msb)}`:""}${z.eichBis?` &nbsp;·&nbsp; <b>Eichfrist bis:</b> ${esc(fmtShort(z.eichBis))}`:""}</div>
        ${z.note?`<div class="kv" style="color:var(--muted)">${esc(z.note)}</div>`:""}
        <div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">
          <button class="btn sm primary" onclick="ableseModal('${z.id}')">${I.pen} Ablesen</button>
          <button class="btn sm" onclick="mailZaehler('${z.id}')">${I.mail} Firma anschreiben</button>
          <button class="btn sm" onclick="openZHist('${z.id}')">${I.book} Historie</button>
          <button class="btn sm" onclick="addZaehler('${z.id}')">${I.edit} Bearbeiten</button>
          <button class="btn sm danger" onclick="delZaehler('${z.id}')">${I.trash}</button>
        </div>
      </div></div>`;
  }).join("");
  return head+rows;
}

function zGeoErfassen(){
  const f=document.getElementById("zGeo"); if(!f) return;
  if(!navigator.geolocation){ toast("Dieses Gerät liefert keine Position."); return; }
  f.value="Position wird ermittelt…";
  navigator.geolocation.getCurrentPosition(
    p=>{ f.value=p.coords.latitude.toFixed(6)+", "+p.coords.longitude.toFixed(6);
         toast("Position übernommen (Genauigkeit ca. "+Math.round(p.coords.accuracy)+" m)."); },
    e=>{ f.value=""; toast("Position nicht verfügbar"+(e&&e.message?": "+e.message:" – im Keller normal.")); },
    {enableHighAccuracy:true, timeout:10000, maximumAge:0});
}
async function saveZaehlerForm(id){
  const nr=document.getElementById("zNr").value.trim();
  const bez=document.getElementById("zBez").value.trim();
  if(!nr && !bez){ toast("Bitte Zählernummer oder Bezeichnung angeben."); return; }
  const geo=(document.getElementById("zGeo").value||"").split(",").map(s=>parseFloat(s.trim()));
  const hasGeo = geo.length===2 && isFinite(geo[0]) && isFinite(geo[1]);
  const z={ id:id||uid(), houseId:S.houseId, nummer:nr, bezeichnung:bez,
    medium:document.getElementById("zMed").value,
    art:document.getElementById("zArt").value,
    aufgang:document.getElementById("zAufgang").value.trim(),
    etage:document.getElementById("zEtage").value.trim(),
    raum:document.getElementById("zRaum").value.trim(),
    platz:document.getElementById("zPlatz").value.trim(),
    stellen:parseInt(document.getElementById("zStellen").value,10)||null,
    faktor:parseFloat(document.getElementById("zFaktor").value)||1,
    eichBis:document.getElementById("zEich").value||"",
    msb:document.getElementById("zMsb").value.trim(),
    fernauslesbar:document.getElementById("zFern").checked,
    lat:hasGeo?geo[0]:null, lng:hasGeo?geo[1]:null,
    note:document.getElementById("zNote").value.trim(), status:"aktiv" };
  try{ await DB.saveZaehler(z); }catch(e){ showError("Zähler konnte nicht gespeichert werden", e); return; }
  const pos=(S.zaehler||[]).findIndex(x=>x.id===z.id);
  if(pos>=0) S.zaehler[pos]=z; else (S.zaehler=S.zaehler||[]).push(z);
  closeModal(); renderHouse();
}
function delZaehler(id){
  confirmModal("Zähler löschen?","Der Zähler wird mit allen Ablesungen dauerhaft aus diesem Objekt entfernt.",async()=>{
    await DB.deleteZaehler(id);
    S.zaehler=(S.zaehler||[]).filter(x=>x.id!==id);
    S.ablesungen=(S.ablesungen||[]).filter(a=>a.zaehlerId!==id);
    renderHouse();
  });
}

    ${ort?`<div class="hint">${I.mapPin}<div><b>Standort:</b> ${esc(ort)}${z.note?`<br>${esc(z.note)}`:""}</div></div>`:""}
    <div class="field"><label>Status</label><select id="abStatus" onchange="zToggleStand()">${sel(ABLESE_STATUS,"abgelesen")}</select></div>
    <div class="field" id="abStandBox"><label>Zählerstand${zEinheit(z)?` (${esc(zEinheit(z))})`:""}</label>

    <div class="field"><label>Quelle</label><select id="abQuelle">${sel(ABLESE_QUELLE, z.fernauslesbar?"Messstellenbetreiber":"vor Ort")}</select></div>
    <div class="field"><label>Bemerkung (optional)</label><input id="abNote" placeholder="z. B. Zähler verschmutzt, Plombe beschädigt"></div>

    <button class="btn primary" onclick="saveAblesungForm('${zid}')">Speichern</button></div>`);

function zToggleStand(){
  const st=document.getElementById("abStatus").value;
  const box=document.getElementById("abStandBox");
  if(box) box.style.display = (st==="abgelesen") ? "" : "none";
}
function zPruefeStand(zid){
  const z=(S.zaehler||[]).find(x=>x.id===zid); if(!z) return;
  const box=document.getElementById("abPruef"); if(!box) return;
  const v=document.getElementById("abStand").value;
  const d=document.getElementById("abDatum").value||todayISO();
  if(v===""){ box.innerHTML=""; return; }
  const r=zPlausi(z, v, d);
  if(!r){ box.innerHTML=""; return; }
  const col = r.level==="bad"?"var(--bad)":r.level==="warn"?"var(--mid)":"var(--good)";
  box.innerHTML=`<div style="border-left:3px solid ${col};padding:7px 10px;background:rgba(0,0,0,.03);border-radius:6px;font-size:12.5px;line-height:1.45">${esc(r.msg)}</div>`;
}
async function saveAblesungForm(zid){
  const z=(S.zaehler||[]).find(x=>x.id===zid); if(!z) return;
  const status=document.getElementById("abStatus").value;
  const datum=document.getElementById("abDatum").value||todayISO();
  const standRaw=document.getElementById("abStand").value;
  if(status==="abgelesen" && standRaw===""){ toast("Bitte einen Zählerstand eingeben – oder den Status ändern."); return; }
  if(status==="abgelesen"){
    const r=zPlausi(z, standRaw, datum);
    if(r && r.level==="bad" && !S._zForce){
      S._zForce=true;
      document.getElementById("abPruef").innerHTML=
        `<div style="border-left:3px solid var(--bad);padding:7px 10px;background:rgba(0,0,0,.03);border-radius:6px;font-size:12.5px;line-height:1.45">
          ${esc(r.msg)}<br><b>Noch einmal auf „Speichern" klicken, um den Wert trotzdem zu übernehmen.</b></div>`;
      return;
    }
  }
  S._zForce=false;
  const a={ id:uid(), zaehlerId:zid, houseId:z.houseId, datum,
    stand: status==="abgelesen"? Number(standRaw) : null,
    ableser:document.getElementById("abAbleser").value.trim(),
    quelle:document.getElementById("abQuelle").value,
    status, note:document.getElementById("abNote").value.trim() };
  let wartend=false;
  if(!istOnline()){
    offPush(a); wartend=true;                     // kein Netz: im Gerät zwischenspeichern
  } else {
    try{ await DB.saveAblesung(a); }
    catch(e){ offPush(a); wartend=true; }          // Übertragung gescheitert: ebenfalls zwischenspeichern
  }
  (S.ablesungen=S.ablesungen||[]).push(wartend?Object.assign({},a,{pending:true}):a);
  closeModal(); netRefresh();
  toast(wartend
    ? "Im Gerät gespeichert – wird übertragen, sobald wieder Netz da ist."
    : (status==="abgelesen"?"Ablesung gespeichert.":`Als „${status}" vermerkt – erscheint in der offenen Liste.`));
  renderHouse();
}
function openZHist(zid){
  const z=(S.zaehler||[]).find(x=>x.id===zid); if(!z) return;
  const list=(S.ablesungen||[]).filter(a=>a.zaehlerId===zid)
    .sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));
  let rows;
  if(!list.length){ rows=`<p class="m">Für diesen Zähler ist noch keine Ablesung erfasst.</p>`; }
  else {
    rows=`<div>`+list.map((a,i)=>{
      const nxt=list.slice(i+1).find(x=>x.stand!=null);
      let verbrauch="";
      if(a.stand!=null && nxt && nxt.stand!=null){
        const tage=Math.max(1,Math.round((new Date(a.datum+"T00:00:00")-new Date(nxt.datum+"T00:00:00"))/86400000));
        verbrauch=` · Verbrauch ${zNum(Math.round((a.stand-nxt.stand)*(z.faktor||1)))} ${zEinheit(z)} in ${tage} T`;
      }
      const bad=a.status!=="abgelesen";
      return `<div class="col-row" style="align-items:flex-start">
        <div style="flex:1">
          <div style="font-weight:600;font-size:13.5px">${esc(fmtShort(a.datum))} · ${bad?`<span style="color:var(--bad)">${esc(a.status)}</span>`:`${zNum(a.stand)} ${esc(zEinheit(z))}`}${a.pending?` <span class="chip warte">wartet</span>`:""}</div>
          <div style="font-size:12px;color:var(--muted)">${esc(a.ableser||"–")} · ${esc(a.quelle)}${esc(verbrauch)}${a.note?` · ${esc(a.note)}`:""}</div>
        </div>
        <button class="btn sm danger" onclick="delAblesung('${a.id}','${zid}')">${I.trash}</button>
      </div>`;
    }).join("")+`</div>`;
  }
  modal(`<h3>Historie – ${esc(z.bezeichnung||z.nummer)}</h3>
    <p class="m">Nr. ${esc(z.nummer||"–")}${zStandort(z)?` · ${esc(zStandort(z))}`:""}</p>
    ${rows}
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Schließen</button>
    <button class="btn primary" onclick="closeModal();ableseModal('${zid}')">${I.pen} Neue Ablesung</button></div>`);
}
function delAblesung(id,zid){
  confirmModal("Ablesung löschen?","Der Eintrag wird dauerhaft aus der Historie entfernt.",async()=>{
    const q=offQueue();
    if(q.some(a=>a.id===id)) offWrite(q.filter(a=>a.id!==id));   // wartender Eintrag: aus der Warteschlange
    else await DB.deleteAblesung(id);
    S.ablesungen=(S.ablesungen||[]).filter(a=>a.id!==id);
    closeModal(); renderHouse();
    setTimeout(()=>openZHist(zid),80);
  });
}

/* ---------- CSV-Export für die Betriebskostenabrechnung ---------- */
function zCsvCell(v){ const s=(v==null?"":String(v)); return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function zDownload(name, text){
  const blob=new Blob(["﻿"+text],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function exportZaehlerCSV(scope){
  const per=abPeriode();
  const houses={}; (S.houses||[]).forEach(h=>houses[h.id]=h);
  const zs = scope==="all" ? (S._zAll||[]) : (S.zaehler||[]);
  const abs = scope==="all" ? (S._aAll||[]) : (S.ablesungen||[]);
  const last=(zid,bis)=>abs.filter(a=>a.zaehlerId===zid&&a.stand!=null&&(!bis||(a.datum||"").slice(0,4)<bis))
    .sort((a,b)=>(b.datum||"").localeCompare(a.datum||""))[0]||null;
  const cur=(zid)=>abs.filter(a=>a.zaehlerId===zid&&(a.datum||"").slice(0,4)===per)
    .sort((a,b)=>(b.datum||"").localeCompare(a.datum||""))[0]||null;
  const head=["Objekt","Wirtschaftseinheit","Zaehlernummer","Bezeichnung","Medium","Art","Standort","Wandlerfaktor",
    "Stand Vorperiode","Datum Vorperiode","Stand "+per,"Datum "+per,"Status","Verbrauch","Einheit","Ableser","Quelle","Bemerkung"];
  const lines=[head.join(";")];
  zs.forEach(z=>{
    const h=houses[z.houseId]||{name:"",unit:""};
    const v=last(z.id,per), c=cur(z.id);
    const verbrauch=(v&&c&&c.stand!=null)? Math.round((c.stand-v.stand)*(z.faktor||1)) : "";
    lines.push([h.name,h.unit,z.nummer,z.bezeichnung,z.medium,z.art,zStandort(z),z.faktor,
      v?v.stand:"", v?v.datum:"", (c&&c.stand!=null)?c.stand:"", c?c.datum:"", c?c.status:"offen",
      verbrauch, zEinheit(z), c?c.ableser:"", c?c.quelle:"", c?c.note:""].map(zCsvCell).join(";"));
  });
  zDownload(`Zaehlerstaende_${per}${scope==="all"?"_alle_Objekte":""}.csv`, lines.join("\r\n"));
  toast("CSV erstellt – Trennzeichen Semikolon, für Excel vorbereitet.");
}

/* ---------- Objektübergreifende Ableseliste ---------- */
async function openAblesung(){
  if(!canArea("objekte")) return goHome();
  S.view="ablesung";
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Zählerablesung</div>
    <div class="page-head"><div><h2>Zählerablesung</h2><div class="lead">Lade Daten…</div></div></div>`;
  S._zAll=await DB.allZaehler();
  S._aAll=(await DB.allAblesungen()).concat(offAll());
  S.zFilter=S.zFilter||"offen";
  netRefresh();
  renderAblesung();
}
function renderAblesung(){
  const per=abPeriode();
  const houses={}; (S.houses||[]).forEach(h=>houses[h.id]=h);
  const abs=S._aAll||[];
  const curOf=zid=>abs.filter(a=>a.zaehlerId===zid&&(a.datum||"").slice(0,4)===per)
    .sort((a,b)=>(b.datum||"").localeCompare(a.datum||""))[0]||null;
  const all=(S._zAll||[]).filter(z=>houses[z.houseId]).map(z=>({z, h:houses[z.houseId], c:curOf(z.id), e:eichStatus(z)}));
  const offen=all.filter(x=>!x.c);
  const problem=all.filter(x=>x.c&&x.c.status!=="abgelesen");
  const fertig=all.filter(x=>x.c&&x.c.status==="abgelesen");
  const eichAlarm=all.filter(x=>x.e.level==="overdue"||x.e.level==="soon");
  const f=S.zFilter||"offen";
  let rows = f==="offen"?offen : f==="problem"?problem : f==="fertig"?fertig : f==="eich"?eichAlarm : all;
  rows=rows.slice().sort((a,b)=>(a.h.name||"").localeCompare(b.h.name||"")||(a.z.bezeichnung||"").localeCompare(b.z.bezeichnung||""));
  const jahre=[...new Set(abs.map(a=>(a.datum||"").slice(0,4)).filter(Boolean))].sort().reverse();
  if(jahre.indexOf(String(new Date().getFullYear()))<0) jahre.unshift(String(new Date().getFullYear()));
  const tabBtn=(k,label,n)=>`<button class="tab ${f===k?'on':''}" onclick="S.zFilter='${k}';renderAblesung()">${label} <span class="tabn">${n}</span></button>`;
  const body = rows.length ? rows.map(x=>{
    const z=x.z, ort=zStandort(z);
    const chip = !x.c ? `<span class="chip mid">noch offen</span>`
      : x.c.status==="abgelesen" ? `<span class="chip good">${zNum(x.c.stand)} ${esc(zEinheit(z))} · ${esc(fmtShort(x.c.datum))}</span>`
      : `<span class="chip bad">${esc(x.c.status)} · ${esc(fmtShort(x.c.datum))}</span>`;
    const eichChip = x.e.level==="overdue"?`<span class="chip bad">Eichfrist abgelaufen</span>`
      : x.e.level==="soon"?`<span class="chip mid">Eichfrist läuft aus</span>`
      : x.e.level==="none"?`<span class="chip na">Eichfrist offen</span>`:"";
    return `<div class="def card" style="border-left-color:var(--${!x.c?"mid":x.c.status==="abgelesen"?"good":"bad"})">
      <div class="body">
        <div class="area">${zMediumIcon(z.medium)} ${esc(z.bezeichnung||z.nummer||"(ohne Bezeichnung)")} ${chip} ${(x.c&&x.c.pending)?`<span class="chip warte">wartet auf Übertragung</span>`:""} ${eichChip}
          ${z.fernauslesbar?`<span class="chip good">fernauslesbar</span>`:""}</div>
        <div class="kv"><b>Objekt:</b> ${esc(x.h.name)}${x.h.unit?` (WE ${esc(x.h.unit.replace(/^WE\s*/i,''))})`:""} &nbsp;·&nbsp; <b>Nr.:</b> ${esc(z.nummer||"–")}</div>
        <div class="kv"><b>Standort:</b> ${ort?esc(ort):`<span style="color:var(--bad)">nicht erfasst</span>`}</div>

/* ---------- QR-Etiketten für den Zählerplatz ---------- */
function zAppUrl(zid){ return location.origin + location.pathname + "#z=" + zid; }
function zQrSvg(text){
  try{
    if(typeof qrcode!=="function") return "";
    const q=qrcode(0,"M"); q.addData(text); q.make();
    return q.createSvgTag({cellSize:2, margin:2, scalable:true});
  }catch(e){ console.error(e); return ""; }
}
function openEtiketten(){ S.view="etiketten"; renderEtiketten(); }

        <b>Anbringen:</b> neben den Zähler, <b>nicht auf</b> Zählwerk, Typenschild oder Plombe. Bei Zählerschränken auf die Innenseite der Tür oder den Rahmen.<br>
        <b>Notfallweg:</b> Die Kennung unter dem Code lässt sich abtippen, falls der Code einmal unlesbar wird.

/* ===================== Offline-Betrieb =====================
   Im Keller gibt es keinen Empfang. Ablesungen werden deshalb
   lokal im Gerät zwischengespeichert und übertragen, sobald
   wieder Netz da ist – automatisch oder per Knopfdruck.
   =========================================================== */
const OFF_KEY="om_offline_ablesungen";
function offQueue(){
  try{ const r=localStorage.getItem(OFF_KEY); const a=r?JSON.parse(r):[]; return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function offWrite(list){
  try{ localStorage.setItem(OFF_KEY, JSON.stringify(list)); }catch(e){ console.error(e); }
  netRefresh();
}
function offPush(a){ const q=offQueue(); q.push(Object.assign({},a,{pending:true})); offWrite(q); }
function offFor(houseId){ return offQueue().filter(a=>a.houseId===houseId).map(a=>Object.assign({},a,{pending:true})); }
function offAll(){ return offQueue().map(a=>Object.assign({},a,{pending:true})); }
function offCount(){ return offQueue().length; }
function istOnline(){ return navigator.onLine!==false; }

function netRefresh(){
  const el=document.getElementById("netInd"); if(!el) return;
  const n=offCount(), on=istOnline();
  el.style.display = (!on || n>0) ? "inline-flex" : "none";
  el.className = "net-ind" + (!on ? " off" : (n>0 ? " warte" : ""));
  el.innerHTML = `<span class="d"></span>${!on?"Offline":"Online"}${n>0?` · ${n} wartet`:""}`;
  el.title = !on
    ? "Keine Verbindung – Ablesungen werden im Gerät gespeichert und später übertragen."
    : (n>0 ? "Es liegen noch nicht übertragene Ablesungen vor." : "Verbunden");
}

async function offSync(still){
  const q=offQueue();
  if(!q.length){ if(!still) toast("Es wartet nichts auf Übertragung."); return 0; }
  if(!istOnline()){ if(!still) toast("Keine Verbindung – Übertragung später erneut versuchen."); return 0; }
  let ok=0; const rest=[];
  for(const a of q){
    try{ const {pending, ...rein}=a; await DB.saveAblesung(rein); ok++; }
    catch(e){ console.error(e); rest.push(a); }
  }
  offWrite(rest);
  if(ok && !still) toast(ok===1?"1 Ablesung übertragen.":`${ok} Ablesungen übertragen.`);
  if(S.houseId && S.view==="house"){ await openHouse(S.houseId); }
  else if(S.view==="ablesung"){ await openAblesung(); }
  else netRefresh();
  return ok;
}

function offPanel(){
  const q=offQueue(), on=istOnline();
  const zAll=(S._zAll&&S._zAll.length)?S._zAll:(S.zaehler||[]);
  const nam=id=>{ const z=zAll.find(x=>x.id===id); return z? (z.bezeichnung||z.nummer||id) : id; };
  const liste = q.length
    ? `<div style="max-height:260px;overflow:auto;margin-top:6px">`+q.map(a=>`<div class="col-row" style="align-items:flex-start">
        <div style="flex:1">
          <div style="font-weight:600;font-size:13px">${esc(nam(a.zaehlerId))}</div>
          <div style="font-size:12px;color:var(--muted)">${esc(fmtShort(a.datum))} · ${a.status==="abgelesen"?esc(zNum(a.stand)):esc(a.status)}${a.ableser?` · ${esc(a.ableser)}`:""}</div>
        </div></div>`).join("")+`</div>`
    : `<p class="m">Alles übertragen – es wartet nichts.</p>`;
  modal(`<h3>Verbindung &amp; Übertragung</h3>
    <div class="hint">${on?I.check:I.info}<div>
      <b>${on?"Verbunden":"Keine Verbindung"}.</b> ${on
        ? "Neue Ablesungen werden direkt übertragen."
        : "Ablesungen werden im Gerät gespeichert und automatisch übertragen, sobald wieder Netz da ist. Du kannst währenddessen normal weiterarbeiten."}
      <br>Die App selbst läuft auch ohne Netz – sie wurde beim ersten Aufruf im Gerät abgelegt.
    </div></div>
    <div class="field"><label>Wartet auf Übertragung: ${q.length}</label>${liste}</div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Schließen</button>
      ${q.length?`<button class="btn danger" onclick="offVerwerfen()">Verwerfen</button>`:""}
      ${q.length?`<button class="btn primary" onclick="closeModal();offSync()">${I.upload} Jetzt übertragen</button>`:""}
    </div>`);
}
function offVerwerfen(){
  confirmModal("Wartende Ablesungen verwerfen?","Die noch nicht übertragenen Ablesungen werden aus dem Gerät gelöscht. Das lässt sich nicht rückgängig machen.",async()=>{
    offWrite([]);
    if(S.houseId && S.view==="house") await openHouse(S.houseId);
    else if(S.view==="ablesung") await openAblesung();
    toast("Warteschlange geleert.");
  });
}

/* Service Worker: legt die App im Gerät ab, damit sie ohne Netz startet */
function offRegisterSW(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol!=="https:" && location.hostname!=="localhost" && location.hostname!=="127.0.0.1") return;
  navigator.serviceWorker.register("sw.js").catch(e=>console.warn("Offline-Modus nicht verfügbar:", e&&e.message));
  let ersterWechsel=true;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(ersterWechsel){ ersterWechsel=false; return; }
    toast("Neue Version geladen – bitte Seite neu laden.");
  });
}
window.addEventListener("online", ()=>{ netRefresh(); toast("Verbindung wieder da – übertrage…"); offSync(true).then(n=>{ if(n) toast(n===1?"1 Ablesung übertragen.":`${n} Ablesungen übertragen.`); }); });
window.addEventListener("offline", ()=>{ netRefresh(); toast("Keine Verbindung – Ablesungen werden im Gerät gespeichert."); });

/* ===================== Objekt-Tagebuch =====================
   Ein Zeitstrahl je Haus, in den alle Module einlaufen. Antwortet
   auf die Frage, die sonst zwanzig Minuten Suche kostet:
   was ist an diesem Objekt in den letzten Jahren passiert?
   ============================================================ */
const TB_ARTEN=[
  ["begehung","Begehungen",  I.book,   "var(--navy)",  "var(--navy-soft)"],
  ["wartung", "Wartung",     I.wrench, "var(--good)",  "var(--good-bg)"],
  ["zaehler", "Ablesungen",  I.grid,   "var(--navy)",  "var(--bg2)"],
  ["ticket",  "Tickets",     I.ticket, "var(--mid)",   "var(--mid-bg)"],
  ["sanierung","Sanierungen",I.hammer, "var(--navy)",  "var(--navy-soft)"],
  ["schreiben","Schreiben",  I.mail,   "var(--muted)", "var(--bg2)"],
  ["dokument","Dokumente",   I.file,   "var(--muted)", "var(--bg2)"]
];
function tbMeta(art){ return TB_ARTEN.find(x=>x[0]===art)||TB_ARTEN[0]; }

async function openTagebuch(){
  S.houseTab="tagebuch";
  const o=(S.houses||[]).find(x=>x.id===S.houseId);
  if(!o) return goHome();
  S._tbLade=true; renderHouse();
  const ein=[];
  const add=(datum,art,h,s,aktion)=>{ if(datum) ein.push({datum,art,h,s,aktion:aktion||""}); };

  try{
    // Begehungen
    (S.hidx||[]).forEach(it=>{
      const c=it.counts||{}; const teile=[];
      if(c.mangelhaft) teile.push(c.mangelhaft+" Mangel");
      if(c.mittel) teile.push(c.mittel+" mittel");
      if(c.gut) teile.push(c.gut+" gut");
      add(it.date,"begehung","Objektbegehung",
        (it.inspector||"ohne Begeher")+(teile.length?" · "+teile.join(", "):"")+(it.finalized?" · abgeschlossen":""),
        `editInspection('${it.id}',true)`);
    });

    // Wartungen aus der Historie
    for(const a of (S.anlagen||[])){
      const log=await DB.listWartungLog(a.id);
      log.forEach(w=>add(w.date,"wartung",a.name+" durchgeführt",
        [w.firm,w.note].filter(Boolean).join(" · ")||"—"));
    }

    // Ablesungen
    const zn={}; (S.zaehler||[]).forEach(z=>zn[z.id]=z);
    (S.ablesungen||[]).forEach(a=>{
      const z=zn[a.zaehlerId]; if(!z) return;
      add(a.datum,"zaehler",
        (z.bezeichnung||z.nummer)+": "+(a.status==="abgelesen"?zNum(a.stand)+" "+zEinheit(z):a.status),
        [a.ableser,a.quelle,a.pending?"wartet auf Übertragung":""].filter(Boolean).join(" · "),
        `openZHist('${z.id}')`);
    });

    // Sanierungen
    const san=(await DB.listSanierungen()).filter(s=>s.houseId===S.houseId);
    san.forEach(s=>{
      add(s.start,"sanierung","Sanierung begonnen: "+s.title,[s.wohnung,s.firm].filter(Boolean).join(" · "));
      if(s.end) add(s.end,"sanierung","Sanierung abgeschlossen: "+s.title,
        [s.wohnung,s.firm,(s.cost!==""&&s.cost!=null)?Number(s.cost).toLocaleString("de-DE")+" €":""].filter(Boolean).join(" · "));
    });

    // Tickets
    const tk=(await DB.listTickets()).filter(t=>t.houseId===S.houseId);
    tk.forEach(t=>{
      add(t.createdDate,"ticket","Ticket angelegt: "+t.title,
        [bezugLbl(t.bezug)+" "+tkRef(t), t.prio?"Prio "+t.prio:"", t.status].filter(Boolean).join(" · "));
      if(t.sentDate) add(t.sentDate,"schreiben","Ticket versandt: "+t.title,[t.firm,t.sentTo].filter(Boolean).join(" · "));
    });

    // Versandte Schreiben aus der Meldungs-Überwachung
    const ml=(await DB.listMeldungenLog()).filter(m=>m.houseId===S.houseId);
    ml.forEach(m=>add(m.sentDate,"schreiben",m.subject||"Schreiben versandt",
      [m.recipient,m.dueDate?"Frist "+fmtShort(m.dueDate):"",m.status].filter(Boolean).join(" · ")));

    // Dokumente
    const dok=await DB.listDocuments(S.houseId);
    dok.forEach(d=>add((d.createdAt||"").slice(0,10),"dokument","Dokument abgelegt: "+d.name,
      [d.category,d.unit,d.note].filter(Boolean).join(" · "),`openDokumente()`));
  }catch(e){ console.error(e); }

  ein.sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));
  S._tb=ein; S._tbLade=false; S.tbArt=S.tbArt||"";
  renderHouse();
}

function houseTagebuchHTML(){
  if(S._tbLade) return `<div class="empty card" style="border-style:dashed">${I.clock}<h3>Tagebuch wird zusammengestellt…</h3><p>Alle Module werden durchgesehen.</p></div>`;
  const alle=S._tb||[];
  if(!alle.length){
    return `<div class="empty card" style="border-style:dashed">${I.book}<h3>Noch keine Einträge</h3>
      <p>Sobald Begehungen, Wartungen, Ablesungen, Tickets oder Schreiben erfasst sind, erscheinen sie hier als Verlauf.</p></div>`;

    html+=`<div class="tb-e">
      <div class="tb-d">${esc(fmtShort(e.datum))}</div>
      <div class="tb-i" style="background:${bg};color:${farbe}">${ic}</div>
      <div class="tb-t">
        <div class="h">${esc(e.h)}</div>
        ${e.s?`<div class="s">${esc(e.s)}</div>`:""}
        ${e.aktion?`<div class="a"><button class="btn sm" onclick="${e.aktion}">Öffnen</button></div>`:""}

}

async function zOpenDeepLink(zid){
  try{
    if(!canArea("objekte")) return;
    const all=await DB.allZaehler();
    const z=all.find(x=>x.id===zid);
    if(!z){ toast("Zu diesem Code ist kein Zähler hinterlegt."); return; }
    if(!S.houses||!S.houses.length) S.houses=await DB.listHouses();
    S.houseTab="zaehler";
    await openHouse(z.houseId);
    setTimeout(()=>{ ableseModal(zid); },250);
  }catch(e){ console.error(e); }
}
function zCheckHash(){
  const m=(location.hash||"").match(/^#z=([A-Za-z0-9_-]+)$/);
  if(!m) return false;
  history.replaceState(null,"",location.pathname+location.search);
  zOpenDeepLink(m[1]);
  return true;
}
window.addEventListener("hashchange",zCheckHash);

async function doUploadDocs(){
  const inp=document.getElementById("docFiles"); const files=[...(inp.files||[])];
  if(!files.length){ toast("Bitte mindestens eine Datei wählen."); return; }
  const o=S.houses.find(x=>x.id===S.houseId); if(!o) return;
  const cat=document.getElementById("docCat").value; const unit=document.getElementById("docUnit").value.trim();
  const btn=document.getElementById("docUpBtn"); btn.disabled=true;
  const msg=document.getElementById("docUpMsg"); msg.style.display="block";
  let ok=0;
  for(const f of files){
    msg.textContent=`Lade hoch: ${f.name} …`;
    try{
      const path=await uploadDoc(o.id, f);
      const doc={ id:uid(), houseId:o.id, unit, category:cat, name:f.name, path, mime:f.type||"", size:f.size||0, createdBy:S.userEmail||"", createdAt:new Date().toISOString() };

function inspDefCols(ins){
  const condCol=(ins.columns||[]).find(c=>c.type==="condition");
  const textCols=(ins.columns||[]).filter(c=>c.type!=="area"&&c.type!=="condition");
  const prioCol=(ins.columns||[]).find(c=>c.type==="select"&&/prio/i.test(c.label));
  return {condCol,textCols,prioCol};
}
function extractDefects(ins){
  if(!ins) return [];
  const {condCol,textCols,prioCol}=inspDefCols(ins); if(!condCol) return [];
  const out=[];
  (ins.rows||[]).forEach(r=>{ const cond=r.cells[condCol.id]; if(cond!=="mangelhaft"&&cond!=="mittel") return;
    const fields=textCols.filter(c=>c!==prioCol).map(c=>({label:c.label,val:r.cells[c.id]})).filter(f=>f.val);
    out.push({area:r.cells.area||"(ohne Bezeichnung)",fields,cond,prio:prioCol?(r.cells[prioCol.id]||""):""}); });
  return out;
}
function defectCount(ins){
  const {condCol}=inspDefCols(ins); if(!condCol) return {bad:0,mid:0};
  let bad=0,mid=0; (ins.rows||[]).forEach(r=>{ const c=r.cells[condCol.id]; if(c==="mangelhaft")bad++; else if(c==="mittel")mid++; });
  return {bad,mid};
}
