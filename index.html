        <div style="font-size:12.5px;color:var(--muted)">Turnus: ${esc(t.turnus||"–")}${t.dl?` · ${esc(t.dl)}`:""}</div></div>
        <button class="icon-btn" onclick="addCleanTask('${t.id}')">${I.edit}</button>
        <button class="icon-btn" onclick="delCleanTask('${t.id}')">${I.trash}</button>
      </div>`).join("")+`</div>`
    : `<div class="hint">${I.info}<div>Noch keine Reinigungs­aufgaben definiert. Lege Aufgaben mit ihrem Turnus an (z. B. Treppenhausreinigung – wöchentlich).</div></div>`;

  // Objekt-Standort-Leiste
  const locBar = hasLoc
    ? `<div class="hint" style="background:var(--good-bg)">${I.mapPin}<div>Objekt-Standort hinterlegt – Anwesenheit wird beim Ein-/Ausstempeln mit dem Objekt abgeglichen. <a href="${mapsLink(o.lat,o.lng)}" target="_blank" style="color:var(--navy);font-weight:600">Karte</a>${canArea("objekte")?` · <a onclick="setObjLocation()" style="color:var(--navy);font-weight:600;cursor:pointer">ändern</a>`:""}</div></div>`
    : `<div class="hint" style="background:var(--mid-bg)">${I.mapPin}<div>Für dieses Objekt ist noch <b>kein Standort hinterlegt</b> – der Abgleich „am Objekt?" ist daher nicht möglich.${canArea("objekte")?` <a onclick="setObjLocation()" style="color:var(--navy);font-weight:600;cursor:pointer">Standort jetzt festlegen</a>`:" Bitte von der Verwaltung hinterlegen lassen."}</div></div>`;

  const nw = S.nachweise||[];
  const laufend = nw.find(n=>n.status==="laufend");
  const clockCard = laufend
    ? `<div class="card" style="padding:16px 18px;margin-bottom:18px;border-left:4px solid var(--mid)">
        <div style="font-family:'Plus Jakarta Sans';font-size:17px;font-weight:600">Reinigung läuft</div>
        <div class="kv" style="margin-top:4px">Eingestempelt um <b>${fmtClock(laufend.startAt)} Uhr</b> ${geoBadge(laufend.distStart)}</div>
        <div style="margin-top:11px"><button class="btn primary" onclick="clockOut('${laufend.id}')">${I.mapPin} Ausstempeln &amp; abzeichnen</button></div>
      </div>`
    : `<div class="card" style="padding:16px 18px;margin-bottom:18px">
        <div style="font-family:'Plus Jakarta Sans';font-size:17px;font-weight:600">Vor Ort erfassen</div>
        <div class="kv" style="margin-top:4px;color:var(--muted)">Beim Eintreffen einstempeln, nach Abschluss ausstempeln – mit Zeit, Standort und Dauer.</div>
        <div style="margin-top:11px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="clockIn()">${I.mapPin} Vor Ort einstempeln</button>
        <button class="btn" onclick="abzeichnen()">${I.done} Ohne Standort abzeichnen</button></div>
      </div>`;

  const nwHTML = nw.length? nw.map(n=>{
      if(n.status==="laufend") return "";
      const clock = n.startAt? `<div class="kv" style="margin-top:5px"><b>Vor Ort:</b> ${fmtClock(n.startAt)}–${fmtClock(n.endAt)} Uhr${durTxt(n.startAt,n.endAt)?` · Dauer ${durTxt(n.startAt,n.endAt)}`:""}</div>
        <div class="kv" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span style="font-size:12px;color:var(--muted)">Start:</span> ${geoBadge(n.distStart)} <span style="font-size:12px;color:var(--muted)">Ende:</span> ${geoBadge(n.distEnd)}${n.startLat!=null?` <a href="${mapsLink(n.startLat,n.startLng)}" target="_blank" style="font-size:12px;color:var(--navy);font-weight:600">Karte</a>`:""}</div>` : "";
      const warn = (n.distStart!=null&&n.distStart>GEO_WARN_M)||(n.distEnd!=null&&n.distEnd>GEO_WARN_M);
      return `<div class="def card ${warn?"":""}" style="border-left-color:var(--${warn?"bad":n.startAt?"good":"na"})">
        <div class="body">
          <div class="area" style="font-size:15px">${esc(fmtShort(n.date))} <span class="chip good">${(n.done||[]).length} erledigt</span>${n.startAt?(warn?`<span class="chip bad">Standort prüfen</span>`:`<span class="chip good">am Objekt bestätigt</span>`):`<span class="chip na">ohne Standort</span>`}</div>
          <div class="kv">${esc(n.dl||"ohne Dienstleister")}${n.person?" · "+esc(n.person):""}</div>
          ${clock}
          ${n.createdBy?`<div class="kv" style="color:var(--faint);font-size:12px">erfasst über Konto ${esc(n.createdBy)}</div>`:""}
          ${(n.done||[]).length?`<div class="kv" style="color:var(--muted)">${esc((n.done||[]).join(", "))}</div>`:""}
          ${n.note?`<div class="kv" style="color:var(--muted)">${esc(n.note)}</div>`:""}
          <div style="margin-top:9px"><button class="btn sm danger" onclick="delNachweis('${n.id}')">${I.trash}</button></div>
        </div></div>`;
    }).join("")
    : `<div class="empty card" style="border-style:dashed;padding:34px">${I.clip}<h3 style="font-size:18px">Noch keine Abzeichnung</h3><p>Stemple vor Ort ein/aus oder zeichne einen Turnus ab – das erzeugt den Tätigkeitsnachweis.</p></div>`;

  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span><a onclick="openReinigung()">Hausdienstleister</a><span class="sep">/</span>${esc(o.name)}</div>
    <div class="page-head">
      <div><h2>${esc(o.name)}</h2><div class="lead">Reinigungsplan, Vor-Ort-Erfassung &amp; Tätigkeitsnachweise</div></div>
      <div class="toolbar">${nw.filter(n=>n.status!=="laufend").length?`<button class="btn" onclick="exportReinigungPDF()">${I.pdf} Nachweis-PDF</button>`:""}</div>
    </div>
    ${locBar}
    ${clockCard}
    <h3 style="font-size:18px;margin:4px 0 12px">Reinigungsplan</h3>
    ${planHTML}
    <div class="addbar"><button class="btn" onclick="addCleanTask('')">${I.plus} Aufgabe hinzufügen</button></div>
    <h3 style="font-size:18px;margin:22px 0 12px">Abzeichnungen / Nachweise</h3>
    ${nwHTML}`;
}

/* ---- Objekt-Standort festlegen ---- */
function setObjLocation(){
  if(!canArea("objekte")) return;
  const o=S.houses.find(x=>x.id===S.cleanHouseId);
  modal(`<h3>Objekt-Standort festlegen</h3>
    <p class="m">Der Standort dient zum Abgleich „am Objekt?" beim Ein-/Ausstempeln. Entweder direkt am Objekt per GPS erfassen oder Koordinaten manuell eintragen (z. B. aus Google Maps).</p>
    <button class="btn primary" style="width:100%;justify-content:center;margin-bottom:12px" onclick="saveObjLocGps()">${I.mapPin} Aktuellen Standort verwenden (ich bin am Objekt)</button>
    <div class="field" style="margin-bottom:8px"><label>oder Breitengrad (lat)</label><input id="olLat" type="number" step="0.0000001" value="${o&&o.lat!=null?o.lat:""}"></div>
    <div class="field" style="margin-bottom:8px"><label>Längengrad (lng)</label><input id="olLng" type="number" step="0.0000001" value="${o&&o.lng!=null?o.lng:""}"></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Abbrechen</button>
    <button class="btn primary" onclick="saveObjLocManual()">Speichern</button></div>`);
}
async function saveObjLocGps(){
  const ov=geoOverlay("Standort wird ermittelt…");
  try{
    const p=await getPosition(); ov.remove();
    await applyObjLoc(p.lat,p.lng);
  }catch(e){ ov.remove(); showError("Standort konnte nicht ermittelt werden", e.message||e); }
}
async function saveObjLocManual(){
  const lat=parseFloat(document.getElementById("olLat").value), lng=parseFloat(document.getElementById("olLng").value);
  if(isNaN(lat)||isNaN(lng)){ toast("Bitte gültige Koordinaten eingeben."); return; }
  await applyObjLoc(lat,lng);
}
async function applyObjLoc(lat,lng){
  try{ await DB.saveHouseLocation(S.cleanHouseId, lat, lng); }catch(e){ showError("Standort konnte nicht gespeichert werden", e); return; }
  const o=S.houses.find(x=>x.id===S.cleanHouseId); if(o){ o.lat=lat; o.lng=lng; }
  closeModal(); renderReinigungObjekt(); toast("Objekt-Standort gespeichert.");
}

/* ---- Ein-/Ausstempeln ---- */
async function clockIn(){
  if((S.nachweise||[]).some(n=>n.status==="laufend")){ toast("Es läuft bereits eine Erfassung."); return; }
  const o=S.houses.find(x=>x.id===S.cleanHouseId);
  const ov=geoOverlay("Einstempeln – Standort wird ermittelt…");
  try{
    const p=await getPosition(); ov.remove();
    const dist = (o&&o.lat!=null)? haversine(o.lat,o.lng,p.lat,p.lng) : null;
    const n={ id:uid(), houseId:S.cleanHouseId, date:todayISO(), status:"laufend", done:[], dl:"", person:"", note:"", createdBy:S.userEmail||"",
      startAt:new Date().toISOString(), startLat:p.lat, startLng:p.lng, startAcc:Math.round(p.acc), distStart:dist };
    await DB.saveNachweis(n);
    (S.nachweise=S.nachweise||[]).unshift(n);
    renderReinigungObjekt();
    toast(dist!=null && dist>GEO_WARN_M ? `Eingestempelt – Achtung: ${dist} m vom Objekt entfernt.` : "Eingestempelt.");
  }catch(e){ ov.remove(); showError("Einstempeln nicht möglich", e.message||e); }
}
async function clockOut(id){
  const o=S.houses.find(x=>x.id===S.cleanHouseId);
  const ov=geoOverlay("Ausstempeln – Standort wird ermittelt…");
  try{
    const p=await getPosition(); ov.remove();
    const dist = (o&&o.lat!=null)? haversine(o.lat,o.lng,p.lat,p.lng) : null;
    S._clockEnd={ id, endAt:new Date().toISOString(), endLat:p.lat, endLng:p.lng, endAcc:Math.round(p.acc), distEnd:dist };
    abzeichnen();
  }catch(e){ ov.remove(); showError("Ausstempeln nicht möglich", e.message||e); }
}

/* ---- Dienstleister-Verzeichnis ---- */
function manageDienstleister(){
  const list=(S.dienstleister||[]);
  const rows=list.length? list.map(d=>`<div class="col-row">
      <div style="flex:1"><div style="font-weight:600;font-size:13.5px">${esc(d.name)}</div>
      <div style="font-size:12px;color:var(--muted)">${esc(d.gewerk||"")}${d.contact?" · "+esc(d.contact):""}</div></div>
      <button class="btn sm" onclick="mailDienstleister('${d.id}')">${I.mail} Anschreiben</button>
      <button class="icon-btn" onclick="delDienstleister('${d.id}')">${I.trash}</button></div>`).join("")
    : `<p class="m" style="margin:0 0 8px">Noch keine Dienstleister erfasst.</p>`;
  modal(`<h3>Dienstleister verwalten</h3><p class="m">Firmen, die in den Nachweisen ausgewählt werden können (Reinigung, Winterdienst, Gartenpflege …).</p>
    <div class="col-list">${rows}</div>
    <div class="field" style="margin-bottom:8px"><label>Neuer Dienstleister</label><input id="dlName" placeholder="Firma"></div>
    <div class="field" style="margin-bottom:8px"><input id="dlGewerk" placeholder="Gewerk (z. B. Reinigung)"></div>
    <div class="field" style="margin-bottom:8px"><input id="dlContact" placeholder="Kontakt (Tel./E-Mail, optional)"></div>
    <div class="modal-actions"><button class="btn" onclick="addDienstleister()">${I.plus} Hinzufügen</button>
    <button class="btn primary" onclick="closeModal();if(S.view==='reinigung')openReinigung()">Fertig</button></div>`);
}
async function addDienstleister(){
  const name=document.getElementById("dlName").value.trim();
  if(!name){ toast("Bitte einen Namen eingeben."); return; }
  const d={id:uid(),name,gewerk:document.getElementById("dlGewerk").value.trim(),contact:document.getElementById("dlContact").value.trim(),note:""};
  try{ await DB.saveDienstleister(d); }catch(e){ showError("Dienstleister konnte nicht gespeichert werden", e); return; }
  (S.dienstleister=S.dienstleister||[]).push(d); S.dienstleister.sort((a,b)=>(a.name||"").localeCompare(b.name||"","de"));
  manageDienstleister();
}
function delDienstleister(id){
  S.dienstleister=(S.dienstleister||[]).filter(x=>x.id!==id);
  DB.deleteDienstleister(id); manageDienstleister();
}
function dlOptions(sel){ return `<option value="">– keiner –</option>`+(S.dienstleister||[]).map(d=>`<option ${sel===d.name?"selected":""}>${esc(d.name)}</option>`).join(""); }

/* ---- Reinigungsplan-Aufgaben ---- */
function addCleanTask(taskId){
  const t = taskId? ((S.plan.tasks||[]).find(x=>x.id===taskId)) : null;
  modal(`<h3>${t?"Aufgabe bearbeiten":"Aufgabe hinzufügen"}</h3>
    <div class="field"><label>Tätigkeit</label><input id="ctName" placeholder="z. B. Treppenhausreinigung" value="${t?esc(t.name):""}"></div>
    <div class="field"><label>Turnus</label><select id="ctTurnus">${TURNUS.map(x=>`<option ${t&&t.turnus===x?"selected":""}>${x}</option>`).join("")}</select></div>
    <div class="field"><label>Dienstleister (optional)</label><select id="ctDl">${dlOptions(t?t.dl:"")}</select></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Abbrechen</button>
    <button class="btn primary" onclick="saveCleanTask('${t?t.id:""}')">${t?"Speichern":"Hinzufügen"}</button></div>`);
  setTimeout(()=>document.getElementById("ctName")?.focus(),50);
}
async function saveCleanTask(taskId){
  const name=document.getElementById("ctName").value.trim();
  if(!name){ toast("Bitte eine Tätigkeit eingeben."); return; }
  const turnus=document.getElementById("ctTurnus").value;
  const dl=document.getElementById("ctDl").value;
  S.plan.tasks=S.plan.tasks||[];
  if(taskId){ const t=S.plan.tasks.find(x=>x.id===taskId); if(t){ t.name=name; t.turnus=turnus; t.dl=dl; } }
  else S.plan.tasks.push({id:uid(),name,turnus,dl});
  try{ await DB.savePlan(S.cleanHouseId, S.plan.tasks); }catch(e){ showError("Plan konnte nicht gespeichert werden", e); return; }
  closeModal(); renderReinigungObjekt();
}
function delCleanTask(taskId){
  confirmModal("Aufgabe entfernen?","Die Aufgabe wird aus dem Reinigungsplan entfernt.",async()=>{
    S.plan.tasks=(S.plan.tasks||[]).filter(x=>x.id!==taskId);
    await DB.savePlan(S.cleanHouseId, S.plan.tasks); renderReinigungObjekt();
  });
}

/* ---- Abzeichnung / Tätigkeitsnachweis ---- */
function abzeichnen(){
  const completing = S._clockEnd ? (S.nachweise||[]).find(n=>n.id===S._clockEnd.id) : null;
  const tasks=(S.plan&&S.plan.tasks)||[];
  const checks = tasks.length? tasks.map(t=>`<label style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)">
      <input type="checkbox" class="abzChk" data-name="${esc(t.name)}" checked style="width:18px;height:18px">
      <span style="flex:1">${esc(t.name)} <span style="color:var(--muted);font-size:12px">(${esc(t.turnus||"")})</span></span></label>`).join("")
    : `<p class="m">Es sind noch keine Aufgaben im Reinigungsplan. Du kannst trotzdem einen Nachweis mit Bemerkung erfassen.</p>`;
  const head = completing
    ? `<h3>Ausstempeln &amp; abzeichnen</h3><div class="hint" style="background:var(--good-bg)">${I.mapPin}<div>Vor Ort: <b>${fmtClock(completing.startAt)}–${fmtClock(S._clockEnd.endAt)} Uhr</b>${durTxt(completing.startAt,S._clockEnd.endAt)?` · Dauer ${durTxt(completing.startAt,S._clockEnd.endAt)}`:""}<br>Start ${geoBadge(completing.distStart)} · Ende ${geoBadge(S._clockEnd.distEnd)}</div></div>`
    : `<h3>Turnus abzeichnen</h3><p class="m">Bestätige die erledigten Reinigungsleistungen für diesen Termin.</p>`;
  const dateField = completing ? "" : `<div class="field" style="margin-bottom:10px"><label>Datum</label><input id="abzDate" type="date" value="${todayISO()}"></div>`;
  modal(`${head}
    ${dateField}
    <div class="field" style="margin-bottom:10px"><label>Dienstleister</label><select id="abzDl">${dlOptions("")}</select></div>
    <div class="field" style="margin-bottom:10px"><label>Erledigte Leistungen</label><div style="max-height:200px;overflow:auto">${checks}</div></div>
    <div class="field" style="margin-bottom:10px"><label>Abgezeichnet von</label><input id="abzPerson" placeholder="Name"></div>
    <div class="field" style="margin-bottom:6px"><label>Bemerkung (optional)</label><input id="abzNote" placeholder="z. B. Besonderheiten"></div>
    <div class="modal-actions"><button class="btn ghost" onclick="cancelAbz()">Abbrechen</button>
    <button class="btn primary" onclick="saveAbzeichnung()">${I.done} ${completing?"Ausstempeln":"Abzeichnen"}</button></div>`);
}
function cancelAbz(){ S._clockEnd=null; closeModal(); }
async function saveAbzeichnung(){
  const done=[...document.querySelectorAll(".abzChk")].filter(c=>c.checked).map(c=>c.dataset.name);
  const dl=document.getElementById("abzDl").value, person=document.getElementById("abzPerson").value.trim(), note=document.getElementById("abzNote").value.trim();
  if(S._clockEnd){
    const n=(S.nachweise||[]).find(x=>x.id===S._clockEnd.id);
    if(!n){ S._clockEnd=null; closeModal(); return; }
    Object.assign(n, { status:"fertig", done, dl, person, note,
      endAt:S._clockEnd.endAt, endLat:S._clockEnd.endLat, endLng:S._clockEnd.endLng, endAcc:S._clockEnd.endAcc, distEnd:S._clockEnd.distEnd });
    try{ await DB.saveNachweis(n); }catch(e){ showError("Nachweis konnte nicht gespeichert werden", e); return; }
    S._clockEnd=null; closeModal(); renderReinigungObjekt(); toast("Ausgestempelt – Nachweis gespeichert.");
    return;
  }
  const n={ id:uid(), houseId:S.cleanHouseId, date:document.getElementById("abzDate").value||todayISO(),
    status:"fertig", dl, done, note, person, createdBy:S.userEmail||"" };
  try{ await DB.saveNachweis(n); }catch(e){ showError("Nachweis konnte nicht gespeichert werden", e); return; }
  (S.nachweise=S.nachweise||[]).unshift(n);
  closeModal(); renderReinigungObjekt();
  toast("Nachweis gespeichert.");
}
function delNachweis(id){
  confirmModal("Nachweis löschen?","Dieser Tätigkeitsnachweis wird dauerhaft entfernt.",async()=>{
    await DB.deleteNachweis(id); S.nachweise=(S.nachweise||[]).filter(x=>x.id!==id); renderReinigungObjekt();
  });
}

async function exportReinigungPDF(){
  if(!window.jspdf){ toast("PDF-Bibliothek lädt noch."); return; }
  const o=S.houses.find(x=>x.id===S.cleanHouseId);
  const overlay=document.createElement("div"); overlay.className="pdf-overlay";
  overlay.innerHTML=`<div class="pdf-box"><div class="spin"></div><div style="font-weight:600">Nachweis wird erstellt…</div></div>`;
  document.body.appendChild(overlay);
  try{
    const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
    const PW=210,PH=297,M=15; let y=M;
    const navy=[32,42,68],muted=[110,106,96],line=[210,205,190];
    const footer=()=>{ const pg=doc.internal.getNumberOfPages(); doc.setFontSize(8); doc.setFont("helvetica","normal"); doc.setTextColor(...muted);
      doc.text((o.name||"Objekt")+" – Tätigkeitsnachweis Hausreinigung",M,PH-8); doc.text("Seite "+pg,PW-M,PH-8,{align:"right"}); };
    const ensure=h=>{ if(y+h>PH-15){ footer(); doc.addPage(); y=M; } };
    doc.setFillColor(...navy); doc.rect(0,0,PW,26,"F");
    doc.setTextColor(244,242,236); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("Tätigkeitsnachweis Hausreinigung",M,12);
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    doc.text(o.name+(o.unit?" · WE "+o.unit.replace(/^WE\s*/i,""):"")+(o.address?" · "+o.address:""),M,20);
    y=34;
    // Reinigungsplan
    const tasks=(S.plan&&S.plan.tasks)||[];
    doc.setTextColor(...navy); doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text("Reinigungsplan",M,y); y+=6;
    doc.setFontSize(9.5); doc.setTextColor(40,38,33);
    if(tasks.length){ tasks.forEach(t=>{ ensure(6); doc.setFont("helvetica","bold"); doc.text("• "+t.name,M,y);
      doc.setFont("helvetica","normal"); doc.setTextColor(...muted); doc.text(`Turnus: ${t.turnus||"–"}${t.dl?"  ·  "+t.dl:""}`,M+80,y); doc.setTextColor(40,38,33); y+=5.2; }); }
    else { doc.setTextColor(...muted); doc.text("kein Plan hinterlegt",M,y); doc.setTextColor(40,38,33); y+=5.2; }
    y+=3; doc.setDrawColor(...line); doc.line(M,y,PW-M,y); y+=7;
    // Nachweise
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(...navy); doc.text("Abzeichnungen",M,y); y+=6;
    (S.nachweise||[]).filter(n=>n.status!=="laufend").forEach(n=>{
      ensure(16);
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(40,38,33);
      doc.text(`${fmtShort(n.date)}`,M,y);
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...muted);
      doc.text(`${n.dl||"ohne Dienstleister"}${n.person?"  ·  abgez.: "+n.person:""}`,M+30,y); y+=5;
      if(n.startAt){
        doc.setFontSize(8.7);
        const warn=(n.distStart!=null&&n.distStart>GEO_WARN_M)||(n.distEnd!=null&&n.distEnd>GEO_WARN_M);
        doc.setTextColor(...(warn?[181,70,47]:[62,124,90]));
        const ds=n.distStart!=null?`${n.distStart} m`:"o. Standort", de=n.distEnd!=null?`${n.distEnd} m`:"o. Standort";
        doc.text(`Vor Ort: ${fmtClock(n.startAt)}–${fmtClock(n.endAt)} Uhr${durTxt(n.startAt,n.endAt)?" ("+durTxt(n.startAt,n.endAt)+")":""}  ·  Start ${ds} / Ende ${de} vom Objekt${warn?"  ·  ABGLEICH PRÜFEN":""}`,M,y);
        doc.setTextColor(40,38,33); y+=4.6;
      }
      doc.setFontSize(9); doc.setTextColor(40,38,33);
      const done=(n.done||[]).length? (n.done||[]).join(", ") : "—";
      const lines=doc.splitTextToSize("Erledigt: "+done,PW-2*M); doc.text(lines,M,y); y+=lines.length*4.4;
      if(n.note){ const nl=doc.splitTextToSize("Bemerkung: "+n.note,PW-2*M); doc.setTextColor(...muted); doc.text(nl,M,y); doc.setTextColor(40,38,33); y+=nl.length*4.4; }
      y+=2; doc.setDrawColor(...line); doc.line(M,y,PW-M,y); y+=5;
    });
    footer();
    doc.save(`Reinigungsnachweis_${(o.name||"Objekt").replace(/[^\w\säöüÄÖÜß-]/g,"").replace(/\s+/g,"_")}_${todayISO()}.pdf`);
    overlay.remove(); toast("Nachweis-PDF erstellt.");
  }catch(e){ console.error(e); overlay.remove(); showError("PDF-Export fehlgeschlagen", e); }
}

/* ===================== Aufzüge ===================== */
const MELD_STATUS=["offen","in Bearbeitung","behoben"];
function meldClass(s){ return s==="behoben"?"good":s==="in Bearbeitung"?"mid":"bad"; }
const liftWart = a => wartStatus({interval:a.interval, lastDate:a.lastDate});
const liftTuev = a => wartStatus({interval:a.tuevInterval, lastDate:a.tuevLast});

async function openAufzuege(){
  if(!canArea("aufzuege")) return goHome();
  S.view="aufzuege";
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Aufzüge</div>
    <div class="page-head"><div><h2>Aufzüge</h2><div class="lead">Lade Daten…</div></div></div>`;
  S.aufzuege=await DB.listAufzuege();
  const meta=await DB.allMeldungenMeta();
  const counts={}; meta.forEach(m=>{ const c=counts[m.aufzug_id]||(counts[m.aufzug_id]={total:0,open:0}); c.total++; if(m.status!=="behoben") c.open++; });
  S._meldCounts=counts;
  const byHouse={}; S.houses.forEach(h=>byHouse[h.id]=h);
  const wartOver=S.aufzuege.filter(a=>liftWart(a).level==="overdue").length;
  const tuevOver=S.aufzuege.filter(a=>liftTuev(a).level==="overdue").length;
  const openMeld=Object.values(counts).reduce((s,c)=>s+c.open,0);

  let body;
  if(!S.aufzuege.length){
    body=`<div class="empty card" style="border-style:dashed">${I.lift}<h3>Noch keine Aufzüge erfasst</h3>
      <p>Lege Aufzüge mit Wartungs- und Prüfintervall an und protokolliere Störungs- und Mängelmeldungen.</p>
      <div style="margin-top:18px"><button class="btn primary" onclick="addAufzug()">${I.plus} Aufzug hinzufügen</button></div></div>`;
  } else {
    const cards=S.aufzuege.slice().sort((a,b)=>{
      const da=Math.min(liftWart(a).days??1e9, liftTuev(a).days??1e9), db=Math.min(liftWart(b).days??1e9, liftTuev(b).days??1e9);
      return da-db;
    }).map(a=>{
      const w=liftWart(a), t=liftTuev(a), c=counts[a.id]||{total:0,open:0}; const h=byHouse[a.houseId];
      const chip=(lbl,s)=> s.level==="none"?`<span class="chip na">${lbl}: –</span>`:`<span class="chip ${wartClass(s.level)}">${lbl}: ${s.label}</span>`;
      return `<div class="def card" style="border-left-color:var(--${w.level==="overdue"||t.level==="overdue"?"bad":(w.level==="soon"||t.level==="soon")?"mid":"good"})" onclick="openAufzug('${a.id}')">
        <div class="body" style="cursor:pointer">
          <div class="area">${esc(a.name||"(ohne Bezeichnung)")} ${c.open?`<span class="chip bad">${c.open} offen</span>`:`<span class="chip good">keine offenen</span>`}</div>
          <div class="kv"><b>Objekt:</b> ${h?esc(h.name):"–"}${a.firm?` &nbsp;·&nbsp; <b>Firma:</b> ${esc(a.firm)}`:""}</div>
          <div class="kv">${chip("Wartung",w)} &nbsp; ${chip("TÜV",t)} &nbsp; <span style="color:var(--muted);font-size:12.5px">${c.total} Meldungen gesamt</span></div>
        </div></div>`;
    }).join("");
    body=`<div class="stat-row">
        <div class="stat bad"><div class="num">${openMeld}</div><div class="lbl">offene Meldungen</div></div>
        <div class="stat"><div class="num" style="color:${wartOver+tuevOver?'var(--bad)':'inherit'}">${wartOver+tuevOver}</div><div class="lbl">überfällig (Wartung/TÜV)</div></div>
        <div class="stat"><div class="num">${S.aufzuege.length}</div><div class="lbl">Aufzüge gesamt</div></div>
      </div>${cards}`;
  }
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Aufzüge</div>
    <div class="page-head">
      <div><h2>Aufzüge</h2><div class="lead">Wartung &amp; TÜV-Prüfung sowie protokollierte Störungs-/Mängelmeldungen je Aufzug.</div></div>
      <div class="toolbar">
        ${S.aufzuege.length?`<button class="btn" onclick="exportAuswertungPDF()">${I.pdf} Auswertung</button>`:""}
        <button class="btn primary" onclick="addAufzug()">${I.plus} Aufzug hinzufügen</button>
      </div>
    </div>
    ${body}`;
}

async function openAufzug(id){
  if(!canArea("aufzuege")) return goHome();
  S.aufzugId=id; S.view="aufzug";
  if(!S.aufzuege) S.aufzuege=await DB.listAufzuege();

}

    const chip = s.level==="none"?`<span class="chip na">kein Intervall</span>`
      : `<span class="chip ${wartClass(s.level)}">${s.label}${s.days!=null?` · ${s.days<0?Math.abs(s.days)+' T überfällig':'in '+s.days+' T'}`:""}</span>`;
    return `<div class="kv"><b>${lbl}:</b> ${chip} &nbsp; Intervall: ${iv?`alle ${iv} Mon.`:"–"} &nbsp;·&nbsp; letzte: ${last?esc(fmtShort(last)):"–"} &nbsp;·&nbsp; nächste: ${s.next?esc(fmtShort(s.next)):"–"}</div>`;
  };
  const meld=S.meldungen||[];

    <div class="def card ${m.status==="in Bearbeitung"?"mid":""}" style="border-left-color:var(--${meldClass(m.status)})">

        <div class="kv"><b>Gemeldet:</b> ${esc(fmtShort(m.date))}${m.reporter?` von ${esc(m.reporter)}`:""}${m.status==="behoben"&&m.resolvedDate?` &nbsp;·&nbsp; <b>behoben:</b> ${esc(fmtShort(m.resolvedDate))}`:""}</div>
        ${m.note?`<div class="kv" style="color:var(--muted)">${esc(m.note)}</div>`:""}
        <div class="seg" style="margin-top:9px">${MELD_STATUS.map(s=>`<button data-v="${s}" class="${m.status===s?'on':''}" onclick="setMeldStatus('${m.id}','${s}')">${s}</button>`).join("")}
          <button class="btn sm danger" style="margin-left:auto" onclick="delMeldung('${m.id}')">${I.trash}</button></div>
      </div></div>`).join("")
    : `<div class="empty card" style="border-style:dashed;padding:30px">${I.alert}<h3 style="font-size:17px">Keine Meldungen</h3><p>Erfasse Störungen oder Mängel – sie werden hier protokolliert und ausgewertet.</p></div>`;

  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span><a onclick="openAufzuege()">Aufzüge</a><span class="sep">/</span>${esc(a.name)}</div>
    <div class="page-head">
      <div><h2>${esc(a.name)}</h2><div class="lead">${h?esc(h.name):""}${a.fabriknr?` · Fabrik-Nr. ${esc(a.fabriknr)}`:""}${a.hersteller?` · ${esc(a.hersteller)}`:""}</div></div>
      <div class="toolbar">
        <button class="btn" onclick="exportAufzugPDF()">${I.pdf} PDF</button>
        <button class="btn" onclick="addAufzug('${a.id}')">${I.edit} Bearbeiten</button>
        <button class="btn" onclick="mailAufzug()">${I.mail} An Firma senden</button>
        <button class="btn primary" onclick="addMeldung()">${I.plus} Meldung erfassen</button>
      </div>
    </div>
    <div class="card" style="padding:15px 17px;margin-bottom:18px">
      ${dueLine("Wartung", w, a.interval, a.lastDate)}
      ${dueLine("TÜV-Prüfung", t, a.tuevInterval, a.tuevLast)}
      ${a.firm?`<div class="kv"><b>Wartungsfirma:</b> ${esc(a.firm)}</div>`:""}
      ${a.note?`<div class="kv" style="color:var(--muted)">${esc(a.note)}</div>`:""}
      <div style="display:flex;gap:7px;margin-top:11px;flex-wrap:wrap">
        <button class="btn sm" onclick="wartungDoneAufzug('${a.id}')">${I.done} Wartung heute</button>
        <button class="btn sm" onclick="tuevDoneAufzug('${a.id}')">${I.done} TÜV heute</button>
        <button class="btn sm danger" onclick="delAufzug('${a.id}')">${I.trash} Aufzug löschen</button>
      </div>
    </div>
    <h3 style="font-size:18px;margin:4px 0 12px">Störungs- &amp; Mängelmeldungen <span style="font-size:13px;color:var(--muted);font-family:'Inter'">(${open} offen / ${meld.length} gesamt)</span></h3>

    tuevInterval:parseInt(document.getElementById("azTiv").value,10)||0, tuevLast:document.getElementById("azTlast").value||"",

async function exportAufzugPDF(){
  if(!window.jspdf){ toast("PDF-Bibliothek lädt noch."); return; }
  const a=S.aufzug, h=S.houses.find(x=>x.id===a.houseId);
  const overlay=document.createElement("div"); overlay.className="pdf-overlay";
  overlay.innerHTML=`<div class="pdf-box"><div class="spin"></div><div style="font-weight:600">PDF wird erstellt…</div></div>`; document.body.appendChild(overlay);
  try{
    const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
    const PW=210,PH=297,M=15; let y=M; const navy=[32,42,68],muted=[110,106,96],line=[210,205,190];
    const cc=l=>l==="overdue"?[181,70,47]:l==="soon"?[150,120,30]:l==="ok"?[62,124,90]:[140,136,125];
    const sc=s=>s==="behoben"?[62,124,90]:s==="in Bearbeitung"?[150,120,30]:[181,70,47];
    const footer=()=>{ const pg=doc.internal.getNumberOfPages(); doc.setFontSize(8); doc.setFont("helvetica","normal"); doc.setTextColor(...muted); doc.text((a.name||"Aufzug")+" – Aufzugprotokoll",M,PH-8); doc.text("Seite "+pg,PW-M,PH-8,{align:"right"}); };
    const ensure=hh=>{ if(y+hh>PH-15){ footer(); doc.addPage(); y=M; } };
    doc.setFillColor(...navy); doc.rect(0,0,PW,26,"F"); doc.setTextColor(244,242,236); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("Aufzug – Wartung & Meldungen",M,12);
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text(`${a.name}${h?" · "+h.name:""}`,M,20); y=34;
    doc.setTextColor(40,38,33); doc.setFontSize(10);
    const w=liftWart(a), t=liftTuev(a);
    const meta=[["Fabrik-/Anlagennr.",a.fabriknr||"–"],["Hersteller",a.hersteller||"–"],["Wartungsfirma",a.firm||"–"],
      ["Wartung",`${a.interval?"alle "+a.interval+" Mon.":"–"} · letzte ${a.lastDate?fmtShort(a.lastDate):"–"} · nächste ${w.next?fmtShort(w.next):"–"} (${w.label})`],
      ["TÜV-Prüfung",`${a.tuevInterval?"alle "+a.tuevInterval+" Mon.":"–"} · letzte ${a.tuevLast?fmtShort(a.tuevLast):"–"} · nächste ${t.next?fmtShort(t.next):"–"} (${t.label})`]];
    meta.forEach(r=>{ ensure(6); doc.setFont("helvetica","bold"); doc.text(r[0]+":",M,y); doc.setFont("helvetica","normal"); const l=doc.splitTextToSize(String(r[1]),PW-M-50); doc.text(l,M+45,y); y+=l.length*5+1; });
    y+=2; doc.setDrawColor(...line); doc.line(M,y,PW-M,y); y+=7;
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(...navy);
    const meld=S.meldungen||[], open=meld.filter(m=>m.status!=="behoben").length;
    doc.text(`Störungs- & Mängelmeldungen  (${open} offen / ${meld.length} gesamt)`,M,y); y+=6;
    doc.setTextColor(40,38,33);
    if(!meld.length){ doc.setFontSize(9.5); doc.setTextColor(...muted); doc.text("keine Meldungen erfasst",M,y); }
    meld.forEach(m=>{
      ensure(12); doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(40,38,33);
      doc.text(`${fmtShort(m.date)} – ${m.title||""}`,M,y);
      const c=sc(m.status); doc.setFontSize(8.5); doc.setTextColor(c[0],c[1],c[2]); doc.text(m.status+(m.prio?" · "+m.prio:""),PW-M,y,{align:"right"}); y+=5;
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...muted);
      const info=[m.reporter?"gemeldet von "+m.reporter:null, (m.status==="behoben"&&m.resolvedDate)?"behoben "+fmtShort(m.resolvedDate):null, m.note||null].filter(Boolean).join("  ·  ");
      if(info){ const l=doc.splitTextToSize(info,PW-2*M); doc.text(l,M,y); y+=l.length*4.4; }
      doc.setTextColor(40,38,33); y+=2; doc.setDrawColor(...line); doc.line(M,y,PW-M,y); y+=4;
    });
    footer(); doc.save(`Aufzug_${(a.name||"Aufzug").replace(/[^\w\säöüÄÖÜß-]/g,"").replace(/\s+/g,"_")}_${todayISO()}.pdf`);
    overlay.remove(); toast("Aufzug-PDF erstellt.");
  }catch(e){ console.error(e); overlay.remove(); showError("PDF-Export fehlgeschlagen", e); }
}

    const byHouse={}; S.houses.forEach(h=>byHouse[h.id]=h);
    const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
    const PW=210,PH=297,M=15; let y=M; const navy=[32,42,68],muted=[110,106,96],line=[210,205,190];

    all.slice().sort((a,b)=>((counts[b.id]||{open:0}).open-(counts[a.id]||{open:0}).open)).forEach(a=>{

      doc.setFontSize(8.5); doc.setTextColor(...muted);
      doc.text(`Objekt: ${h?h.name:"–"}   ·   Wartung: ${w.label}${w.next?" (nächste "+fmtShort(w.next)+")":""}   ·   TÜV: ${t.label}${t.next?" (nächste "+fmtShort(t.next)+")":""}`,M,y);

}

/* ===================== Wohnungssanierungen ===================== */
const SAN_STATUS=["geplant","laufend","abgeschlossen"];
function sanClass(s){ return s==="abgeschlossen"?"good":s==="laufend"?"mid":"na"; }
const euro = v => (v===""||v==null||isNaN(Number(v)))? "–" : Number(v).toLocaleString("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0});

async function openSanierung(){
  if(!canArea("sanierung")) return goHome();
  S.view="sanierung";
  if(!S.sanFilter) S.sanFilter={status:"alle",house:"alle"};
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Wohnungssanierungen</div>
    <div class="page-head"><div><h2>Wohnungssanierungen</h2><div class="lead">Lade Daten…</div></div></div>`;
  S.sanierungen=await DB.listSanierungen();

}
function setSanFilter(k,v){ S.sanFilter[k]=v; drawSanierung(); }
function drawSanierung(){
  const all=S.sanierungen||[], f=S.sanFilter;
  const byId={}; S.houses.forEach(h=>byId[h.id]=h);

  const rank={laufend:0,geplant:1,abgeschlossen:2};
  list.sort((a,b)=>(rank[a.status]??3)-(rank[b.status]??3) || (b.start||"").localeCompare(a.start||""));
  const nLauf=all.filter(s=>s.status==="laufend").length, nPlan=all.filter(s=>s.status==="geplant").length, nDone=all.filter(s=>s.status==="abgeschlossen").length;
  const sumCost=all.filter(s=>s.status!=="abgeschlossen").reduce((sum,s)=>sum+(Number(s.budget)||0),0);
  const houseIds=new Set(all.map(s=>s.houseId).filter(Boolean));

  const filterBar=`<div class="filterbar card">
    <div class="ff"><label>Status</label><select onchange="setSanFilter('status',this.value)">
      <option value="alle" ${f.status==="alle"?"selected":""}>Alle</option>
      ${SAN_STATUS.map(s=>`<option value="${s}" ${f.status===s?"selected":""}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join("")}
    </select></div>
    <div class="ff"><label>Objekt</label><select onchange="setSanFilter('house',this.value)">
      <option value="alle" ${f.house==="alle"?"selected":""}>Alle Objekte</option>
      ${S.houses.filter(h=>houseIds.has(h.id)).map(h=>`<option value="${h.id}" ${f.house===h.id?"selected":""}>${esc(h.name)}</option>`).join("")}
    </select></div>
  </div>`;

  let body;
  if(!all.length){
    body=`<div class="empty card" style="border-style:dashed">${I.hammer}<h3>Noch keine Sanierungen erfasst</h3>
      <p>Lege Sanierungsprojekte je Wohnung an – mit Status, Zeitraum, Budget und Fachfirma.</p>
      <div style="margin-top:18px"><button class="btn primary" onclick="addSanierung()">${I.plus} Sanierung anlegen</button></div></div>`;
  } else if(!list.length){
    body=filterBar+`<div class="empty card" style="border-style:dashed">${I.info}<h3>Keine Treffer</h3><p>Für die gewählten Filter gibt es keine Einträge.</p></div>`;
  } else {
    const cards=list.map(s=>{
      const h=byId[s.houseId];
      const zeit = s.status==="abgeschlossen"
        ? `${s.start?esc(fmtShort(s.start)):"–"} – ${s.end?esc(fmtShort(s.end)):"–"}`
        : `${s.start?esc(fmtShort(s.start)):"–"} – geplant ${s.endPlanned?esc(fmtShort(s.endPlanned)):"–"}`;
      const over = s.status==="laufend" && s.endPlanned && daysUntil(s.endPlanned)<0;
      const kosten = s.status==="abgeschlossen"
        ? `<b>Kosten:</b> ${euro(s.cost)}${s.budget!==""?` (Budget ${euro(s.budget)})`:""}`
        : `<b>Budget:</b> ${euro(s.budget)}`;
      return `<div class="def card ${s.status==="laufend"?"mid":""}" style="border-left-color:var(--${s.status==="abgeschlossen"?"good":s.status==="laufend"?(over?"bad":"mid"):"na"})">
        <div class="body">
          <div class="area">${esc(s.wohnung||"(ohne Wohnung)")}${s.title?` – ${esc(s.title)}`:""} <span class="chip ${sanClass(s.status)}">${esc(s.status)}</span>${over?`<span class="chip bad">Termin überschritten</span>`:""}</div>
          <div class="kv"><b>Objekt:</b> ${h?esc(h.name):"–"}${s.firm?` &nbsp;·&nbsp; <b>Firma:</b> ${esc(s.firm)}`:""}</div>
          <div class="kv"><b>Zeitraum:</b> ${zeit} &nbsp;·&nbsp; ${kosten}</div>
          ${s.note?`<div class="kv" style="color:var(--muted)">${esc(s.note)}</div>`:""}
          <div class="seg" style="margin-top:9px">${SAN_STATUS.map(x=>`<button data-v="${x}" class="${s.status===x?'on':''}" onclick="setSanStatus('${s.id}','${x}')">${x}</button>`).join("")}

            <button class="btn sm" onclick="addSanierung('${s.id}')">${I.edit}</button>
            <button class="btn sm danger" onclick="delSanierung('${s.id}')">${I.trash}</button></div>
        </div></div>`;
    }).join("");
    body=filterBar+`<div class="stat-row">
        <div class="stat" style="border-left:4px solid var(--mid)"><div class="num" style="color:var(--mid)">${nLauf}</div><div class="lbl">laufend</div></div>

      </div>${cards}`;
  }
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Wohnungssanierungen</div>
    <div class="page-head">
      <div><h2>Wohnungssanierungen</h2><div class="lead">Sanierungsprojekte je Wohnung mit Status, Zeitraum, Budget und Fachfirma.</div></div>
      <div class="toolbar">
        ${all.length?`<button class="btn" onclick="exportSanierungPDF()">${I.pdf} Als PDF</button>`:""}
        <button class="btn primary" onclick="addSanierung()">${I.plus} Sanierung anlegen</button>
      </div>
    </div>
    ${body}`;
}

async function saveSanierungForm(id){

  const s={ id:id||uid(), houseId:document.getElementById("snHouse").value||"", wohnung,
    title:document.getElementById("snTitle").value.trim(), status:document.getElementById("snStatus").value,
    start:document.getElementById("snStart").value||"", endPlanned:document.getElementById("snEndP").value||"",
    end:document.getElementById("snEnd").value||"", budget:document.getElementById("snBudget").value,
    cost:document.getElementById("snCost").value, firm:document.getElementById("snFirm").value.trim(),
    note:document.getElementById("snNote").value.trim() };
  try{ await DB.saveSanierung(s); }catch(e){ showError("Sanierung konnte nicht gespeichert werden", e); return; }
  S.sanierungen=S.sanierungen||[]; const pos=S.sanierungen.findIndex(x=>x.id===s.id);

async function setSanStatus(id,status){

  s.status=status; if(status==="abgeschlossen"&&!s.end) s.end=todayISO();
  try{ await DB.saveSanierung(s); }catch(e){ return showError("Fehler", e); }
  drawSanierung();
}
function delSanierung(id){
  confirmModal("Sanierung löschen?","Dieses Sanierungsprojekt wird dauerhaft entfernt.",async()=>{

/* ===================== E-Mail an Firmen (Mängelmeldung) ===================== */
function composeMail(opts){
  S._mailTrack = opts.track ? {kind:opts.kind, houseId:opts.houseId||"", aufzugId:opts.aufzugId||""} : null;
  S._mailAfter = opts.after || null;
  const frist = opts.track ? `<div class="field" style="margin-bottom:10px"><label>Frist / Wiedervorlage (manuell, optional)</label><input id="cmDue" type="date" value="${opts.defaultDue||""}"></div>` : "";
  modal(`<h3>Meldung per E-Mail senden</h3>
    <p class="m">Die Meldung wird in deinem E-Mail-Programm geöffnet – dort nur noch prüfen und absenden.${opts.track?" Beim Öffnen wird der Vorgang zur Überwachung protokolliert.":""}${opts.hint?'<br>'+esc(opts.hint):""}</p>
    <div class="field" style="margin-bottom:10px"><label>Empfänger</label><input id="cmTo" type="email" placeholder="firma@beispiel.de" value="${esc(opts.to||"")}"></div>
    <div class="field" style="margin-bottom:10px"><label>Betreff</label><input id="cmSub" value="${esc(opts.subject||"")}"></div>
    <div class="field" style="margin-bottom:10px"><label>Nachricht</label><textarea id="cmBody" style="min-height:190px;font-size:13px">${esc(opts.body||"")}</textarea></div>
    ${frist}
    <div class="modal-actions">
      <button class="btn" onclick="copyMailBody()">In Zwischenablage</button>
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn primary" onclick="openMailto()">${I.mail} Im E-Mail-Programm öffnen</button>
    </div>`);
  document.getElementById("modalBg").querySelector(".modal").style.maxWidth="620px";
}
function openMailto(){
  const to=(document.getElementById("cmTo").value||"").trim();
  const sub=document.getElementById("cmSub").value||"";
  const body=document.getElementById("cmBody").value||"";
  if(!to||!to.includes("@")){ toast("Bitte eine Empfänger-E-Mail eingeben."); return; }
  if(S._mailTrack){
    const due=(document.getElementById("cmDue")||{}).value||"";
    const entry={ id:uid(), kind:S._mailTrack.kind, houseId:S._mailTrack.houseId, aufzugId:S._mailTrack.aufzugId,
      subject:sub, recipient:to, sentDate:todayISO(), dueDate:due, status:"offen", note:"" };
    DB.logMeldung(entry).then(()=>toast("Vorgang wird überwacht.")).catch(()=>{});
    S._mailTrack=null;
  }
  if(S._mailAfter){ try{ S._mailAfter(to); }catch(e){} S._mailAfter=null; }
  const href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;
  closeModal();
  window.location.href=href;
}
async function copyMailBody(){
  const t=`An: ${document.getElementById("cmTo").value}\nBetreff: ${document.getElementById("cmSub").value}\n\n${document.getElementById("cmBody").value}`;
  try{ await navigator.clipboard.writeText(t); toast("In die Zwischenablage kopiert."); }
  catch(e){ toast("Kopieren nicht möglich – bitte Text markieren und kopieren."); }
}
function mailDefectGroup(houseId){
  const g=(S.defAll&&filterDefects(S.defAll,S.defFilter).find(x=>x.house.id===houseId));
  if(!g) return;
  const h=g.house;
  const lines=g.defs.map((d,i)=>{
    const f=d.fields.map(x=>`${x.label}: ${x.val}`).join(" | ");
    return `${i+1}. ${d.area} [${d.cond}${d.prio?", Prio "+d.prio:""}]${f?"\n   "+f:""}`;
  }).join("\n");
  const body=`Sehr geehrte Damen und Herren,\n\nbei der Objektbegehung am ${fmtShort(g.date)} wurden im Objekt ${h.name}${h.unit?" (WE "+h.unit.replace(/^WE\s*/i,"")+")":""}${h.address?", "+h.address:""} folgende Mängel festgestellt:\n\n${lines}\n\nWir bitten um Prüfung und ein Angebot bzw. die Behebung. Fotos können wir auf Wunsch nachreichen (PDF-Protokoll liegt vor).\n\nMit freundlichen Grüßen`;
  composeMail({ to:"", subject:`Mängelmeldung ${h.name}${h.unit?" (WE "+h.unit.replace(/^WE\s*/i,"")+")":""} – Begehung ${fmtShort(g.date)}`, body,
    track:true, kind:"maengel", houseId:h.id,
    hint:"Tipp: Vorher als PDF exportieren und die Datei in der E-Mail anhängen." });
}

async function mailAnlage(id, houseId){
  const a=(S.anlagen||[]).find(x=>x.id===id)
       || ((S._wart||[]).map(x=>x.a).find(x=>x.id===id));
  if(!a){ toast("Anlage nicht gefunden."); return; }
  const h=(S.houses||[]).find(x=>x.id===(houseId||a.houseId));
  const s=wartStatus(a);
  const lage = s.level==="overdue" ? `Die Fälligkeit war am ${fmtShort(s.next)} und ist damit seit ${Math.abs(s.days)} Tagen überschritten.`
    : s.level==="soon" ? `Die nächste Fälligkeit ist am ${fmtShort(s.next)}, also in ${s.days} Tagen.`
    : s.next ? `Die nächste Fälligkeit ist am ${fmtShort(s.next)}.` : `Ein Intervall ist bei uns nicht hinterlegt.`;
  const body=`Sehr geehrte Damen und Herren,\n\nfür das Objekt ${objZeile(h)} bitten wir um einen Termin für folgende Leistung:\n\n`
    +`Anlage/Prüfung: ${a.name}\n`
    +(a.art?`Art: ${a.art}\n`:"")
    +(a.interval?`Intervall: alle ${a.interval} Monate\n`:"")
    +(a.lastDate?`Letzte Durchführung: ${fmtShort(a.lastDate)}\n`:"Letzte Durchführung: bei uns nicht dokumentiert\n")
    +(a.note?`Hinweis: ${a.note}\n`:"")
    +`\n${lage}\n\nWir bitten um einen Terminvorschlag und – falls erforderlich – ein Angebot. Den Zugang stimmen wir gern mit unserem Hausmeister ab.\n\n${MAIL_GRUSS}`;
  composeMail({ to: await firmMailAdresse(a.firm), subject:`${a.name} – Terminanfrage ${h?h.name:""}`, body,
    track:true, kind:"wartung", houseId:h?h.id:"",
    hint:a.firm?undefined:"Tipp: Hinterlege die Fachfirma bei der Anlage, dann ist der Empfänger vorausgefüllt." });
}

/* ---- Zähler: Störung, Zählerwechsel, Eichfrist ---- */
async function mailZaehler(zid){
  const z=(S.zaehler||[]).find(x=>x.id===zid)
       || ((S._zAll||[]).find(x=>x.id===zid));
  if(!z){ toast("Zähler nicht gefunden."); return; }
  const h=(S.houses||[]).find(x=>x.id===z.houseId);
  const e=eichStatus(z);
  const letzte=(S.ablesungen||S._aAll||[]).filter(a=>a.zaehlerId===z.id)
    .sort((a,b)=>(b.datum||"").localeCompare(a.datum||""))[0];
  const problem = letzte && letzte.status!=="abgelesen" ? letzte.status : "";
  let betreff, anliegen;
  if(e.level==="overdue"){
    betreff=`Eichfrist abgelaufen – Zähler ${z.nummer||z.bezeichnung}`;
    anliegen=`die Eichfrist des unten genannten Zählers ist am ${fmtShort(z.eichBis)} abgelaufen. Wir bitten um Austausch bzw. Nacheichung und um Mitteilung des Zählerstands zum Wechselzeitpunkt.`;
  } else if(e.level==="soon"){
    betreff=`Eichfrist läuft aus – Zähler ${z.nummer||z.bezeichnung}`;
    anliegen=`die Eichfrist des unten genannten Zählers läuft am ${fmtShort(z.eichBis)} ab. Wir bitten um rechtzeitige Terminierung des Austauschs.`;
  } else if(problem==="defekt"){
    betreff=`Zählerstörung – ${z.nummer||z.bezeichnung}`;
    anliegen=`der unten genannte Zähler wurde bei der Ablesung als defekt festgestellt. Wir bitten um Prüfung und gegebenenfalls Austausch.`;
  } else if(problem){
    betreff=`Zugang zum Zähler ${z.nummer||z.bezeichnung}`;
    anliegen=`der unten genannte Zähler konnte bei der Ablesung nicht erfasst werden (Vermerk: ${problem}). Wir bitten um Unterstützung beim Zugang bzw. um Mitteilung des aktuellen Zählerstands.`;
  } else {
    betreff=`Anfrage zum Zähler ${z.nummer||z.bezeichnung}`;
    anliegen=`wir haben eine Rückfrage zum unten genannten Zähler.`;
  }
  const body=`Sehr geehrte Damen und Herren,\n\n${anliegen}\n\n`
    +`Objekt: ${objZeile(h)}\n`
    +`Zählernummer: ${z.nummer||"—"}\n`
    +`Bezeichnung: ${z.bezeichnung||"—"}\n`
    +`Medium / Art: ${z.medium} / ${z.art}\n`
    +(zStandort(z)?`Standort: ${zStandort(z)}\n`:"")
    +(z.eichBis?`Eichfrist bis: ${fmtShort(z.eichBis)}\n`:"")
    +((z.faktor&&z.faktor!==1)?`Wandlerfaktor: ×${z.faktor}\n`:"")
    +(letzte?`Letzte Erfassung: ${fmtShort(letzte.datum)} – ${letzte.status==="abgelesen"?zNum(letzte.stand)+" "+zEinheit(z):letzte.status}\n`:"")
    +`\nWir bitten um Rückmeldung mit Terminvorschlag.\n\n${MAIL_GRUSS}`;
  composeMail({ to: await firmMailAdresse(z.msb), subject:betreff, body,
    track:true, kind:"zaehler", houseId:z.houseId,
    hint:z.msb?undefined:"Tipp: Hinterlege den Messstellenbetreiber beim Zähler, dann ist der Empfänger vorausgefüllt." });
}

/* ---- Ableseauftrag an den Dienstleister ---- */
async function mailAbleseauftrag(scope){
  const per=abPeriode();
  const houses={}; (S.houses||[]).forEach(h=>houses[h.id]=h);
  const zs = scope==="all" ? (S._zAll||[]) : (S.zaehler||[]);
  const abs = scope==="all" ? (S._aAll||[]) : (S.ablesungen||[]);
  const offen=zs.filter(z=>!abs.some(a=>a.zaehlerId===z.id && (a.datum||"").slice(0,4)===per && a.status==="abgelesen"));
  if(!offen.length){ toast("Für diese Periode ist nichts offen."); return; }
  const gruppen={};
  offen.forEach(z=>{ (gruppen[z.houseId]=gruppen[z.houseId]||[]).push(z); });
  const text=Object.keys(gruppen).map(hid=>{
    const h=houses[hid];
    const zeilen=gruppen[hid].map((z,i)=>
      `   ${i+1}. ${z.bezeichnung||"(ohne Bezeichnung)"} – Nr. ${z.nummer||"—"} (${z.medium}, ${z.art})`
      +(zStandort(z)?`\n      Standort: ${zStandort(z)}`:`\n      Standort: nicht erfasst – bitte vor Ort aufnehmen`)
      +((z.faktor&&z.faktor!==1)?`\n      Achtung: Wandlermessung, Faktor ×${z.faktor}`:"")
      +(z.note?`\n      Hinweis: ${z.note}`:"")
    ).join("\n");
    return `${objZeile(h)}\n${zeilen}`;
  }).join("\n\n");
  const body=`Sehr geehrte Damen und Herren,\n\nfür die Betriebskostenabrechnung ${per} bitten wir um Ablesung der folgenden Zähler. Der Standort ist jeweils angegeben, soweit er uns bekannt ist.\n\n${text}\n\n`
    +`Bitte notieren Sie zu jedem Zähler den Stand und das Ablesedatum. Zähler, die nicht auffindbar sind oder zu denen kein Zugang besteht, bitte ausdrücklich als solche vermerken statt wegzulassen – wir klären diese Fälle dann gesondert.\n\n`
    +`Für Rückfragen stehen wir zur Verfügung.\n\n${MAIL_GRUSS}`;
  // Empfänger aus der letzten Periode ableiten: wer hat zuletzt abgelesen?
  const zaehl={};
  abs.filter(a=>a.quelle==="vor Ort" && a.ableser && (a.datum||"").slice(0,4)<per)
     .forEach(a=>{ zaehl[a.ableser]=(zaehl[a.ableser]||0)+1; });
  const haeufigster=Object.keys(zaehl).sort((x,y)=>zaehl[y]-zaehl[x])[0]||"";
  composeMail({ to: await firmMailAdresse(haeufigster), subject:`Ableseauftrag ${per}${scope==="all"?"":" – "+(houses[S.houseId]?houses[S.houseId].name:"")} (${offen.length} Zähler)`, body,
    track:true, kind:"ablesung", houseId:scope==="all"?"":S.houseId,
    hint:"Tipp: Alternativ kann der Dienstleister einen eigenen Zugang bekommen und die Werte direkt eintragen – Menü → Benutzer & Bereiche." });
}

/* ===================== Ticketsystem ===================== */
async function fillThumbs(container){
  if(!container) return;
  const imgs=[...container.querySelectorAll('img[data-path]')];
  for(const im of imgs){ if(im.dataset.loaded) continue; const u=await getImg(im.dataset.path); if(u){ im.src=u; im.dataset.loaded="1"; } }
}
async function lightbox(path){
  const u=await getImg(path); if(!u) return;
  const bg=document.createElement("div"); bg.className="lb-bg"; bg.onclick=()=>bg.remove();
  const img=document.createElement("img"); img.src=u; bg.appendChild(img);
  document.body.appendChild(bg);
}
function renderTkPhotos(){
  const c=document.getElementById("tkPhotos"); if(!c) return;
  const ph=S._tkPhotos||[];
  c.innerHTML = ph.length? ph.map(p=>`<div class="thumb-wrap"><img class="thumb" data-path="${esc(p)}"><button class="thumb-x" onclick="tkRemovePhoto('${esc(p)}')">${I.x}</button></div>`).join("")
    : `<div style="font-size:12.5px;color:var(--muted)">Noch keine Fotos angehängt.</div>`;
  fillThumbs(c);
}
async function tkAddPhotos(inp){
  const files=[...inp.files]; inp.value="";
  if(!files.length) return;
  const ov=geoOverlay("Foto wird hochgeladen…");
  try{
    for(const f of files){
      const d=await compressFile(f,1280,0.7);
      const path=await uploadPhoto(S._tkId, d);
      (S._tkPhotos=S._tkPhotos||[]).push(path);
    }
    ov.remove(); renderTkPhotos();
  }catch(e){ ov.remove(); showError("Foto konnte nicht hochgeladen werden", e); }
}
async function tkRemovePhoto(path){
  try{ await removePhoto(path); }catch(e){}
  S._tkPhotos=(S._tkPhotos||[]).filter(p=>p!==path); renderTkPhotos();
}

const TK_STATUS=["offen","in Bearbeitung","erledigt"];
const TK_BEZUG=[["objekt","Objekt"],["mieteinheit","Mieteinheit"],["aufzug","Aufzug"]];
function tkClass(s){ return s==="erledigt"?"good":s==="in Bearbeitung"?"mid":"bad"; }
function tkOverdue(t){ return t.status!=="erledigt" && t.dueDate && daysUntil(t.dueDate)<0; }
function bezugLbl(b){ const f=TK_BEZUG.find(x=>x[0]===b); return f?f[1]:"Objekt"; }
function tkRef(t){
  const h=S.houses.find(x=>x.id===t.houseId);
  const base=h?h.name:"(kein Objekt)";
  if(t.bezug==="mieteinheit") return `${base} · ${t.unit||"Mieteinheit"}`;
  if(t.bezug==="aufzug") return `${base} · ${t.unit||"Aufzug"}`;
  return base;
}

async function openTickets(){
  if(!canArea("tickets")) return goHome();
  S.view="tickets";
  if(!S.tkFilter) S.tkFilter={status:"offen",bezug:"alle",house:"alle"};
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Tickets</div>
    <div class="page-head"><div><h2>Tickets</h2><div class="lead">Lade Daten…</div></div></div>`;
  S.tickets=await DB.listTickets();
  drawTickets();
}
function setTkFilter(k,v){ S.tkFilter[k]=v; drawTickets(); }
function drawTickets(){
  const all=S.tickets||[], f=S.tkFilter;
  const byHouse={}; S.houses.forEach(h=>byHouse[h.id]=h);
  let list=all.slice();
  if(f.status==="offen") list=list.filter(t=>t.status!=="erledigt");
  else if(f.status==="ueberfaellig") list=list.filter(tkOverdue);
  else if(f.status==="erledigt") list=list.filter(t=>t.status==="erledigt");
  if(f.bezug!=="alle") list=list.filter(t=>t.bezug===f.bezug);
  if(f.house!=="alle") list=list.filter(t=>t.houseId===f.house);
  const prioRank={hoch:0,mittel:1,niedrig:2,"":3};
  list.sort((a,b)=>{ const oa=tkOverdue(a)?0:(a.status!=="erledigt"?1:2), ob=tkOverdue(b)?0:(b.status!=="erledigt"?1:2);
    return oa-ob || (prioRank[a.prio]??3)-(prioRank[b.prio]??3) || (a.dueDate||"9999").localeCompare(b.dueDate||"9999"); });
  const nOpen=all.filter(t=>t.status!=="erledigt").length, nOver=all.filter(tkOverdue).length, nDone=all.filter(t=>t.status==="erledigt").length;
  const houseIds=new Set(all.map(t=>t.houseId).filter(Boolean));

  const filterBar=`<div class="filterbar card">
    <div class="ff"><label>Status</label><select onchange="setTkFilter('status',this.value)">
      ${[["offen","Offen (inkl. in Bearbeitung)"],["ueberfaellig","Überfällig"],["erledigt","Erledigt"],["alle","Alle"]].map(([k,l])=>`<option value="${k}" ${f.status===k?"selected":""}>${l}</option>`).join("")}
    </select></div>
    <div class="ff"><label>Bezug</label><select onchange="setTkFilter('bezug',this.value)">
      <option value="alle" ${f.bezug==="alle"?"selected":""}>Alle</option>
      ${TK_BEZUG.map(([k,l])=>`<option value="${k}" ${f.bezug===k?"selected":""}>${l}</option>`).join("")}
    </select></div>
    <div class="ff"><label>Objekt</label><select onchange="setTkFilter('house',this.value)">
      <option value="alle" ${f.house==="alle"?"selected":""}>Alle Objekte</option>
      ${S.houses.filter(h=>houseIds.has(h.id)).map(h=>`<option value="${h.id}" ${f.house===h.id?"selected":""}>${esc(h.name)}</option>`).join("")}
    </select></div>
  </div>`;

  let body;
  if(!all.length){
    body=`<div class="empty card" style="border-style:dashed">${I.ticket}<h3>Noch keine Tickets</h3>
      <p>Erfasse Mängel als Ticket – mit Bezug auf ein Objekt, eine Mieteinheit oder einen Aufzug, inkl. Status, Priorität, Frist und Versand an die Firma.</p>
      <div style="margin-top:18px"><button class="btn primary" onclick="addTicket()">${I.plus} Ticket erstellen</button></div></div>`;
  } else if(!list.length){
    body=filterBar+`<div class="empty card" style="border-style:dashed">${I.info}<h3>Keine Treffer</h3><p>Für die gewählten Filter gibt es keine Tickets.</p></div>`;
  } else {
    const cards=list.map(t=>{
      const over=tkOverdue(t);
      const prioChip = t.prio?`<span class="chip ${t.prio==='hoch'?'bad':t.prio==='mittel'?'mid':'na'}">${esc(t.prio)}</span>`:"";
      const dueTxt = t.dueDate? `Frist ${esc(fmtShort(t.dueDate))}${t.status!=="erledigt"?` (${daysUntil(t.dueDate)<0?Math.abs(daysUntil(t.dueDate))+" T überschritten":"in "+daysUntil(t.dueDate)+" T"})`:""}` : "keine Frist";
      return `<div class="def card ${t.status==="in Bearbeitung"?"mid":""}" style="border-left-color:var(--${t.status==='erledigt'?'good':over?'bad':t.status==='in Bearbeitung'?'mid':'bad'})">
        <div class="body">
          <div class="area" style="font-size:15px">${esc(t.title||"(ohne Titel)")} <span class="chip ${tkClass(t.status)}">${esc(t.status)}</span>${prioChip}${over?`<span class="chip bad">überfällig</span>`:""}</div>
          <div class="kv"><b>${esc(bezugLbl(t.bezug))}:</b> ${esc(tkRef(t))}</div>
          ${t.description?`<div class="kv">${esc(t.description)}</div>`:""}
          <div class="kv" style="color:var(--muted)">${t.reporter?`gemeldet von ${esc(t.reporter)}`:""}${t.createdDate?` · erfasst ${esc(fmtShort(t.createdDate))}`:""}${t.firm?` · ${esc(t.firm)}`:""} · <b style="${over?'color:var(--bad)':''}">${esc(dueTxt)}</b></div>
          ${t.sentDate?`<div class="kv" style="color:var(--muted)">gemeldet an Firma am ${esc(fmtShort(t.sentDate))}${t.sentTo?` (${esc(t.sentTo)})`:""}</div>`:""}
          ${(t.photos&&t.photos.length)?`<div class="thumbs" style="margin-top:8px">${t.photos.map(p=>`<img class="thumb" data-path="${esc(p)}" onclick="lightbox('${esc(p)}')">`).join("")}</div>`:""}
          ${t.createdBy?`<div class="kv" style="color:var(--faint);font-size:12px">erfasst über Konto ${esc(t.createdBy)}</div>`:""}
          <div class="seg" style="margin-top:9px">${TK_STATUS.map(s=>`<button class="${t.status===s?'on':''}" onclick="setTicketStatus('${t.id}','${s}')">${s}</button>`).join("")}
            <button class="btn sm" style="margin-left:auto" onclick="mailTicket('${t.id}')">${I.mail} An Firma</button>
            <button class="btn sm" onclick="addTicket('${t.id}')">${I.edit}</button>
            <button class="btn sm danger" onclick="delTicket('${t.id}')">${I.trash}</button></div>
        </div></div>`;
    }).join("");
    body=filterBar+`<div class="stat-row">
        <div class="stat bad"><div class="num">${nOver}</div><div class="lbl">überfällig</div></div>
        <div class="stat" style="border-left:4px solid var(--mid)"><div class="num" style="color:var(--mid)">${nOpen}</div><div class="lbl">offen / in Bearbeitung</div></div>
        <div class="stat"><div class="num" style="color:var(--good)">${nDone}</div><div class="lbl">erledigt</div></div>
      </div>${cards}`;
  }
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Tickets</div>
    <div class="page-head">
      <div><h2>Tickets</h2><div class="lead">Mängel-Tickets mit Bezug auf Objekt, Mieteinheit oder Aufzug – mit Status, Priorität, Frist und Versand an die Firma.</div></div>
      <div class="toolbar"><button class="btn primary" onclick="addTicket()">${I.plus} Ticket erstellen</button></div>
    </div>
    ${body}`;
  fillThumbs(view);
}

    <div class="field"><label>Fotos (optional)</label>
      <div id="tkPhotos" class="thumbs"></div>
      <label class="btn sm" style="margin-top:8px"><input type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="tkAddPhotos(this)">${I.cam} Foto aufnehmen / hochladen</label></div>
    <div class="field"><label>Priorität</label><select id="tkPrio"><option value="">–</option>${["niedrig","mittel","hoch"].map(p=>`<option ${t&&t.prio===p?"selected":""}>${p}</option>`).join("")}</select></div>

function logOverdue(l){ return l.status==="offen" && l.dueDate && daysUntil(l.dueDate)<0; }

  S.mlog=await DB.listMeldungenLog();

function setMlogFilter(v){ S.mlogFilter=v; drawMeldungen(); }
function drawMeldungen(){
  const all=S.mlog||[];
  const byHouse={}; S.houses.forEach(h=>byHouse[h.id]=h);
  const byAz={}; (S.aufzuege||[]).forEach(a=>byAz[a.id]=a);
  const f=S.mlogFilter||"offen";
  let list=all.slice();
  if(f==="offen") list=list.filter(l=>l.status==="offen");
  else if(f==="ueberfaellig") list=list.filter(l=>logOverdue(l));
  else if(f==="erledigt") list=list.filter(l=>l.status==="erledigt");
  list.sort((a,b)=>{ const oa=logOverdue(a)?0:(a.status==="offen"?1:2), ob=logOverdue(b)?0:(b.status==="offen"?1:2); return oa-ob || (a.dueDate||"9999").localeCompare(b.dueDate||"9999"); });
  const nOffen=all.filter(l=>l.status==="offen").length, nOver=all.filter(logOverdue).length, nDone=all.filter(l=>l.status==="erledigt").length;

  const tabs=`<div class="filterbar card" style="gap:8px">
    ${[["offen","Offen"],["ueberfaellig","Überfällig"],["erledigt","Erledigt"],["alle","Alle"]].map(([k,l])=>`<button class="btn sm ${f===k?'primary':''}" onclick="setMlogFilter('${k}')">${l}</button>`).join("")}
  </div>`;

  let body;
  if(!all.length){
    body=`<div class="empty card" style="border-style:dashed">${I.bell}<h3>Noch keine gesendeten Meldungen</h3>
      <p>Sobald du in der Mängelübersicht oder bei den Aufzügen „Per E-Mail melden" auslöst, wird der Vorgang hier zur Überwachung protokolliert.</p></div>`;
  } else if(!list.length){
    body=tabs+`<div class="empty card" style="border-style:dashed">${I.info}<h3>Keine Einträge</h3><p>Für diesen Filter gibt es nichts.</p></div>`;
  } else {
    const cards=list.map(l=>{
      const over=logOverdue(l);
      const KIND_LBL={ aufzug:"Aufzug-Störung", maengel:"Mängelmeldung", ticket:"Ticket",
        wartung:"Wartung / Prüfpflicht", zaehler:"Zähler", ablesung:"Ableseauftrag",
        sanierung:"Sanierung", dienstleister:"Hausdienstleister" };
      const kindLbl = KIND_LBL[l.kind] || "Mängelmeldung";
      const ref = l.kind==="aufzug"? (byAz[l.aufzugId]?byAz[l.aufzugId].name:"Aufzug") : (byHouse[l.houseId]?byHouse[l.houseId].name:"Objekt");
      const statusChip = l.status==="erledigt"?`<span class="chip good">erledigt</span>`:(over?`<span class="chip bad">Rückmeldung überfällig</span>`:`<span class="chip mid">offen</span>`);
      const fristTxt = l.dueDate? `Frist ${esc(fmtShort(l.dueDate))}${l.status==="offen"?` (${daysUntil(l.dueDate)<0?Math.abs(daysUntil(l.dueDate))+" T überschritten":"in "+daysUntil(l.dueDate)+" T"})`:""}` : "keine Frist gesetzt";
      return `<div class="def card ${over?'':(l.status==='offen'?'mid':'')}" style="border-left-color:var(--${l.status==='erledigt'?'good':over?'bad':'mid'})">
        <div class="body">
          <div class="area" style="font-size:15px">${esc(kindLbl)}: ${esc(ref)} ${statusChip}</div>
          <div class="kv"><b>Gesendet:</b> ${esc(fmtShort(l.sentDate))} an ${esc(l.recipient||"–")}</div>
          <div class="kv"><b>${over?'<span style="color:var(--bad)">':''}Wiedervorlage:</b> ${esc(fristTxt)}${over?'</span>':''}</div>
          <div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">
            ${l.status==="offen"?`<button class="btn sm" onclick="markLogDone('${l.id}')">${I.done} Rückmeldung erhalten</button>`:`<button class="btn sm" onclick="reopenLog('${l.id}')">erneut öffnen</button>`}
            <button class="btn sm" onclick="remindLog('${l.id}')">${I.mail} Erinnerung</button>
            <button class="btn sm" onclick="editFrist('${l.id}')">${I.calendar} Frist</button>
            <button class="btn sm danger" onclick="delLog('${l.id}')">${I.trash}</button>
          </div>
        </div></div>`;
    }).join("");
    body=tabs+`<div class="stat-row">
        <div class="stat bad"><div class="num">${nOver}</div><div class="lbl">Rückmeldung überfällig</div></div>
        <div class="stat" style="border-left:4px solid var(--mid)"><div class="num" style="color:var(--mid)">${nOffen}</div><div class="lbl">offen gesamt</div></div>
        <div class="stat"><div class="num" style="color:var(--good)">${nDone}</div><div class="lbl">erledigt</div></div>
      </div>${cards}`;
  }
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Meldungs-Überwachung</div>
    <div class="page-head"><div><h2>Meldungs-Überwachung</h2><div class="lead">Versendete Mängel- und Störungsmeldungen mit manueller Frist. Überfällige Rückmeldungen sind rot markiert.</div></div></div>
    ${body}`;
}

async function ensureJSZip(){
  if(window.JSZip) return;
  await new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload=res; s.onerror=()=>rej(new Error("JSZip konnte nicht geladen werden (Internet nötig).")); document.head.appendChild(s); });
}
function toCSV(rows){
  if(!rows||!rows.length) return "\ufeff";
  const keys=[...rows.reduce((set,r)=>{ Object.keys(r||{}).forEach(k=>set.add(k)); return set; }, new Set())];
  const cell=v=>{ if(v===null||v===undefined) return ""; if(typeof v==="object") v=JSON.stringify(v); v=String(v); return /[";\n\r]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; };
  const head=keys.join(";");
  const lines=rows.map(r=>keys.map(k=>cell(r[k])).join(";"));
  return "\ufeff"+[head,...lines].join("\r\n");
}
async function exportAllData(){
  if(!(S.perm&&S.perm.admin)){ toast("Nur für Administratoren."); return; }
  const ov=geoOverlay("Daten werden exportiert…");
  try{
    await ensureJSZip();
    const tables=["houses","inspections","anlagen","wartung_log","dienstleister","reinigungsplan","reinigungsnachweis","aufzuege","aufzug_meldungen","sanierungen","tickets","meldungen_log","app_users"];
    const dump={};
    for(const t of tables){ const {data,error}=await sb.from(t).select("*"); dump[t]= error? [] : (data||[]); }
    const zip=new window.JSZip();
    zip.file("backup.json", JSON.stringify({ app:"Objektmanagement", exportedAt:new Date().toISOString(), tables:dump }, null, 2));
    const csv=zip.folder("csv");
    for(const t of tables){ csv.file(t+".csv", toCSV(dump[t])); }
    const blob=await zip.generateAsync({type:"blob"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="Objektmanagement-Backup-"+todayISO()+".zip"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    ov.remove(); toast("Sicherung erstellt – ZIP wurde heruntergeladen.");
  }catch(e){ ov.remove(); showError("Export fehlgeschlagen", e); }
}

async function openSearch(){
  closeSearch();

  }catch(e){}

}
function closeSearch(){ const b=document.getElementById("searchBg"); if(b) b.remove(); }
function searchSec(title){ return `<div class="search-sec">${esc(title)}</div>`; }
function searchItem(ic,title,sub,fn){ return `<button class="search-item" onclick="${fn}">${ic}<div class="si-txt"><div class="si-t">${title}</div><div class="si-s">${sub}</div></div></button>`; }
function runSearch(q){
  const res=document.getElementById("searchResults"); if(!res) return;
  q=(q||"").trim().toLowerCase();
  if(!S._searchReady){ res.innerHTML=`<div class="search-hint">Lade Suchdaten…</div>`; return; }
  if(q.length<2){ res.innerHTML=`<div class="search-hint">Mindestens 2 Zeichen eingeben.</div>`; return; }
  const hit=s=>(s||"").toString().toLowerCase().includes(q);
  let html="";
  if(canArea("objekte")){
    const ho=(S.houses||[]).filter(o=>hit(o.name)||hit(o.unit)||hit(o.address)).slice(0,8);
    if(ho.length) html+=searchSec("Objekte")+ho.map(o=>searchItem(I.building,esc(o.name),esc([o.unit&&("WE "+o.unit.replace(/^WE\s*/i,"")),o.address].filter(Boolean).join(" · ")),`closeSearch();openHouse('${o.id}')`)).join("");
  }
  if(canArea("tickets")){
    const ht=(S.tickets||[]).filter(t=>hit(t.title)||hit(t.description)||hit(t.unit)||hit(t.reporter)).slice(0,8);
    if(ht.length) html+=searchSec("Tickets")+ht.map(t=>searchItem(I.ticket,esc(t.title),esc(bezugLbl(t.bezug)+": "+tkRef(t)+" · "+t.status),`closeSearch();openTickets()`)).join("");
  }
  if(canArea("objekte") && S._searchDefects){
    const md=[];
    S._searchDefects.forEach(g=>g.defs.forEach(d=>{ const txt=d.area+" "+d.fields.map(f=>f.val).join(" "); if(hit(txt)) md.push({g,d}); }));
    if(md.length) html+=searchSec("Mängel")+md.slice(0,10).map(({g,d})=>searchItem(I.alert,esc(d.area),esc(g.house.name+" · "+((d.fields[0]&&d.fields[0].val)||d.cond)),`closeSearch();openDefects()`)).join("");
  }
  const hn={}; (S.houses||[]).forEach(h=>hn[h.id]=h.name);
  if(canArea("objekte")){
    const hz=(S._sZaehler||[]).filter(z=>hit(z.nummer)||hit(z.bezeichnung)||hit(z.medium)||hit(zStandort(z))||hit(z.msb)).slice(0,8);
    if(hz.length) html+=searchSec("Zähler")+hz.map(z=>searchItem(I.grid,esc(z.bezeichnung||z.nummer),
      esc([hn[z.houseId],"Nr. "+(z.nummer||"—"),zStandort(z)].filter(Boolean).join(" · ")),
      `closeSearch();openHouseZaehler('${z.houseId}')`)).join("");

    const ha=(S._sAnlagen||[]).filter(a=>hit(a.name)||hit(a.art)||hit(a.firm)||hit(a.note)).slice(0,6);
    if(ha.length) html+=searchSec("Anlagen & Prüfpflichten")+ha.map(a=>{
      const s=wartStatus(a);
      return searchItem(I.wrench,esc(a.name),esc([hn[a.houseId],a.art,s.next?"nächste "+fmtShort(s.next):""].filter(Boolean).join(" · ")),
        `closeSearch();openHouseWart('${a.houseId}')`);
    }).join("");

function cellHTML(r,col){
  const v=r.cells[col.id]||"";
  const full = (col.type==="longtext")?" full":"";
  let inner;
  if(col.type==="condition"){
    const opts=["gut","mittel","mangelhaft","nicht relevant"];
    inner=`<div class="seg">`+opts.map(o=>`<button data-v="${o}" class="${v===o?'on':''}" onclick="setCond('${r.id}','${col.id}','${o}')">${o}</button>`).join("")+`</div>`;
  } else if(col.type==="select"){
    const opts=col.options||[];
    inner=`<select onchange="setCell('${r.id}','${col.id}',this.value)"><option value="">–</option>`+
      opts.map(o=>`<option ${v===o?"selected":""}>${esc(o)}</option>`).join("")+`</select>`;
  } else if(col.type==="longtext"){
    inner=`<textarea placeholder="…" oninput="setCell('${r.id}','${col.id}',this.value)">${esc(v)}</textarea>`;
  } else {
    inner=`<input type="text" placeholder="…" value="${esc(v)}" oninput="setCell('${r.id}','${col.id}',this.value)">`;
  }
  return `<div class="cell${full}"><label>${esc(col.label)}</label>${inner}</div>`;
}

function photoStripHTML(r){
  const imgs=(r.images||[]).map(id=>`<div class="photo"><img data-img="${id}" alt=""><button class="rm" onclick="delPhoto('${r.id}','${id}')">${I.x}</button></div>`).join("");

async function renderCompare(){
  const o=S.houses.find(x=>x.id===S.houseId);

  const opts=S.hidx.map(x=>`<option value="${x.id}">${esc(fmtShort(x.date))} – ${esc(x.inspector||"ohne Begeher")}</option>`).join("");
  // Bereiche zusammenführen
  const keys=[]; const map={};
  function add(insp,side){
    if(!insp) return;
    const condCol=insp.columns.find(c=>c.type==="condition");
    const noteCol=insp.columns.find(c=>c.type==="longtext")||insp.columns.find(c=>c.type==="text");
    insp.rows.forEach(r=>{
      const k=normArea(r.cells.area); if(!k) return;
      if(!map[k]){ map[k]={label:r.cells.area}; keys.push(k); }
      map[k][side]={cond:condCol?r.cells[condCol.id]:"", note:noteCol?r.cells[noteCol.id]:"", imgs:r.images||[]};
    });
  }
  add(a,"a"); add(b,"b");
  const rows=keys.map(k=>{
    const m=map[k]; const A=m.a||{}, B=m.b||{};
    const changed=(A.cond||"")!==(B.cond||"");
    function cell(x){ if(!x) return '<span style="color:var(--faint)">nicht erfasst</span>';
      const c=x.cond?`<span class="chip ${condClass(x.cond)}">${esc(x.cond)}</span>`:'<span style="color:var(--faint)">–</span>';
      const n=x.note?`<div class="note">${esc(x.note)}</div>`:"";
      const t=(x.imgs||[]).map(id=>`<img class="t" data-img="${id}" alt="">`).join("");
      return c+n+t;
    }
    return `<tr><td class="ar">${esc(m.label)}</td><td class="${changed?'changed':''}">${cell(m.a)}</td><td class="${changed?'changed':''}">${cell(m.b)}</td></tr>`;
  }).join("");
  view.innerHTML=`
    <div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span><a onclick="openHouse('${S.houseId}')">${esc(o.name)}</a><span class="sep">/</span>Vergleich</div>

      <th>${esc(fmtShort(b?b.date:""))}<br><small style="font-weight:400;color:#AEB4C4">${esc(b?b.inspector:"")}</small></th>
