/* ===================== Mängelübersicht (objektübergreifend) ===================== */
async function collectDefects(){
  // Pro Objekt die jüngste Begehung -> alle "mangelhaft" und "mittel"-Punkte (Filterung erfolgt später)
  const groups=[];
  const insps=await DB.allInspectionsFull();   // absteigend nach Datum
  const latestByHouse={};
  insps.forEach(ins=>{ if(!latestByHouse[ins.houseId]) latestByHouse[ins.houseId]=ins; });
  for(const o of S.houses){
    const insp=latestByHouse[o.id];
    if(!insp) continue;
    const condCol=insp.columns.find(c=>c.type==="condition"); if(!condCol) continue;
    const textCols=insp.columns.filter(c=>c.type!=="area"&&c.type!=="condition");
    const prioCol=insp.columns.find(c=>c.type==="select"&&/prio/i.test(c.label));
    const defs=[];
    insp.rows.forEach(r=>{
      const cond=r.cells[condCol.id];
      if(cond!=="mangelhaft" && cond!=="mittel") return;
      const fields=textCols.filter(c=>c!==prioCol).map(c=>({label:c.label,val:r.cells[c.id]})).filter(f=>f.val);
      defs.push({ area:r.cells.area||"(ohne Bezeichnung)", fields, cond, prio:prioCol?(r.cells[prioCol.id]||""):"", img:(r.images||[])[0]||null });
    });
    if(defs.length){ groups.push({house:o, inspId:insp.id, date:insp.date, defs}); }
  }
  const rank={hoch:0,mittel:1,niedrig:2,keine:3,"":4};
  groups.forEach(g=>g.defs.sort((a,b)=>
    (a.cond==="mangelhaft"?0:1)-(b.cond==="mangelhaft"?0:1) || (rank[a.prio]??4)-(rank[b.prio]??4)
  ));
  return groups;
}
function filterDefects(all, f){
  const sev = f.severity==="both"? ["mangelhaft","mittel"] : ["mangelhaft"];
  let groups=all.map(g=>{
    let defs=g.defs.filter(d=>sev.includes(d.cond));
    if(f.prio!=="alle") defs=defs.filter(d=>(d.prio||"keine")===f.prio);
    return {...g, defs};
  }).filter(g=> g.defs.length && (f.house==="alle"||g.house.id===f.house));
  if(f.age && f.age!=="alle"){ const th=Number(f.age); groups=groups.filter(g=>monthsSince(g.date)>=th); }
  const sort=f.sort||"defects";
  groups.sort((a,b)=>{
    if(sort==="defects") return b.defs.length-a.defs.length || (a.house.name||"").localeCompare(b.house.name||"","de");
    if(sort==="oldest")  return (a.date||"").localeCompare(b.date||"");
    return (a.house.name||"").localeCompare(b.house.name||"","de");
  });
  return groups;
}
async function openDefects(){
  if(!canArea("objekte")) return goHome();
  S.view="defects";
  if(!S.defFilter) S.defFilter={severity:"mangelhaft",prio:"alle",house:"alle",age:"alle",sort:"defects"};
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Mängelübersicht</div>
    <div class="page-head"><div><h2>Mängelübersicht</h2><div class="lead">Lade Daten…</div></div></div>`;
  S.defAll=await collectDefects();
  drawDefects();
}
function setDefFilter(k,v){ S.defFilter[k]=v; drawDefects(); }
function drawDefects(){
  const all=S.defAll||[], f=S.defFilter;
  // verfügbare Prioritäten/Objekte aus Daten ableiten
  const prios=new Set(), houseIds=new Set();
  all.forEach(g=>{ g.defs.forEach(d=>prios.add(d.prio||"keine")); houseIds.add(g.house.id); });
  const prioOrder=["hoch","mittel","niedrig","keine"];
  const prioList=[...prios].sort((a,b)=>{ const ia=prioOrder.indexOf(a),ib=prioOrder.indexOf(b); return (ia<0?9:ia)-(ib<0?9:ib); });
  const filtered=filterDefects(all,f);
  const total=filtered.reduce((s,g)=>s+g.defs.length,0);
  const cntBad=filtered.reduce((s,g)=>s+g.defs.filter(d=>d.cond==="mangelhaft").length,0);
  const cntMid=total-cntBad;

  const filterBar=`<div class="filterbar card">
    <div class="ff"><label>Schweregrad</label><select onchange="setDefFilter('severity',this.value)">
      <option value="mangelhaft" ${f.severity==="mangelhaft"?"selected":""}>Nur Mängel (mangelhaft)</option>
      <option value="both" ${f.severity==="both"?"selected":""}>Mängel + Auffälligkeiten (mittel)</option>
    </select></div>
    <div class="ff"><label>Priorität</label><select onchange="setDefFilter('prio',this.value)">
      <option value="alle" ${f.prio==="alle"?"selected":""}>Alle Prioritäten</option>
      ${prioList.map(p=>`<option value="${esc(p)}" ${f.prio===p?"selected":""}>${esc(p.charAt(0).toUpperCase()+p.slice(1))}</option>`).join("")}
    </select></div>
    <div class="ff"><label>Objekt</label><select onchange="setDefFilter('house',this.value)">
      <option value="alle" ${f.house==="alle"?"selected":""}>Alle Objekte</option>
      ${S.houses.filter(h=>houseIds.has(h.id)).map(h=>`<option value="${h.id}" ${f.house===h.id?"selected":""}>${esc(h.name)}</option>`).join("")}
    </select></div>
    <div class="ff"><label>Letzte Begehung</label><select onchange="setDefFilter('age',this.value)">
      <option value="alle" ${f.age==="alle"?"selected":""}>Beliebig alt</option>
      <option value="6" ${f.age==="6"?"selected":""}>Älter als 6 Monate</option>
      <option value="12" ${f.age==="12"?"selected":""}>Älter als 12 Monate</option>
      <option value="24" ${f.age==="24"?"selected":""}>Älter als 24 Monate</option>
    </select></div>
    <div class="ff"><label>Sortierung</label><select onchange="setDefFilter('sort',this.value)">
      <option value="defects" ${f.sort==="defects"?"selected":""}>Meiste Punkte zuerst</option>
      <option value="oldest" ${f.sort==="oldest"?"selected":""}>Älteste Begehung zuerst</option>
      <option value="name" ${f.sort==="name"?"selected":""}>Objektname (A–Z)</option>
    </select></div>
    ${(f.severity!=="mangelhaft"||f.prio!=="alle"||f.house!=="alle"||f.age!=="alle"||f.sort!=="defects")?`<button class="btn sm ghost" style="align-self:flex-end" onclick="S.defFilter={severity:'mangelhaft',prio:'alle',house:'alle',age:'alle',sort:'defects'};drawDefects()">Filter zurücksetzen</button>`:""}
  </div>`;

  let body;
  if(!all.length){
    body=`<div class="empty card" style="border-style:dashed">${I.check}<h3>Keine offenen Punkte</h3><p>In der jeweils letzten Begehung jedes Objekts ist aktuell nichts als „mangelhaft" oder „mittel" bewertet.</p></div>`;
  } else if(!total){
    body=filterBar+`<div class="empty card" style="border-style:dashed">${I.alert}<h3>Keine Treffer</h3><p>Für die gewählten Filter gibt es keine Einträge. Passe die Filter an oder setze sie zurück.</p></div>`;
  } else {
    const groupsH=filtered.map(g=>{
      const rows=g.defs.map(d=>{
        const kv=d.fields.map(fl=>`<div class="kv"><b>${esc(fl.label)}:</b> ${esc(fl.val)}</div>`).join("");
        const condChip=`<span class="chip ${condClass(d.cond)}" style="margin-right:7px">${esc(d.cond)}</span>`;
        const prio=d.prio?`<span class="prio prio-${esc(d.prio)}">Priorität: ${esc(d.prio)}</span>`:"";
        const img=d.img?`<img class="thumb" data-img="${d.img}" alt="">`:"";
        return `<div class="def card ${d.cond==="mittel"?"mid":""}"><div class="body"><div class="area">${esc(d.area)}</div><div style="margin:2px 0 4px">${condChip}</div>${kv||'<div class="kv" style="color:var(--faint)">keine Beschreibung erfasst</div>'}${prio}</div>${img}</div>`;
      }).join("");
      const ms=monthsSince(g.date);
      const ageTxt = ms>=1?`vor ${ms} Monat${ms===1?"":"en"}`:"diesen Monat";
      const overdue = ms>=12?`<span class="chip bad" style="margin-left:7px">überfällig</span>`:"";
      return `<div class="def-group">
        <h3>${esc(g.house.name)} <span class="gcount">${g.defs.length} ${g.defs.length===1?"Punkt":"Punkte"}</span>${overdue}</h3>
        <div class="gsub">${esc(g.house.address||"")}${g.house.address?" · ":""}letzte Begehung ${esc(fmtShort(g.date))} (${ageTxt}) · <a style="color:var(--navy);cursor:pointer;font-weight:600" onclick="editInspection('${g.inspId}',true)">Begehung ansehen</a> · <a style="color:var(--navy);cursor:pointer;font-weight:600" onclick="mailDefectGroup('${g.house.id}')">Per E-Mail melden</a></div>
        ${rows}</div>`;
    }).join("");
    body=filterBar+`<div class="stat-row">
        <div class="stat bad"><div class="num">${cntBad}</div><div class="lbl">Mängel (mangelhaft)</div></div>
        ${f.severity==="both"?`<div class="stat" style="border-left:4px solid var(--mid)"><div class="num" style="color:var(--mid)">${cntMid}</div><div class="lbl">Auffälligkeiten (mittel)</div></div>`:""}
        <div class="stat"><div class="num">${filtered.length}</div><div class="lbl">betroffene Objekte</div></div>
      </div>${groupsH}`;
  }
  view.innerHTML=`<div class="crumb"><a onclick="goHome()">Objekte</a><span class="sep">/</span>Mängelübersicht</div>
    <div class="page-head">
      <div><h2>Mängelübersicht</h2><div class="lead">Offene Punkte aus der jeweils letzten Begehung jedes Objekts.</div></div>
      <div class="toolbar">${total?`<button class="btn primary" onclick="exportDefectsPDF()">${I.pdf} Als PDF</button>`:""}</div>
    </div>
    ${body}`;
  loadThumbs();
}
async function exportDefectsPDF(){
  if(!window.jspdf){ toast("PDF-Bibliothek lädt noch."); return; }
  const overlay=document.createElement("div"); overlay.className="pdf-overlay";
  overlay.innerHTML=`<div class="pdf-box"><div class="spin"></div><div style="font-weight:600">Mängelübersicht wird erstellt…</div></div>`;
  document.body.appendChild(overlay);
  try{
    const all=S.defAll||await collectDefects();
    const f=S.defFilter||{severity:"mangelhaft",prio:"alle",house:"alle"};
    const groups=filterDefects(all,f);
    const total=groups.reduce((s,g)=>s+g.defs.length,0), objects=groups.length;
    const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
    const PW=210,PH=297,M=15; let y=M;
    const navy=[32,42,68],muted=[110,106,96],line=[210,205,190],bad=[181,70,47],mid=[150,120,30];
    const cc=v=>v==="mangelhaft"?bad:v==="mittel"?mid:muted;
    const footer=()=>{ const pg=doc.internal.getNumberOfPages(); doc.setFontSize(8); doc.setFont("helvetica","normal"); doc.setTextColor(...muted);
      doc.text("Mängelübersicht · Stand "+fmtShort(todayISO()),M,PH-8); doc.text("Seite "+pg,PW-M,PH-8,{align:"right"}); };
    const ensure=h=>{ if(y+h>PH-15){ footer(); doc.addPage(); y=M; } };
    doc.setFillColor(...navy); doc.rect(0,0,PW,26,"F");
    doc.setTextColor(244,242,236); doc.setFont("helvetica","bold"); doc.setFontSize(17); doc.text("Mängelübersicht",M,13);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
    const scope=[ f.severity==="both"?"mangelhaft + mittel":"nur mangelhaft",
                  f.prio==="alle"?null:"Priorität: "+f.prio,
                  (f.age&&f.age!=="alle")?"älter als "+f.age+" Monate":null,
                  f.house==="alle"?null:(S.houses.find(h=>h.id===f.house)||{}).name ].filter(Boolean).join(" · ");
    doc.text(`${total} Punkte · ${objects} Objekte · ${scope} · Stand ${fmtShort(todayISO())}`,M,20);
    y=36;
    for(const g of groups){
      ensure(16);
      doc.setFont("helvetica","bold"); doc.setFontSize(12.5); doc.setTextColor(...navy);
      doc.text(g.house.name,M,y);
      doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...bad);
      doc.text(`${g.defs.length} ${g.defs.length===1?"Punkt":"Punkte"}`,PW-M,y,{align:"right"});
      y+=4.5; doc.setFontSize(8.5); doc.setTextColor(...muted);
      const ms=monthsSince(g.date);
      doc.text(`${g.house.address||""}${g.house.address?"  ·  ":""}letzte Begehung ${fmtShort(g.date)} (vor ${ms} Mon.)${ms>=12?"  ·  ÜBERFÄLLIG":""}`,M,y);
      y+=3; doc.setDrawColor(...line); doc.line(M,y,PW-M,y); y+=6;
      for(let i=0;i<g.defs.length;i++){
        const d=g.defs[i]; ensure(20);
        doc.setFillColor(...cc(d.cond)); doc.rect(M,y-3.5,1.6,row_h(d),"F");
        doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(40,38,33);
        doc.text(`${i+1}. ${d.area}`,M+4,y);
        doc.setFontSize(8); doc.setTextColor(...cc(d.cond));
        doc.text(d.cond+(d.prio?" · Prio: "+d.prio:""),PW-M,y,{align:"right"});
        y+=5;
        doc.setFontSize(9); 
        d.fields.forEach(f=>{
          ensure(6);
          doc.setFont("helvetica","bold"); doc.setTextColor(...muted);
          const lbl=f.label+": "; const lw=doc.getTextWidth(lbl);
          doc.text(lbl,M+4,y);
          doc.setFont("helvetica","normal"); doc.setTextColor(40,38,33);
          const lines=doc.splitTextToSize(String(f.val),PW-2*M-4-lw);
          doc.text(lines,M+4+lw,y); y+=lines.length*4.4+1;
        });
        if(d.img){ let data=await getImgDataURL(d.img); if(data){ data=await recompressDataURL(data,800,0.55); ensure(32); try{ doc.addImage(data,"JPEG",M+4,y,42,31); doc.setDrawColor(...line); doc.rect(M+4,y,42,31);}catch(e){} y+=34; } }
        y+=3;
      }
      y+=4;
    }
    function row_h(d){ return 6+d.fields.length*4+ (d.img?34:0); }
    footer();
    doc.save(`Maengeluebersicht_${todayISO()}.pdf`);
    overlay.remove(); toast("Mängelübersicht als PDF gespeichert.");
  }catch(e){ console.error(e); overlay.remove(); toast("PDF-Export fehlgeschlagen."); }
}

function setMeta(k,v){ S.insp[k]=v; if(k==="date") buildPrevMap().then(()=>render()); scheduleSave(); }
function setCell(rid,cid,v,reflow){
  const r=S.insp.rows.find(x=>x.id===rid); if(!r) return; r.cells[cid]=v;
  if(reflow){ buildPrevMap().then(()=>{ /* Vorbefund kann sich durch Umbenennen ändern */ updateRowPrev(rid); }); }

}
function updateRowPrev(rid){
  // nur den Vorbefund-Block der Zeile aktualisieren, ohne Eingabefokus zu verlieren
  const card=document.querySelector(`[data-row="${rid}"]`); if(!card) return;
  const r=S.insp.rows.find(x=>x.id===rid); const prev=S.prevMap[normArea(r.cells.area)];
  let existing=card.querySelector(".prev");
  const head=card.querySelector(".area-head");
  if(!prev){ if(existing) existing.remove(); return; }
  const condTxt=prev.cond?`<span class="chip ${condClass(prev.cond)}" style="margin-left:6px">${esc(prev.cond)}</span>`:"";
  const html=`${I.clock}<div style="flex:1"><div class="pl">Vorbefund · ${esc(fmtShort(prev.date))}</div><div class="pt">${condTxt}${prev.note?esc(prev.note):'<span style="color:var(--faint)">keine Bemerkung</span>'}</div></div>${prev.img?`<img class="pthumb" data-img="${prev.img}">`:""}`;
  if(existing){ existing.innerHTML=html; } else { existing=document.createElement("div"); existing.className="prev"; existing.innerHTML=html; head.insertAdjacentElement("afterend",existing); }
  loadThumbs();
}
function setCond(rid,cid,v){
  const r=S.insp.rows.find(x=>x.id===rid); if(!r) return;
  r.cells[cid]= (r.cells[cid]===v)? "" : v;
  // Buttons der Zeile/Spalte neu zeichnen
  const card=document.querySelector(`[data-row="${rid}"]`);
  card.querySelectorAll(`.seg`).forEach(seg=>{
    seg.querySelectorAll("button").forEach(b=>{
      const on = b.getAttribute("onclick").includes(`'${cid}'`) && b.dataset.v===r.cells[cid];
      if(b.getAttribute("onclick").includes(`'${cid}'`)) b.classList.toggle("on", b.dataset.v===r.cells[cid]);
    });
  });
  scheduleSave();
}
function addArea(){
  S.insp.rows.push(emptyRow(""));
  const c=document.getElementById("areas");
  const i=S.insp.rows.length-1;
  c.insertAdjacentHTML("beforeend", areaCardHTML(S.insp.rows[i],i,S.insp));

function delArea(rid){

    const r=S.insp.rows.find(x=>x.id===rid);

function moveArea(rid,dir){

/* ---------- Fotos ---------- */
async function addPhotos(rid,inp){
  const files=[...inp.files]; inp.value="";
  if(!files.length) return;
  const strip=document.querySelector(`[data-strip="${rid}"]`);
  const addBtn=strip.querySelector(".add-photo");
  for(const f of files){
    const spin=document.createElement("div"); spin.className="ph-spin"; spin.innerHTML='<div class="spin" style="width:20px;height:20px;border:3px solid var(--line2);border-top-color:var(--navy);border-radius:50%;animation:rot 1s linear infinite"></div>';
    strip.insertBefore(spin,addBtn);
    try{
      const data=await compressFile(f,1280,0.72);   // Speicherkompression
      const path=await uploadPhoto(S.insp.id, data); // Upload in Supabase-Bucket
      const r=S.insp.rows.find(x=>x.id===rid); r.images=r.images||[]; r.images.push(path);
      spin.outerHTML=`<div class="photo"><img src="${data}" data-img="${path}" alt=""><button class="rm" onclick="delPhoto('${rid}','${path.replace(/'/g,"")}')">${I.x}</button></div>`;
      await persistInsp();   // Foto-Verweis sofort sichern
    }catch(e){ spin.remove(); showError("Foto konnte nicht hochgeladen werden", e); }
  }
  scheduleSave();
}
function delPhoto(rid,imgPath){
  const r=S.insp.rows.find(x=>x.id===rid); if(!r) return;
  r.images=(r.images||[]).filter(x=>x!==imgPath);
  removePhoto(imgPath);
  const strip=document.querySelector(`[data-strip="${rid}"]`);
  [...strip.querySelectorAll(".photo")].forEach(p=>{ if(p.querySelector("img")?.dataset.img===imgPath) p.remove(); });
  scheduleSave();
}

function openColumns(){
  const cols=S.insp.columns;
  const rowsH=cols.map((c,i)=>{
    if(c.type==="area"){
      return `<div class="col-row"><input class="cn" value="${esc(c.label)}" oninput="renameCol('${c.id}',this.value)"><span class="lock">Pflichtspalte (Bereich)</span></div>`;
    }
    const sel=["text","longtext","condition","select"].map(t=>`<option value="${t}" ${c.type===t?"selected":""}>${({text:"Kurztext",longtext:"Langtext",condition:"Zustand",select:"Auswahl"})[t]}</option>`).join("");
    const optInput=c.type==="select"?`<input class="cn" style="flex:2;font-weight:400;font-size:12px;border:1px solid var(--line2);border-radius:7px;padding:5px 8px" placeholder="Optionen, Komma-getrennt" value="${esc((c.options||[]).join(", "))}" oninput="setColOptions('${c.id}',this.value)">`:"";
    return `<div class="col-row">
      <input class="cn" value="${esc(c.label)}" oninput="renameCol('${c.id}',this.value)">
      <select onchange="setColType('${c.id}',this.value)">${sel}</select>
      ${optInput}
      <button class="icon-btn tiny" ${i<=1?"disabled":""} onclick="moveCol('${c.id}',-1)">${I.up}</button>
      <button class="icon-btn tiny" onclick="moveCol('${c.id}',1)">${I.down}</button>
      <button class="icon-btn" onclick="delCol('${c.id}')">${I.trash}</button>
    </div>`;
  }).join("");
  modal(`<h3>Spalten verwalten</h3><p class="m">Spalten gelten für alle Bereiche dieser Begehung. Typ „Zustand" zeigt die farbige Bewertung, „Auswahl" ein Dropdown.</p>
    <div class="col-list">${rowsH}</div>
    <button class="btn" onclick="addCol()">${I.plus} Spalte hinzufügen</button>
    <div class="modal-actions"><button class="btn primary" onclick="closeModal();renderEditor(false);loadThumbs()">Fertig</button></div>`);
}
function renameCol(id,v){ const c=S.insp.columns.find(x=>x.id===id); if(c){ c.label=v; scheduleSave(); } }
function setColType(id,t){ const c=S.insp.columns.find(x=>x.id===id); if(c){ c.type=t; if(t==="select"&&!c.options) c.options=["Option 1","Option 2"]; scheduleSave(); openColumns(); } }
function setColOptions(id,v){ const c=S.insp.columns.find(x=>x.id===id); if(c){ c.options=v.split(",").map(s=>s.trim()).filter(Boolean); scheduleSave(); } }
function addCol(){ S.insp.columns.push({id:uid(),label:"Neue Spalte",type:"text"}); S.insp.rows.forEach(r=>{}); scheduleSave(); openColumns(); }
function delCol(id){
  const c=S.insp.columns.find(x=>x.id===id); if(!c||c.type==="area") return;
  S.insp.columns=S.insp.columns.filter(x=>x.id!==id);
  S.insp.rows.forEach(r=>delete r.cells[id]); scheduleSave(); openColumns();
}
function moveCol(id,dir){
  const cols=S.insp.columns; const i=cols.findIndex(x=>x.id===id); const j=i+dir;
  if(j<1||j>=cols.length) return; // 0 = area bleibt vorn
  [cols[i],cols[j]]=[cols[j],cols[i]]; scheduleSave(); openColumns();
}

/* ===================== PDF-Export ===================== */
async function exportPDF(id){
  const insp = id? await DB.getInspection(id) : S.insp;
  if(!insp){ toast("Keine Begehung gefunden."); return; }
  const house=S.houses.find(h=>h.id===insp.houseId)||{name:"Objekt"};
  if(!window.jspdf){ toast("PDF-Bibliothek lädt noch – bitte erneut versuchen."); return; }
  const overlay=document.createElement("div"); overlay.className="pdf-overlay";
  overlay.innerHTML=`<div class="pdf-box"><div class="spin"></div><div style="font-weight:600">PDF wird erstellt…</div><div style="color:var(--muted);font-size:13px;margin-top:4px" id="pdfStatus">Bilder werden komprimiert</div></div>`;
  document.body.appendChild(overlay);
  const status=overlay.querySelector("#pdfStatus");
  try{
    const { jsPDF }=window.jspdf;
    const doc=new jsPDF({unit:"mm",format:"a4"});
    const PW=210, PH=297, M=15; let y=M;
    const navy=[32,42,68], muted=[110,106,96], line=[210,205,190];
    const ensure=(h)=>{ if(y+h>PH-15){ footer(); doc.addPage(); y=M; } };
    const condColor=v=>v==="gut"?[62,124,90]:v==="mittel"?[150,120,30]:v==="mangelhaft"?[181,70,47]:[140,136,125];

    // Kopf
    doc.setFillColor(...navy); doc.rect(0,0,PW,26,"F");
    doc.setTextColor(244,242,236); doc.setFont("helvetica","bold"); doc.setFontSize(17);
    doc.text("Objektbegehungsprotokoll",M,13);
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    doc.text(house.name+(house.unit?" · WE "+house.unit.replace(/^WE\s*/i,""):"")+(house.address?" · "+house.address:""),M,20);
    y=34;
    doc.setTextColor(40,38,33); doc.setFontSize(10);
    const meta=[["Begehungsdatum",fmtDate(insp.date)],["Begeher / Verwalter",insp.inspector||"–"],["Firma",insp.firm||"–"],["Witterung / Hinweis",insp.weather||"–"]];
    meta.forEach(m=>{ doc.setFont("helvetica","bold"); doc.text(m[0]+":",M,y); doc.setFont("helvetica","normal"); doc.text(String(m[1]),M+45,y); y+=6; });
    y+=2; doc.setDrawColor(...line); doc.line(M,y,PW-M,y); y+=8;

    const condCol=insp.columns.find(c=>c.type==="condition");
    const textCols=insp.columns.filter(c=>c.type!=="area"&&c.type!=="condition");

    for(let r=0;r<insp.rows.length;r++){
      const row=insp.rows[r];
      status.textContent=`Bereich ${r+1} von ${insp.rows.length}`;
      ensure(20);
      // Bereichstitel + Zustand
      doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.setTextColor(...navy);
      const title=`${r+1}. ${row.cells.area||"(ohne Bezeichnung)"}`;
      doc.text(title,M,y);
      if(condCol && row.cells[condCol.id]){
        const v=row.cells[condCol.id]; const c=condColor(v);
        const tw=doc.getTextWidth(v)+6;
        doc.setFillColor(c[0],c[1],c[2]); doc.roundedRect(PW-M-tw,y-4.2,tw,6,1.5,1.5,"F");
        doc.setTextColor(255,255,255); doc.setFontSize(8.5); doc.setFont("helvetica","bold");
        doc.text(v,PW-M-tw+3,y);
      }
      y+=5.5;
      // Textfelder
      doc.setFontSize(9.5); doc.setTextColor(40,38,33);
      textCols.forEach(col=>{
        const val=row.cells[col.id]; if(!val) return;
        doc.setFont("helvetica","bold"); doc.setTextColor(...muted);
        const lbl=col.label+": ";
        const lblW=doc.getTextWidth(lbl);
        ensure(6);
        doc.text(lbl,M,y);
        doc.setFont("helvetica","normal"); doc.setTextColor(40,38,33);
        const lines=doc.splitTextToSize(String(val),PW-2*M-lblW);
        doc.text(lines,M+lblW,y);
        y+=lines.length*4.6+1.5;
      });
      // Fotos (komprimiert eingebettet)
      if(row.images&&row.images.length){
        const imW=46, imH=34, gap=4; let x=M;
        ensure(imH+4); y+=1;
        for(const imgId of row.images){
          let data=await getImgDataURL(imgId); if(!data) continue;
          data=await recompressDataURL(data,900,0.6);   // PDF-Kompression
          if(x+imW>PW-M){ x=M; ensure(imH+4); y+=imH+gap; }
          try{ doc.addImage(data,"JPEG",x,y,imW,imH); }catch(e){}
          doc.setDrawColor(...line); doc.rect(x,y,imW,imH);
          x+=imW+gap;
        }
        y+=imH+5;
      }
      ensure(6); doc.setDrawColor(...line); doc.setLineWidth(0.2); doc.line(M,y,PW-M,y); y+=7;
    }
    footer();
    function footer(){
      const pg=doc.internal.getNumberOfPages();
      doc.setFontSize(8); doc.setTextColor(...muted); doc.setFont("helvetica","normal");
      doc.text(`${house.name} – Begehung ${fmtShort(insp.date)}`,M,PH-8);
      doc.text("Seite "+pg,PW-M,PH-8,{align:"right"});
    }
    const fn=`Begehung_${(house.name||"Objekt").replace(/[^\w\säöüÄÖÜß-]/g,"").replace(/\s+/g,"_")}_${insp.date}.pdf`;
    doc.save(fn);
    overlay.remove();
    toast("PDF erstellt – Bilder wurden komprimiert.");
  }catch(e){ console.error(e); overlay.remove(); toast("PDF-Export fehlgeschlagen."); }
}

function modal(html){ closeModal(); const bg=document.createElement("div"); bg.className="modal-bg"; bg.id="modalBg";
  bg.innerHTML=`<div class="modal">${html}</div>`; bg.onclick=e=>{ if(e.target===bg) closeModal(); }; document.body.appendChild(bg); }
function closeModal(){ document.getElementById("modalBg")?.remove(); }
function confirmModal(title,msg,onYes){
  modal(`<h3>${esc(title)}</h3><p class="m">${esc(msg)}</p>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Abbrechen</button>
    <button class="btn danger primary" style="background:var(--bad);border-color:var(--bad)" id="cfYes">Löschen</button></div>`);
  document.getElementById("cfYes").onclick=()=>{ closeModal(); onYes(); };
}
let toastT=null;
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }
function fmtErr(e){
  if(!e) return "unbekannt";
  if(typeof e==="string") return e;
  return [e.message, e.code?("Code: "+e.code):null, e.hint, e.details].filter(Boolean).join("  —  ") || JSON.stringify(e);
}
function showError(title,e){
  modal(`<h3>${esc(title)}</h3><p class="m" style="white-space:pre-wrap;word-break:break-word;color:var(--bad)">${esc(fmtErr(e))}</p><div class="modal-actions"><button class="btn primary" onclick="closeModal()">OK</button></div>`);
}

async function doLogin(){
  const email=(document.getElementById("logMail").value||"").trim();
  const pw=document.getElementById("logPw").value||"";
  const err=document.getElementById("logErr");
  err.style.display="none";
  if(!email||!pw){ err.textContent="Bitte E-Mail und Passwort eingeben."; err.style.display="block"; return; }
  const btn=document.getElementById("logBtn"); btn.textContent="Anmelden…"; btn.disabled=true;
  try{
    const { data, error }=await sb.auth.signInWithPassword({email,password:pw});
    if(error){ err.textContent="Anmeldung fehlgeschlagen: "+error.message; err.style.display="block"; btn.textContent="Anmelden"; btn.disabled=false; return; }
    await onAuth(data.session);
  }catch(e){ err.textContent="Anmeldung fehlgeschlagen."; err.style.display="block"; btn.textContent="Anmelden"; btn.disabled=false; }
}
function pwError(pw,pw2){ if((pw||"").length<8) return "Das Passwort muss mindestens 8 Zeichen haben."; if(pw!==pw2) return "Die Passwörter stimmen nicht überein."; return ""; }
function openForgot(){

  </div></div>`;
  document.getElementById("fpBtn").onclick=forgotPassword;
  setTimeout(()=>document.getElementById("fpMail")?.focus(),50);
}
async function forgotPassword(){
  const email=(document.getElementById("fpMail").value||"").trim();
  const msg=document.getElementById("fpMsg");
  if(!email||!email.includes("@")){ msg.style.display="block"; msg.style.color="var(--bad)"; msg.textContent="Bitte eine gültige E-Mail eingeben."; return; }
  const btn=document.getElementById("fpBtn"); btn.disabled=true; btn.textContent="Senden…";
  try{
    await sb.auth.resetPasswordForEmail(email,{ redirectTo: location.origin+location.pathname });
  }catch(e){}
  msg.style.display="block"; msg.style.color="var(--good)";
  msg.textContent="Falls ein Konto mit dieser E-Mail existiert, wurde ein Link zum Zurücksetzen gesendet. Bitte prüfe deinen Posteingang (auch Spam).";
  btn.disabled=false; btn.textContent="Link senden";
}
function renderResetPassword(){
  document.getElementById("userBox").style.display="none";
  view.innerHTML=`<div style="max-width:380px;margin:8vh auto 0"><div class="card" style="padding:26px">
    <h2 style="font-size:24px;margin-bottom:4px">Neues Passwort festlegen</h2>
    <p style="color:var(--muted);font-size:13.5px;margin:0 0 18px">Bitte vergib ein neues Passwort für dein Konto.</p>
    <div class="field" style="margin-bottom:12px"><label>Neues Passwort</label><input id="rpPw" type="password" placeholder="mindestens 8 Zeichen" autocomplete="new-password"></div>
    <div class="field" style="margin-bottom:14px"><label>Wiederholen</label><input id="rpPw2" type="password" autocomplete="new-password"></div>
    <div id="rpMsg" style="color:var(--bad);font-size:13px;margin-bottom:12px;display:none"></div>
    <button class="btn primary" style="width:100%;justify-content:center" id="rpBtn">Passwort speichern</button>
  </div></div>`;
  document.getElementById("rpBtn").onclick=submitNewPassword;
  setTimeout(()=>document.getElementById("rpPw")?.focus(),50);
}
async function submitNewPassword(){
  const pw=document.getElementById("rpPw").value||"", pw2=document.getElementById("rpPw2").value||"";
  const msg=document.getElementById("rpMsg");
  const v=pwError(pw,pw2); if(v){ msg.style.display="block"; msg.textContent=v; return; }
  const btn=document.getElementById("rpBtn"); btn.disabled=true; btn.textContent="Speichern…";
  try{
    const { error }=await sb.auth.updateUser({password:pw});
    if(error){ msg.style.display="block"; msg.textContent="Fehlgeschlagen: "+error.message; btn.disabled=false; btn.textContent="Passwort speichern"; return; }
    try{ history.replaceState(null,"",location.pathname); }catch(e){} location.hash="";
    toast("Passwort aktualisiert.");
    let session=null; try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
    if(session) await onAuth(session); else renderLogin();
  }catch(e){ msg.style.display="block"; msg.textContent="Fehlgeschlagen."; btn.disabled=false; btn.textContent="Passwort speichern"; }
}
function openChangePassword(){
  modal(`<h3>Passwort ändern</h3><p class="m">Vergib ein neues Passwort für ${esc(S.userEmail||"dein Konto")}.</p>
    <div class="field" style="margin-bottom:10px"><label>Neues Passwort</label><input id="cpPw" type="password" placeholder="mindestens 8 Zeichen" autocomplete="new-password"></div>

    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="submitChangePassword()">Speichern</button></div>`);
}
async function submitChangePassword(){
  const pw=document.getElementById("cpPw").value||"", pw2=document.getElementById("cpPw2").value||"";
  const msg=document.getElementById("cpMsg");
  const v=pwError(pw,pw2); if(v){ msg.style.display="block"; msg.textContent=v; return; }
  try{
    const { error }=await sb.auth.updateUser({password:pw});
    if(error){ msg.style.display="block"; msg.textContent="Fehlgeschlagen: "+error.message; return; }
    closeModal(); toast("Passwort geändert.");
  }catch(e){ showError("Passwort konnte nicht geändert werden", e); }
}
async function loadPerm(){
  try{
    const { data, error } = await sb.from('app_users').select('objekte,reinigung,aufzuege,sanierung,tickets,admin').limit(1).maybeSingle();
    if(error){ S.permKnown=false; S.perm={objekte:true,reinigung:true,aufzuege:true,sanierung:true,tickets:true,admin:true}; return; } // Rollen noch nicht eingerichtet -> alles sichtbar
    S.permKnown=true;
    if(!data){ S.perm={objekte:false,reinigung:false,aufzuege:false,sanierung:false,tickets:false,admin:false}; return; }
    const ad=!!data.admin;
    S.perm={objekte:ad||!!data.objekte, reinigung:ad||!!data.reinigung, aufzuege:ad||!!data.aufzuege, sanierung:ad||!!data.sanierung, tickets:ad||!!data.tickets, admin:ad};
  }catch(e){ S.permKnown=false; S.perm={objekte:true,reinigung:true,aufzuege:true,sanierung:true,tickets:true,admin:true}; }
}
function canArea(a){ const p=S.perm||{}; return p.admin || !!p[a]; }
function allowedView(v){
  if(["house","editor","viewer","compare","defects","wartung","stammblatt","dokumente","ablesung","etiketten","erfassung"].includes(v)) return canArea("objekte");
  if(["reinigung","reinigungObj"].includes(v)) return canArea("reinigung");
  if(["aufzuege","aufzug"].includes(v)) return canArea("aufzuege");
  if(v==="sanierung") return canArea("sanierung");
  if(v==="tickets") return canArea("tickets");
  if(v==="meldungen") return canArea("objekte")||canArea("aufzuege");
  if(v==="kontakte") return canArea("objekte")||canArea("aufzuege")||canArea("tickets");
  return true;
}
async function onAuth(session){
  const ub=document.getElementById("userBox");
  ub.style.display="flex";
  S.userEmail=(session&&session.user&&session.user.email)||"";
  document.getElementById("userMail").textContent=S.userEmail;
  await loadPerm();
  await goHome();
  netRefresh();
  offRegisterSW();               // App im Gerät ablegen, damit sie ohne Netz startet
  if(istOnline() && offCount()) offSync(true);   // Nachzügler aus der letzten Begehung übertragen
  zCheckHash();                  // Direkteinstieg per QR-Code (#z=…)
}

(async function init(){
  if(cfgPlaceholder()){ renderSetup(); return; }
  if(!libReady()){ renderLibError(); return; }
  try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch(e){ renderLibError(); return; }
  const lo=document.getElementById("logoutBtn");
  if(lo) lo.onclick=doLogout;
  let recovery = /type=recovery/.test(location.hash||"");
  try{ sb.auth.onAuthStateChange((event)=>{ if(event==="PASSWORD_RECOVERY"){ recovery=true; renderResetPassword(); } }); }catch(e){}
  let session=null;
  try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
  if(recovery){ renderResetPassword(); return; }
  if(session) await onAuth(session); else renderLogin();
})();

<script>
(function(){
  var LSK="om_ai_key", LSM="om_ai_model", DEF_MODEL="claude-haiku-4-5-20251001";
  var conv=[]; var busy=false;
  function gk(){ try{return localStorage.getItem(LSK)||""}catch(e){return ""} }
  function gm(){ try{return localStorage.getItem(LSM)||DEF_MODEL}catch(e){return DEF_MODEL} }
  function el(id){ return document.getElementById(id); }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

  function setKey(v){ try{ v?localStorage.setItem(LSK,v):localStorage.removeItem(LSK); }catch(e){} status(); }
  function status(){
    var s=el("aiStatus"); if(!s) return;
    var k=gk(), mName=(el("aiModel")&&el("aiModel").selectedOptions[0]?el("aiModel").selectedOptions[0].text.split(" – ")[0]:gm());
    if(k){ s.style.background="#e8f7ee"; s.style.color="#15653a"; s.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:#1a9e5b;display:inline-block"></span>KI aktiv · '+esc(mName); }
    else { s.style.background="#fdf3e3"; s.style.color="#8a5a10"; s.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:#e0a030;display:inline-block"></span>Noch nicht aktiviert – API-Key unter „Einstellungen" eintragen'; }
  }
  window.AIOpen=function(){ el("aiPanel").classList.add("open"); el("aiFab").style.display="none";
    var k=el("aiKey"); if(k&&!k.value) k.value=gk(); var m=el("aiModel"); if(m) m.value=gm();
    if(!gk()){ el("aiCfg").open=true; }
    status();
    if(!conv.length){ push("sys","Hallo! Ich bin dein KI-Assistent für dieses Objektmanagement-Portal. Ich kann den Bestand zusammenfassen, Aufgaben priorisieren und Schreiben an Dienstleister entwerfen. Wähle unten eine Aktion oder stell eine Frage."); render(); }
    setTimeout(function(){ el("aiText") && el("aiText").focus(); },50);
  };
  window.AIClose=function(){ el("aiPanel").classList.remove("open"); el("aiFab").style.display="inline-flex"; };
  window.AIQuick=function(t){ el("aiText").value=t; AISend(); };

  document.addEventListener("DOMContentLoaded",function(){
    var k=el("aiKey"), m=el("aiModel"), c=el("aiKeyClear");
    if(k){ k.value=gk(); k.addEventListener("input",function(){ setKey(k.value.trim()); }); }
    if(m){ m.value=gm(); m.addEventListener("change",function(){ try{localStorage.setItem(LSM,m.value);}catch(e){} status(); }); }
    if(c){ c.addEventListener("click",function(){ if(k) k.value=""; setKey(""); el("aiCfg").open=true; }); }
    status();
  });

  function push(role,content){ conv.push({role:role,content:content}); }
  function render(){
    var box=el("aiMsgs"); if(!box) return;
    box.innerHTML=conv.map(function(m){ return '<div class="ai-b '+m.role+'">'+esc(m.content)+'</div>'; }).join("");
    box.scrollTop=box.scrollHeight;
  }
  function setBusy(b){ busy=b; var s=el("aiSendBtn"); if(s){ s.disabled=b; s.textContent=b?"…":"Senden"; } }

  async function buildContext(){
    var lines=[]; 
    try{
      var houses=(window.S&&S.houses&&S.houses.length)?S.houses:await DB.listHouses();
      var hn={}; houses.forEach(function(h){ hn[h.id]=h.name; });
      lines.push("OBJEKTE ("+houses.length+"): "+houses.map(function(h){return h.name+" ("+(h.address||"")+")";}).join("; "));
      var tk=await DB.listTickets(); var open=tk.filter(function(t){return t.status!=="erledigt";});
      lines.push("OFFENE TICKETS ("+open.length+"): "+open.map(function(t){return t.title+" ["+(hn[t.houseId]||"")+", Prio "+(t.prio||"-")+", "+t.status+(t.firm?(", Firma "+t.firm):"")+"]";}).join("; "));
      var an=await DB.allAnlagen(); var due=[];
      an.forEach(function(a){ try{ var s=wartStatus(a); if(s&&(s.level==="overdue"||s.level==="soon")) due.push(a.name+" @ "+(hn[a.houseId]||"")+" ("+(s.level==="overdue"?"überfällig":"bald fällig")+(a.firm?(", "+a.firm):"")+")"); }catch(e){} });
      lines.push("WARTUNG/PRÜFPFLICHTEN FÄLLIG ("+due.length+"): "+(due.join("; ")||"keine"));
      var san=await DB.listSanierungen();
      lines.push("SANIERUNGEN: "+san.map(function(s){return s.title+" ["+(hn[s.houseId]||"")+", "+s.status+"]";}).join("; "));
      var ml=await DB.listMeldungenLog();
      lines.push("MELDUNGEN: "+ml.map(function(m){return m.subject+" ["+m.status+", Frist "+(m.dueDate||"-")+"]";}).join("; "));
      var zz=await DB.allZaehler(), aa=await DB.allAblesungen(), per=String(new Date().getFullYear());
      var zTxt=zz.map(function(z){
        var c=aa.filter(function(x){return x.zaehlerId===z.id && (x.datum||"").slice(0,4)===per;})
               .sort(function(a,b){return (b.datum||"").localeCompare(a.datum||"");})[0];
        var st=c? (c.status==="abgelesen"? ("abgelesen "+c.stand) : c.status) : "offen";
        return (z.bezeichnung||z.nummer)+" @ "+(hn[z.houseId]||"")+" ["+z.art+", "+z.medium+", "+st
             + (zStandort(z)? (", Standort: "+zStandort(z)) : ", Standort nicht erfasst")+"]";
      });
      lines.push("ZÄHLER / ABLESUNG "+per+" ("+zz.length+"): "+(zTxt.join("; ")||"keine"));
    }catch(e){ lines.push("(Kontext teilweise nicht verfügbar)"); }
    return lines.join("\n");
  }

  window.AISend=async function(){
    if(busy) return;
    var ta=el("aiText"); var text=(ta.value||"").trim(); if(!text) return;
    var key=(el("aiKey").value||gk()).trim();
    var model=(el("aiModel").value||gm()).trim()||DEF_MODEL;
    setKey(key); try{ localStorage.setItem(LSM,model); }catch(e){}
    if(!key){ el("aiCfg").open=true; push("assistant","Bitte trage oben unter „Einstellungen“ deinen Anthropic API-Key ein. Er bleibt nur in deinem Browser und wird nach dem Eintragen dauerhaft gespeichert."); render(); return; }
    ta.value=""; push("user",text); render(); setBusy(true);
    var context=await buildContext();
    var sys="Du bist der KI-Assistent eines Objektmanagement-Portals (Hausverwaltung). "+
      "Antworte auf Deutsch, sachlich und knapp. Nutze ausschließlich die folgenden Bestandsdaten (anonymisierte Demodaten). "+
      "Du darfst zusammenfassen, priorisieren und Schreiben an Dienstleister/Eigentümer entwerfen. Wenn Daten fehlen, sage das.\n\nBESTANDSDATEN:\n"+context;
    try{
      var res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{ "content-type":"application/json", "x-api-key":key, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
        body:JSON.stringify({ model:model, max_tokens:1000, system:sys, messages:conv.filter(function(m){return m.role==="user"||m.role==="assistant";}).map(function(m){return {role:m.role,content:m.content};}) })
      });
      var data=await res.json();
      if(data && data.error){
        var tip = res.status===401 ? "Der API-Key wird nicht akzeptiert – bitte unter „Einstellungen“ prüfen (vollständig kopiert? Key noch aktiv?)."
                : res.status===400 ? "Meist ein ungültiger Modellname – wähle unter „Einstellungen“ ein Modell aus der Liste."
                : res.status===429 ? "Rate-Limit oder Guthaben aufgebraucht – kurz warten bzw. Guthaben im Anthropic-Konto prüfen."
                : "Tipp: Modell und Key unter „Einstellungen“ prüfen.";
        push("assistant","Fehler von der API ("+res.status+"): "+(data.error.message||JSON.stringify(data.error))+"\n\n"+tip);
      }
      else { var txt=((data&&data.content)||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n").trim()||"(keine Antwort erhalten)"; push("assistant",txt); }
    }catch(e){ push("assistant","Verbindungsfehler: "+(e&&e.message?e.message:e)+"\n(Bei GitHub Pages bitte online sein; der Browser ruft die Anthropic-API direkt auf.)"); }
    setBusy(false); render();
  };
})();
</script>
</body>
</html>
